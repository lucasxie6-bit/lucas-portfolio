}
.aisp-upd-applied svg { width: 13px; height: 13px; }
.aisp-upd-body { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
.aisp-upd-paperwrap { padding: 14px; background: #F6F7FA; border-right: 1px solid #E8EAF0; }
.aisp-upd-paper {
  padding: 16px 16px 12px; background: #fff; border: 1px solid #E6E8EE; border-radius: 6px;
  box-shadow: 0 2px 8px -4px rgba(22,38,60,.18);
}
.aisp-upd-name { text-align: center; font-size: 14px; font-weight: 700; color: #16263C; }
.aisp-upd-contact { margin-top: 3px; font-size: 9.5px; color: #7D889A; text-align: left; }
.aisp-upd-sec {
  margin: 11px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #DADDE5;
  font-size: 10px; font-weight: 700; color: #16263C;
}
.aisp-upd-ent { display: flex; justify-content: space-between; gap: 8px; margin: 7px 0 3px; }
.aisp-upd-ent-t { font-size: 10.5px; font-weight: 700; color: #16263C; }
.aisp-upd-ent-y { flex: none; font-size: 9.5px; color: #7D889A; }
.aisp-upd-bl { margin: 0 0 4px; font-size: 10px; line-height: 1.55; color: #3E4A5C; }
.aisp-upd-hit { padding: 0 3px; border-radius: 3px; background: #E3F2E8; color: #23633B; }
.aisp-upd-side { display: flex; flex-direction: column; }
.aisp-upd-fit {
  margin: 12px; padding: 14px 12px 12px; border-radius: 12px; background: #E9F4EC; text-align: center;
}
.aisp-upd-ringwrap { position: relative; width: 84px; height: 84px; margin: 0 auto; }
.aisp-upd-ring { width: 84px; height: 84px; display: block; }
.aisp-upd-ringn {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800; color: #1F4E35; letter-spacing: -.03em;
}
.aisp-upd-ringn small { font-size: 11px; font-weight: 700; margin-left: 1px; }
.aisp-upd-fit-t { margin-top: 8px; font-size: 12.5px; font-weight: 750; color: #1F4E35; }
.aisp-upd-fit-s { margin-top: 2px; font-size: 11px; color: #3D7A57; line-height: 1.35; }
.aisp-upd-team { padding: 12px 14px 14px; border-top: 1px solid #E8EAF0; }
.aisp-upd-team-h { font-size: 11px; color: #6B778A; }
.aisp-upd-person { display: flex; align-items: center; gap: 9px; margin-top: 9px; }
.aisp-upd-face {
  flex: none; width: 32px; height: 32px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: #8E2B2B; color: #fff; font-size: 11px; font-weight: 700;
}
.aisp-upd-pw { display: flex; flex-direction: column; min-width: 0; }
.aisp-upd-pn { font-size: 12px; font-weight: 700; color: #16263C; }
.aisp-upd-pt { font-size: 11px; color: #6B778A; }
.aisp-upd-mail { margin-top: 9px; font-size: 11.5px; font-weight: 600; color: #1E3A5F; }

/* ── The right pane: the offer ─────────────────────────────────────────────── */
.aisp-up-side {
  flex: 0 0 370px; max-width: 370px; display: flex; flex-direction: column;
  padding: 26px 26px 20px; background: #253858;
}
.aisp-up-top { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
/* logo-navy.svg IS a navy rounded square with the U in it, so the white
   behind it is a frame and not a tile: at 40px around a 23px mark it drew
   the logo twice, once in white and once in navy. */
.aisp-up-mark {
  flex: none; width: 30px; height: 30px; border-radius: 9px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 1.5px solid rgba(255,255,255,.35);
}
.aisp-up-mark img { width: 22px; height: 22px; display: block; border-radius: 6px; }
.aisp-up-brand {
  flex: 1 1 auto; font-size: 16px; font-weight: 700; letter-spacing: -.01em; color: #fff;
}
.aisp-up-x {
  flex: none; width: 34px; height: 34px; border: 0; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: none; color: rgba(255,255,255,.85);
  cursor: pointer; transition: background .12s, color .12s;
}
.aisp-up-x:hover { background: rgba(255,255,255,.17); color: #fff; }
.aisp-up-x svg { width: 14px; height: 14px; }
.aisp-up-h {
  margin: 0; font-size: 29px; font-weight: 750; line-height: 1.14;
  letter-spacing: -.03em; color: #fff;
}

/* A student, in their own words. Rendered only when there IS one: an invented
   quote under a made-up name is an endorsement nobody gave. */
/* Smaller than the headline it sits under, and smaller than it was: at 15px
   beside a 44px face it read as a second headline rather than as somebody
   else's sentence. */
.aisp-up-quote { display: flex; flex-direction: column; gap: 6px; margin-top: 24px; }
.aisp-up-face {
  flex: none; width: 34px; height: 34px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: #8FCFAE; color: #16263C; font-size: 11.5px; font-weight: 700;
}
.aisp-up-quote-w { flex: 1 1 auto; min-width: 0; }
/* block, not inline: the attribution was running on from the end of the
   quote, so the sentence read "...in my first month."Jenna Chen. */
.aisp-up-quote-t { display: block; font-size: 14px; line-height: 1.4; color: rgba(255,255,255,.92); }
.aisp-up-quote-s { display: block; font-size: 12.5px; color: #98A5BB; }

/* Three lengths, one product. The chosen one is filled white, which is the
   same shape as the button under it. */
.aisp-up-prices { display: flex; gap: 12px; margin-top: auto; padding-top: 30px; }
.aisp-up-price {
  flex: 1 1 0; min-width: 0; padding: 14px 13px 15px; text-align: left;
  font-family: inherit;
  background: none; border: 1px solid rgba(255,255,255,.28); border-radius: 12px;
  cursor: pointer; transition: border-color .12s, background .12s, color .12s;
}
.aisp-up-price:hover { border-color: rgba(255,255,255,.36); }
.aisp-up-price.is-on {
  background: #fff; border-color: #fff;
  box-shadow: 0 8px 22px -12px rgba(0, 0, 0, .55);
}
.aisp-up-price:focus-visible { outline: 2px solid #8FB4E8; outline-offset: 2px; }
.aisp-up-price-k { display: block; font-size: 12.5px; color: #A9B4C8; }
.aisp-up-price-v {
  display: block; margin-top: 4px; font-size: 18px; font-weight: 750;
  letter-spacing: -.03em; color: #fff; font-variant-numeric: tabular-nums;
}
.aisp-up-price.is-on .aisp-up-price-k { color: #5D6E88; }
.aisp-up-price.is-on .aisp-up-price-v { color: #16263C; }

.aisp-up-go {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; margin-top: 12px; padding: 7px 7px 7px 20px; min-height: 52px;
  border: 0; border-radius: 16px; font-family: inherit;
  font-size: 15px; font-weight: 700; letter-spacing: -.01em;
  background: #fff; color: #16263C; cursor: pointer;
  box-shadow: 0 10px 26px -14px rgba(0, 0, 0, .6);
  font-variant-numeric: tabular-nums;
  transition: background .12s, box-shadow .12s, transform .12s;
}
.aisp-up-go:active { transform: translateY(1px); box-shadow: 0 5px 14px -10px rgba(0,0,0,.6); }
.aisp-up-go svg { width: 17px; height: 17px; }
.aisp-up-go-l { flex: 1 1 auto; text-align: left; }
.aisp-up-go-p {
  flex: none; padding: 10px 14px; border-radius: 11px; background: #253858; color: #fff;
  font-size: 14px; font-weight: 700;
}
.aisp-up-go:hover { background: #EAF1FB; }
.aisp-up-go:disabled { background: rgba(255,255,255,.4); color: #4A5C74; cursor: default; }
body.aisp-page .aisp-up-fine, .aisp-up-fine { margin: 8px 0 0; font-size: 12px; color: rgba(255,255,255,.62); text-align: center; }
.aisp-up-keep {
  display: block; width: 100%; margin-top: 14px; padding: 4px;
  border: 0; background: none; font-family: inherit; text-align: center;
  font-size: 13.5px; color: #A9B4C8; cursor: pointer;
}
.aisp-up-keep:hover { color: #DCE4F0; }
.aisp-up-err { margin: 12px 0 0; text-align: center; font-size: 12.5px; color: #F0A9A9; }

/* Narrow. The illustration is the first thing to go: it is an argument for
   the product, and at half width it stops being legible, which makes it an
   argument against. The offer stands on its own. */
@media (max-width: 1040px) {
  .aisp-up { width: min(480px, 100%); padding: 0; }
  .aisp-up-demo { display: none; }
  .aisp-up-side { flex: 1 1 auto; max-width: none; padding: 30px 32px 26px; }
  .aisp-up-h { font-size: 27px; }
}
@media (max-width: 560px) {
  .aisp-up { border-radius: 16px; }
  .aisp-up-side { padding: 24px 20px 20px; }
  .aisp-up-h { font-size: 23px; }
  .aisp-up-prices { flex-direction: column; }
}
.aisp-brief-line {
  font-size: clamp(15px, 1.55vw, 18px); font-weight: 600; color: #24466F;
  letter-spacing: -.012em; line-height: 1.4; text-wrap: balance; max-width: 46ch;
}
.aisp-brief-line strong { font-weight: 800; color: #0B3168; }
.aisp-brief.is-counting .aisp-brief-line { color: #6E819B; animation: aisp-brief-pulse 1.5s ease-in-out infinite; }
@keyframes aisp-brief-pulse { 0%, 100% { opacity: .62; } 50% { opacity: 1; } }
.aisp-brief-sub { font-size: 12.5px; font-weight: 550; color: #6E819B; margin-top: -6px; }
/* The count sentence, doubling as the way in.
   It has to look pressable while standing still — a hover-only affordance is
   invisible to anyone who hasn't already guessed. So it sits in a soft
   translucent pill with a hairline edge and a permanent arrow: unmistakably a
   control, but weighted like a line of text rather than a CTA. */
/* An announcement pill rather than a sentence: the count is a filled badge,
   the copy sits beside it, and the whole thing is one control. It is the only
   object between the headline and the composer, so it has to look deliberate
   at rest — a bare underlined line read as a caption and got skipped. Useno's
   version leads with the NUMBER (that is the news) instead of a "New" tag. */
.aisp-brief-line.is-action {
  display: inline-flex; align-items: center; gap: 11px;
  font: inherit; color: #1B2E4A; text-align: left;
  background: rgba(255,255,255,.82);
  border: 1px solid rgba(255,255,255,.9);
  border-radius: 999px; padding: 5px 18px 5px 5px; margin: 0; cursor: pointer;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 1px 2px rgba(11,42,92,.06), 0 6px 20px rgba(11,42,92,.09);
  transition: background .16s, box-shadow .16s, transform .16s;
}
.aisp-brief-line.is-action:hover {
  background: #fff; transform: translateY(-1px);
  box-shadow: 0 2px 4px rgba(11,42,92,.08), 0 10px 28px rgba(11,42,92,.14);
}
.aisp-brief-line.is-action:active { transform: translateY(0); }
.aisp-brief-line.is-action:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.aisp-brief-badge {
  flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
  min-width: 32px; height: 30px; padding: 0 12px; border-radius: 999px;
  background: #2E6BD0; color: #fff; line-height: 1;
  font-size: 13.5px; font-weight: 750; letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
}
.aisp-brief-copy {
  flex: 0 1 auto; min-width: 0;
  font-size: 14px; font-weight: 600; letter-spacing: -.008em; color: #1B2E4A;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.aisp-brief-go {
  display: inline-flex; flex-shrink: 0; color: #2E6BD0; margin-left: -2px;
  transition: transform .18s ease;
}
.aisp-brief-line.is-action:hover .aisp-brief-go { transform: translateX(3px); }
@media (prefers-reduced-motion: reduce) {
  .aisp-brief-line.is-action, .aisp-brief-go { transition: none; }
  .aisp-brief-line.is-action:hover .aisp-brief-go { transform: none; }
}

/* ── Conversational search bar ──
   The landing bar is the roomy two-row composer: the invitation to type is
   the whole page, so it gets the space. Results mode collapses it to a single
   compact row (see the results-mode block below) — same element, two jobs. */
.aisp-bar {
  display: grid; grid-template-columns: 1fr; text-align: left;
  min-height: 104px; background: rgba(255,255,255,.97);
  border: 1px solid rgba(6,31,71,.12); border-radius: 22px;
  padding: 15px 16px 11px 22px;
  box-shadow: 0 4px 8px rgba(8,31,67,.06), 0 24px 64px rgba(7,42,103,.18);
  transition: border-color .18s, box-shadow .18s, transform .18s;
}
.aisp-bar:focus-within {
  border-color: rgba(25,102,224,.55);
  box-shadow: 0 0 0 4px rgba(42,118,235,.13), 0 28px 70px rgba(7,42,103,.2);
  transform: translateY(-1px);
}
.aisp-input-row { display: flex; align-items: flex-start; gap: 12px; }
.aisp-bar-ic { color: #1F6CE1; flex-shrink: 0; padding-top: 2px; }
/* The bars breathe on a slow stagger — the composer is the one idle thing on
   the screen, and a little life here reads as "listening" rather than as an
   animation demanding attention. Slow and shallow on purpose: the floor is
   .45 opacity, so it never blinks off, and the 2.6s cycle is well below the
   rate at which motion becomes distracting while you type. */
.aisp-bar-ic-b {
  animation: aisp-bar-pulse 2.6s ease-in-out infinite;
  transform-origin: center bottom;
}
.aisp-bar-ic-b:nth-child(2) { animation-delay: .28s; }
.aisp-bar-ic-b:nth-child(3) { animation-delay: .56s; }
@keyframes aisp-bar-pulse {
  0%, 100% { opacity: .45; }
  45%      { opacity: 1; }
}
/* Focus the input and the bars settle — the mark stops competing with the
   text you're typing. */
.aisp-bar:focus-within .aisp-bar-ic-b { animation: none; opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  .aisp-bar-ic-b { animation: none; opacity: 1; }
}
/* What you type should look like the rest of the product, not like a form
   field. `font-family: inherit` was fine in theory but left the face at the
   mercy of whatever a parent sets, so it names var(--f) (Inter) directly.
   #10233E was near-black against a soft blue field — heavy and a little harsh;
   the same navy the headline uses reads as considered rather than stark, and
   Inter wants a touch of negative tracking at this size. */
.aisp-input {
  flex: 1; min-width: 0; border: none; outline: none; resize: none;
  font-family: var(--f, 'Inter', system-ui, sans-serif);
  font-size: 15.5px; font-weight: 450; color: #24466F;
  letter-spacing: -.011em; line-height: 1.5;
  background: transparent; min-height: 34px; max-height: 120px;
}
.aisp-input::placeholder {
  color: #92A2B8; font-weight: 400; letter-spacing: -.008em;
}
.aisp-bar-tools { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 8px; }
.aisp-tool-left { display: flex; align-items: center; gap: 0; min-width: 0; }
.aisp-tool-right { display: flex; align-items: center; gap: 8px; min-width: 0; }

/* The "+" and scope pill only earn their label on hover/focus — collapsed to
   just an icon otherwise, so the bar reads as a plain input at rest instead
   of a row of always-on controls. */
.aisp-add {
  width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 10px; background: transparent; color: #617086; cursor: pointer;
  transition: background .12s, color .12s; flex-shrink: 0;
}
.aisp-add:hover { background: #F0F5FC; color: #1F5FAF; }
/* Visible at rest. It was hover-only, which meant the one line telling you
   that plain language works only appeared once you'd already worked that out. */
.aisp-tool-label {
  display: inline-block; color: #5D6E88; font-size: 12.5px; font-weight: 600;
  white-space: nowrap; overflow: hidden; max-width: 320px; opacity: 1; margin-left: 8px;
  transition: opacity .14s ease;
}
/* "+" is the only filter surface — the whole set opens from the composer. */
.aisp-addwrap { position: relative; display: inline-flex; }

/* ── First-run pointer ──
   BELOW "+", not beside it. The old comment here claimed the space to the
   right was empty; it is not, it is where .aisp-tool-label sits, so a navy
   pill parked there blacked out "…role in plain language" — the composer's
   own instruction — to explain a button. A tip that hides the copy it sits
   next to is worse than no tip.
   Under the composer the pill overlaps nothing, and it is light rather than
   navy: a dark slab was the heaviest object on a white card for a hint that
   retires after one viewing. Soft blue on white, in the same accent language
   as the rest of the composer, still clearly a tip and not a control. */
.aisp-coach {
  position: absolute; left: -2px; top: calc(100% + 25px); transform: none;
  z-index: 30; display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 5px 5px 10px; border-radius: 8px; white-space: nowrap;
  background: #EEF4FE; color: #2559AE;
  border: 1px solid rgba(60,120,215,.22);
  box-shadow: 0 3px 10px rgba(24,58,110,.10);
  animation: aisp-coach-in .34s ease both, aisp-coach-drift 2.8s ease-in-out .34s infinite;
}
.aisp-coach[hidden] { display: none; }
.aisp-coach-txt { font-size: 11.5px; font-weight: 600; letter-spacing: .005em; }
/* The pointer itself — a small notch on the TOP edge, aimed up at the button
   the tip is about. Its border sits on the two edges the pill's own border
   would have covered, so the notch reads as part of the pill outline rather
   than as a diamond stuck to it. */
.aisp-coach-arrow {
  position: absolute; left: 13px; top: -4px; width: 7px; height: 7px;
  background: #EEF4FE; transform: rotate(45deg); border-radius: 1.5px;
  border-left: 1px solid rgba(60,120,215,.22);
  border-top: 1px solid rgba(60,120,215,.22);
}
.aisp-coach-x {
  display: inline-flex; align-items: center; justify-content: center;
  width: 17px; height: 17px; border-radius: 5px; border: 0; cursor: pointer;
  background: transparent; color: rgba(37,89,174,.5);
  transition: background .12s, color .12s; flex-shrink: 0;
}
.aisp-coach-x:hover { background: rgba(37,89,174,.10); color: #2559AE; }
.aisp-coach-x:focus-visible { outline: 2px solid #2559AE; outline-offset: 1px; }
/* Rises into place from under the button it points at. */
@keyframes aisp-coach-in {
  from { opacity: 0; transform: translateY(-5px); }
  to   { opacity: 1; transform: translateY(0); }
}
/* A few pixels of drift toward the button, not a bounce — enough to catch the
   eye once without turning into a nag. */
@keyframes aisp-coach-drift {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-2.5px); }
}
@media (prefers-reduced-motion: reduce) {
  .aisp-coach { animation: none; }
}
/* Results mode puts the tip back BESIDE the button, because that is the one
   state where the space really is empty: .aisp-tool-label is display:none
   here (see the results-mode rule further down), so there is no copy left to
   cover. It has to move back, too — in results mode the composer is docked at
   the bottom of the viewport, and a tip hanging 25px below it would sit off
   the bottom of the screen entirely.
   Centred with a margin rather than translateY(-50%), so the drift keyframes
   own `transform` outright and cannot cancel the centring. */
body.aisp-results-mode .aisp-coach {
  left: calc(100% + 11px); top: 50%; margin-top: -14px;
}
body.aisp-results-mode .aisp-coach-arrow {
  left: -4px; top: 50%; margin-top: -3.5px;
  transform: rotate(45deg);
  border-left: 1px solid rgba(60,120,215,.22);
  border-top: 0;
  border-bottom: 1px solid rgba(60,120,215,.22);
}
@keyframes aisp-coach-in-side {
  from { opacity: 0; transform: translateX(-6px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes aisp-coach-drift-side {
  0%, 100% { transform: translateX(0); }
  50%      { transform: translateX(3px); }
}
body.aisp-results-mode .aisp-coach {
  animation: aisp-coach-in-side .34s ease both,
             aisp-coach-drift-side 2.8s ease-in-out .34s infinite;
}
@media (prefers-reduced-motion: reduce) {
  body.aisp-results-mode .aisp-coach { animation: none; }
}
/* The results tip is a longer string than the landing one — it names the
   payoff (salary, deadline, remote) rather than the control — so it needs a
   ceiling. Both variants get one: the pill is absolutely positioned off the
   "+" and nowrap, so without a cap a long tip runs off the composer and, on a
   phone, off the viewport. Wrapping below the breakpoint rather than
   truncating, since half a sentence sells nothing. */
.aisp-coach { max-width: calc(100vw - 140px); }
@media (max-width: 700px) {
  /* `width: max-content` is load-bearing, not belt-and-braces. The pill is
     absolutely positioned inside .aisp-addwrap, which is the 28px-wide "+"
     button — so once white-space stops forcing it wide, shrink-to-fit resolves
     against a containing block NARROWER than the pill's own left offset and
     collapses it to min-content: a 92px column four lines tall, broken at
     "deadline,". max-content asks for the whole string first; max-width is
     then what actually wraps it. */
  .aisp-coach {
    white-space: normal; width: max-content;
    max-width: min(230px, calc(100vw - 96px));
  }
  /* Back beside the button below 700px, for the same reason as results mode:
     .aisp-tool-label is display:none at this width (see the rule further
     down), so there is nothing to the right to cover, and the below-card
     placement only bought a pill straddling the card's bottom edge. */
  .aisp-coach {
    left: calc(100% + 10px); top: 50%; margin-top: -14px;
    animation: aisp-coach-in-side .34s ease both,
               aisp-coach-drift-side 2.8s ease-in-out .34s infinite;
  }
  .aisp-coach-arrow {
    left: -4px; top: 50%; margin-top: -3.5px;
    border-top: 0; border-bottom: 1px solid rgba(60,120,215,.22);
  }
}
@media (prefers-reduced-motion: reduce) and (max-width: 700px) {
  .aisp-coach { animation: none; }
}
.aisp-add[aria-expanded="true"] { background: #143B6B; color: #fff; }
/* The menu opens upward: in results mode the composer is docked at the very
   bottom, and in hero mode that is the shape the panel is designed around.
   placeAddMenu() flips it below only when there is genuinely no room above. */
.aisp-addmenu {
  position: absolute; bottom: calc(100% + 9px); left: 0; z-index: 40;
  /* Wide enough that the long labels stay on one line. At 230px
     "No previous internship required" wrapped to three, which is most of why
     this menu grew to the height of the viewport. */
  width: 320px; padding: 8px; border-radius: 15px;
  /* Deliberately shorter than the room usually available: 20 options in one
     column is a list to scroll, not a panel to fill the window with. 340px
     shows about eight rows, so the menu hangs off "+" instead of climbing to
     the top of the page. --aisp-menu-max lowers it further when even that
     would not fit on the side the menu opened toward. */
  max-height: min(var(--aisp-menu-max, 44vh), 340px);
  overflow-y: auto; overscroll-behavior: contain;
  /* One opaque surface. This was a translucent panel whose sticky group
     headings carried their OWN backdrop-filter — and a nested backdrop-filter
     re-filters the already-filtered panel rather than compositing with it, at
     a different blur and alpha, full-bleed across the width. Over the blue
     hero that rendered as solid white stripes, so the menu read as several
     separate sections instead of one list. The blur stays for the edge; the
     fill no longer lets enough through for the headings to disagree about. */
  background: #FCFDFE;
  backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid rgba(255,255,255,.85);
  box-shadow: 0 10px 34px rgba(11,42,92,.2), inset 0 1px 0 rgba(255,255,255,.7);
  display: flex; flex-direction: column; gap: 1px; text-align: left;
  scrollbar-width: thin;
}
/* Group headings stay put while their options scroll under them. Same fill as

.aisp-jd-head { display: block; margin-bottom: 18px; }

.aisp-jd-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-top: 18px; margin-bottom: 30px; }

}

/* Save, Track and the overflow are outlined circles: quiet next to the one

.aisp-jd-morewrap { position: relative; }
.aisp-jd-menu {

  background: #fff; border: 1px solid rgba(28,43,58,.1); border-radius: 10px;

.aisp-jd-glance { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; }
@media (max-width: 900px) { .aisp-jd-glance { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.aisp-jd-box { background: #fff; border: 1px solid rgba(30,58,95,.14); border-radius: 8px; padding: 9px 12px; min-width: 0; }
.aisp-jd-lbl { font-size: 9px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #8FA0B5; margin-bottom: 4px; }
.aisp-jd-val { font-size: 13px; font-weight: 600; color: #16263C; overflow-wrap: anywhere; }
.aisp-jd-sec { margin-top: 30px; }
/* A section heading a person reads, rather than a small-caps label. */
.aisp-jd-h2 {
  font-size: 17px; font-weight: 750; letter-spacing: -.015em; color: #16263C; margin: 0 0 12px;

.aisp-jd-fold[open] .aisp-jd-chev { transform: none; }

.aisp-jd-desc { font-size: 15px; color: #5D6E88; line-height: 1.65; white-space: pre-line; }
/* A sentence, not a wall: it explains the ending and points at the employer,
   and it is shown to everyone because it is true for everyone. */
.aisp-jd-cut {
  margin: 14px 0 0; font-size: 13.5px; line-height: 1.6; color: #8A97A8;
}
.aisp-detail.aisp-jd > .aisp-dsec { margin-top: 28px; }
/* The whole page starts lower. It sat tight under the header, which put the
   back link and the mark in the same band as the app's own chrome. */
.aisp-jd-main { padding-top: 10px; }
.aisp-jd-side { padding-top: 10px; }
@media (max-width: 640px) {

/* ── Recent searches ── */
.aisp-histwrap { position: relative; display: inline-flex; margin-left: 2px; }
.aisp-hist-btn[aria-expanded="true"] { background: #F0F5FC; color: #1F5FAF; }
.aisp-histwrap[hidden] { display: none; }
.aisp-hist-menu {
  position: absolute; top: calc(100% + 9px); left: 0; z-index: 40;
  width: 320px; max-width: calc(100vw - 32px); max-height: 340px; overflow-y: auto; overscroll-behavior: contain;
  padding: 6px; border-radius: 13px; background: #FCFDFE;
  border: 1px solid rgba(30,58,95,.08);
  box-shadow: 0 10px 34px rgba(11,42,92,.2);
  display: flex; flex-direction: column; gap: 1px; text-align: left;
}
body.aisp-results-mode .aisp-hist-menu { top: auto; bottom: calc(100% + 9px); }
.aisp-hist-menu[hidden] { display: none; }
.aisp-hist-h { font-size: 11.5px; font-weight: 600; color: #8190A5; padding: 6px 10px 4px; }
.aisp-hist-row { display: flex; align-items: center; gap: 4px; border-radius: 9px; }
.aisp-hist-row:hover { background: #F0F5FC; }
.aisp-hist-go {
  flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;
  border: 0; background: none; cursor: pointer; text-align: left; padding: 7px 4px 7px 10px; font: inherit;
}
.aisp-hist-q { font-size: 13.5px; font-weight: 500; color: #16263C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aisp-hist-when { font-size: 11.5px; color: #8190A5; }
.aisp-hist-del {
  flex-shrink: 0; width: 26px; height: 26px; margin-right: 4px; border: 0; border-radius: 8px;
  background: none; color: #9AA6B6; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  transition: opacity .12s;
}
.aisp-hist-row:hover .aisp-hist-del, .aisp-hist-del:focus-visible { opacity: 1; }
.aisp-hist-del:hover { background: #E3EBF6; color: #16263C; }
@media (hover: none) { .aisp-hist-del { opacity: 1; } }
.aisp-hist-empty { font-size: 13px; color: #5D6E88; padding: 8px 10px 10px; }
/* Set by placeAddMenu() when there is more room under the composer than over
   it — hero mode, where the bar sits mid-page rather than docked. */
.aisp-addmenu.below { top: calc(100% + 9px); bottom: auto; }
.aisp-scopemenu-lbl {
  font-size: 9.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
  color: #8595A9; padding: 6px 8px 3px;
}
.aisp-scopeopt {
  display: flex; align-items: center; gap: 9px; width: 100%;
  font-family: inherit; font-size: 12.5px; font-weight: 600; color: #2A3D57; text-align: left;
  background: transparent; border: 0; border-radius: 8px; padding: 6px 8px; cursor: pointer;
  line-height: 1.3;
  transition: background .12s, color .12s;
}
.aisp-scopeopt:hover { background: rgba(31,108,225,.09); }
.aisp-scopeopt:focus-visible { outline: 2px solid #1F6CE1; outline-offset: -2px; }
/* State is a check mark plus aria-pressed, never the tint alone. */
.aisp-scopeopt .aisp-tick {
  width: 16px; height: 16px; flex-shrink: 0; border-radius: 5px;
  border: 1.5px solid rgba(22,38,60,.25); background: rgba(255,255,255,.7);
  display: inline-flex; align-items: center; justify-content: center; color: transparent;
  transition: background .12s, border-color .12s, color .12s;
}
.aisp-scopeopt[aria-pressed="true"] { color: #123F76; }
.aisp-scopeopt[aria-pressed="true"] .aisp-tick { background: #1F6CE1; border-color: #1F6CE1; color: #fff; }
.aisp-scopeopt[disabled] { cursor: default; color: #9AA6B6; }
.aisp-scopeopt[disabled]:hover { background: transparent; }
.aisp-scopeopt[disabled] .aisp-tick { border-style: dashed; }
.aisp-scopeopt .aisp-soon { margin-left: auto; flex-shrink: 0; }
/* The "Narrow these" tip beside the composer is off: it read as clutter. */
.aisp-coach.is-refine { display: none !important; }
/* ── A quieter conversation column ───────────────────────────────────────
   Narrower, so the roles get the room. Your message is a small grey note
   instead of a shadowed pill; the reply is plain text with no logo badge;
   the composer is a squarer, flat field with a hairline edge. Every rule is
   prefixed body.aisp-page so it outranks the base rules further down. */
/* One column: the search strip is a row, not a column. (This rule used to set
   the two-column split and, being later in the sheet, quietly won over it.) */
body.aisp-page.aisp-results-mode .main { grid-template-columns: minmax(0, 1fr); }
body.aisp-page .aisp-thread { gap: 10px; }
/* Landing: the question and bar centred on the screen, a little above the
   true middle. */
body.aisp-page:not(.aisp-results-mode) .aisp-hero-inner { width: min(720px, 100%); }
body.aisp-page:not(.aisp-results-mode) .aisp-hero {
  display: grid !important; place-items: center !important; align-content: center !important;
  min-height: 100vh !important; padding: 0 32px !important; box-sizing: border-box;
}
body.aisp-page:not(.aisp-results-mode) .aisp-hero-inner { transform: translateY(-5vh); }
/* One column that can shrink: an auto-sized grid column grew to fit the
   one-line suggestions and pushed the bar off a phone screen. */
body.aisp-page:not(.aisp-results-mode) .aisp-hero { grid-template-columns: minmax(0, 1fr) !important; }
body.aisp-page:not(.aisp-results-mode) .aisp-hero-inner { justify-self: center; max-width: 100%; }
@media (max-width: 640px) {
  body.aisp-page:not(.aisp-results-mode) .aisp-hero { padding: 0 16px !important; }
  body.aisp-page .aisp-headline { font-size: 22px; }
  /* Two suggestions fit a phone; a third would be cut in half. */
  .aisp-idea:nth-of-type(n+3) { display: none; }
}
/* Search ideas inside the bar's bottom row, after the + button: small grey
   words, nothing floating outside the bar. */
.aisp-tool-left { min-width: 0; }
/* The suggestions clip themselves; the row must not, or the + menu that
   opens above it is cut off. */
.aisp-ideas { min-width: 0; }
.aisp-ideas { display: flex; align-items: center; gap: 2px; flex-wrap: nowrap; overflow: hidden; margin: 0 0 0 6px; padding: 0; background: none; border: 0; box-shadow: none; }
body.aisp-results-mode .aisp-ideas { display: none !important; }
.aisp-idea svg { display: none; }
/* A small "Try" and thin outlined pills, so they read as suggestions to click,
   not as part of the bar's controls. */
.aisp-ideas-h { display: inline-block; font-size: 12px; font-weight: 500; color: #9AA6B6; margin: 0 4px 0 6px; white-space: nowrap; }
.aisp-ideas { gap: 4px; margin-left: 4px; }
.aisp-idea {
  display: inline-flex; align-items: center; cursor: pointer; white-space: nowrap;
  height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid rgba(30,58,95,.08);
  background: #fff; font-family: inherit; font-size: 12px; font-weight: 400; color: #8793A5;
}
.aisp-idea:hover { border-color: rgba(30,58,95,.2); color: #16263C; }
/* The question a size smaller and less heavy. */
body.aisp-page .aisp-headline { font-size: clamp(24px, 2.4vw, 31px); font-weight: 650; letter-spacing: -.02em; }

/* No "Describe your ideal role" caption: the suggestions take that row. */
body.aisp-page .aisp-tool-label { display: none !important; }

/* Daily AI search limit: two quiet lines and a link. No card, no icon. */
.aisp-quota { text-align: center; padding: 18vh 20px 40px; }
.aisp-quota-title { font-size: 15px; font-weight: 650; letter-spacing: -.01em; color: #16263C; }
.aisp-quota-sub { font-size: 13px; color: #7D8CA0; margin-top: 4px; }
.aisp-quota-sub a { color: #2C5AA0; font-weight: 600; text-decoration: none; }
.aisp-quota-sub a:hover { text-decoration: underline; }

/* Match percentage only: no bars, no band word, always visible. */
body.aisp-page .aisp-fitpanel .aisp-steps { display: none; }
body.aisp-page .aisp-fitpanel:has(.aisp-fitpanel-score) .aisp-fitpanel-band { display: none; }
/* The number is the one thing on the row only Useno can tell you, so it is
   the largest thing after the title. */
body.aisp-page .aisp-fitpanel-score, body.aisp-page .aisp-rcard:hover .aisp-fitpanel-score {
  display: inline; order: 0; font-size: 22px; font-weight: 800; color: #16263C;
  letter-spacing: -.03em; font-variant-numeric: tabular-nums;
}
/* A header like the other pages: the page-name tab and a hairline under it. */
body.aisp-page .aisp-topbar { pointer-events: auto; }
body.aisp-page.aisp-results-mode .aisp-topbar {
  border-bottom: 1px solid var(--border, rgba(30,58,95,.10)); min-height: 52px; padding: 0 20px 0 24px; background: #fff;
}
.aisp-page-tabs { display: flex; align-items: center; }
/* The label only once there are results; the landing hero names itself. */
body.aisp-page:not(.aisp-results-mode) .aisp-page-tabs { visibility: hidden; }
.aisp-page-tab {
  font-family: 'Plus Jakarta Sans', var(--sidebar-f), system-ui, sans-serif;
  font-size: 14px; font-weight: 600; letter-spacing: -0.005em; line-height: 1.3;
  padding: 5px 11px; border-radius: 7px; color: #2F5270; background: rgba(47, 82, 112, 0.07);
}
/* No motion when a prompt is sent: the page switches to results in place. */
body.aisp-page .main, body.aisp-page .aisp-hero, body.aisp-page .aisp-hero-inner,
body.aisp-page .aisp-bar, body.aisp-page .aisp-panel, body.aisp-page .aisp-panel-wrap,
body.aisp-page .aisp-topbar, body.aisp-page .aisp-rcard {
  transition: none !important; animation: none !important;
}
body.aisp-page .main::before, body.aisp-page .main::after { transition: none !important; }

/* No grid of lines: the top bar, the pane divider and the rule under the
   results heading are gone. The conversation pane is a faint grey shape
   instead, and the heading lines up with the cards under it. */
/* Both panes are white, divided by one hairline. The conversation used to sit
   on an inset grey panel, which read as a second sidebar beside the real one
   (2026-09-22). */
/* ── The search column ──
   Navy, rounded, down the left, with a white card holding the query and the
   box, the active filters under it and the recent searches at the foot. */
/* White page, and the search column is its own floating card with air around
   it rather than one half of a two-tone slab. */
/* No gap between the columns: they meet at a hairline instead, so the
   search column's own section lines run all the way out and touch it. A
   22px grid gap left them stopping in mid-air with the divider 22px away. */
body.aisp-page.aisp-results-mode .main {
  grid-template-columns: minmax(300px, 26%) minmax(0, 1fr);
  gap: 0; padding: 14px 0 0; background: #fff;
}
body.aisp-page.aisp-results-mode .aisp-topbar {
  grid-column: 1 / -1; grid-row: 1; background: #fff;
  border-bottom: 1px solid var(--border, rgba(30,58,95,.1));
  margin: -14px 0 0; padding: 0 22px;
}
/* The left column is a stack of cards on a quiet panel, not one tall navy
   block: the search, then whether Autofill will fill an application, then
   the last few searches. */
body.aisp-page.aisp-results-mode .aisp-hero {
  position: relative; grid-column: 1; grid-row: 2;
  margin: 0; padding: 0; border-radius: 0;
  background: none; border: 0; box-shadow: none;
  align-self: stretch; overflow-y: auto; scrollbar-width: thin;
}
/* One white card for the whole column, with a hairline between its sections
   rather than a gap between four separate panels. The navy block is gone: it
   was the loudest thing on a page whose job is to make the ROLES loud. */
body.aisp-page.aisp-results-mode .aisp-sidepanel {
  display: flex; flex-direction: column; order: 0;
  /* Grow to the column's height, never shrink below its content. Without
     the growth there is no slack for `margin-top: auto` to spend, so the
     Autofill pill sat directly under the filters instead of at the foot;
     without the "never shrink" it collapses under its own content and
     draws the last section outside the white. */
  flex: 1 0 auto;
  padding: 30px 22px 24px; border-radius: 0; background: #fff; border: 0;
  position: relative; z-index: 5;
}
/* Full bleed: the line is the width of the column, not the width of the
   text in it, so it ends where the column ends and meets the vertical
   divider beside it. */
/* No rules between the sections. With an outlined box and outlined chips
   there is already a line round everything that matters, and a hairline
   under each group made five horizontal rules in one narrow column. */
body.aisp-page.aisp-results-mode .aisp-sidepanel > * + *:not([hidden]) {
  margin-top: 16px;
}
body.aisp-page.aisp-results-mode .aisp-searchcard { display: flex; flex-direction: column; }
/* The filters are their own section, so they get their own line. The panel's
   rule only divides its DIRECT children, and the question, the box and the
   chips are all one child — which left the top half of the column with no
   line in it at all. */
body.aisp-page.aisp-results-mode .aisp-chippane:not(:empty) { margin: 0; }
/* Containers only outside results mode: the landing screen keeps the flat
   column it always had. */
body:not(.aisp-results-mode) .aisp-searchcard,
body:not(.aisp-results-mode) .aisp-sidepanel { display: contents; }

/* The two cards under it. */
/* Pinned to the foot of the column: it is a status line, not a step in the
   search, so it does not sit between the filters and the results. */
.aisp-sidecard { order: 8; margin-top: auto !important; padding-top: 18px; }
.aisp-sidecard[hidden] { display: none; }
.aisp-af-card {
  padding: 14px 15px 15px; border-radius: 14px; background: #1E3A5F; color: #fff;
}
/* The mark shares the line with the state rather than sitting on its own
   above it, which took a whole row out of the card's height. */
.aisp-af-top { display: flex; align-items: center; gap: 9px; }
/* logo-navy.svg is a navy tile with the mark knocked out of it, so on navy
   it needs a light ground to be seen at all. */
.aisp-af-mark {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 7px; background: rgba(255,255,255,.12);
}
.aisp-af-mark img { width: 24px; height: 24px; border-radius: 7px; }
.aisp-af-h { font-size: 13.5px; font-weight: 750; color: #fff; letter-spacing: -.015em; }
.aisp-af-sub {
  margin: 7px 0 0; font-size: 12px; line-height: 1.4; color: rgba(255,255,255,.68);
}
.aisp-af-link {
  display: inline-flex; align-items: center; height: 30px; padding: 0 14px; margin-top: 11px;
  border-radius: 999px; background: #fff; color: #1E3A5F;
  font-size: 12.5px; font-weight: 650; text-decoration: none;
}
.aisp-af-link:hover { background: #EAF0F8; }

/* ── The band ──────────────────────────────────────────────────────────────
   One navy strip under the buttons: how the role scored on the left, then a
   cell for each thing a student can do with it. It was a stack of sections
   down the page, which put three headings between the buttons and the
   posting. */
/* ── The role page's side column ───────────────────────────────────
   One card per thing this role can be done with. They were a navy strip of
   three cells under the Apply button, which sat in the reading path between
   the title and the posting and gave each cell about a third of a line to say
   what it was: every title truncated. Beside the posting each card has its
   own shape, its own colour, and a button wide enough to read. */
.aisp-jd-side {
  flex: 0 0 282px; max-width: 282px;
  display: flex; flex-direction: column; gap: 12px;
}
/* ONE SURFACE FOR ALL THREE. Green for recruiters, amber for the resume and
   blue for autofill made the column read as three unrelated products stacked
   up. The cards do different jobs; they are not different kinds of thing. */
.aisp-jdc { padding: 17px 18px; border-radius: 16px; background: #F3F5F8; }
/* "Tailor my resume", Coming soon: navy, a white sample, one line under it. */
.aisp-jdc.aisp-tlrc { padding: 22px 18px 20px; border-radius: 20px; background: #253858; color: #fff; }
.aisp-tlrc-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.aisp-tlrc-t { margin: 0; font-size: 17px; white-space: nowrap; font-weight: 800; letter-spacing: -.01em; color: #fff; }
.aisp-tlrc-soon {
  flex: none; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.16);
  font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap;
}
.aisp-tlrc-doc { margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: #fff; }
.aisp-tlrc-doc p { margin: 0; font-size: 14px; line-height: 1.5; color: #5A6478; }
.aisp-tlrc-doc p + p { margin-top: 6px; }
.aisp-tlrc-doc mark { padding: 1px 6px; border-radius: 6px; background: #E1E9F6; color: #1E3A5F; }
.aisp-jdc-top {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
}
.aisp-jdc-ic {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 36px; height: 36px; border-radius: 11px; background: #fff; color: #253B5C;
}
.aisp-jdc-ic svg { width: 17px; height: 17px; }
.aisp-jdc-t {
  margin: 12px 0 0; font-size: 15.5px; font-weight: 700;
  letter-spacing: -.02em; color: #16263C;
}
.aisp-jdc-s { margin: 3px 0 0; font-size: 13px; line-height: 1.4; color: #7A8899; }

/* A SECOND THING YOU CAN DO, AT THE SIZE OF A SECOND THING. One row, with
   the action as its title and the company underneath, because a card with a
   button of its own claimed the same weight as the tailoring. */
.aisp-jdr {
  display: flex; align-items: center; gap: 11px; width: 100%; box-sizing: border-box;
  padding: 13px 14px; border: 1px solid #E2E8F1; border-radius: 14px;
  background: #fff; font-family: inherit; text-align: left; cursor: pointer;
  transition: border-color .12s, background .12s;
}
.aisp-jdr:hover { border-color: #C9D4E3; background: #FAFBFD; }
.aisp-jdr:focus-visible { outline: 2px solid #1F5FB8; outline-offset: 2px; }
.aisp-jdr-i {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 10px; background: #EEF1F6; color: #253B5C;
}
.aisp-jdr-i svg { width: 16px; height: 16px; }
.aisp-jdr-c { flex: 1 1 auto; min-width: 0; }
.aisp-jdr-t {
  display: block; font-size: 14px; font-weight: 700; letter-spacing: -.01em;
  color: #16263C;
}
.aisp-jdr-s {
  display: block; margin-top: 1px; font-size: 12.5px; color: #7A8899;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.aisp-jdr-go { flex: none; width: 14px; height: 14px; color: #A6B2C2; }

/* A STATE, NOT A TASK. Autofill being ready is a fact about the account, so
   it is a line with a way in rather than a third card competing with two
   things the student came here to do. */
.aisp-jdn { display: flex; align-items: center; gap: 9px; padding: 2px 4px; }
.aisp-jdn-k { flex: none; display: inline-flex; color: #3C9B62; }
.aisp-jdn-k svg { width: 16px; height: 16px; }
.aisp-jdn-t {
  flex: 1 1 auto; min-width: 0; font-size: 13px; color: #5D6E88;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.aisp-jdn-a {
  flex: none; font-size: 13px; font-weight: 700; color: #253B5C; text-decoration: none;
}
.aisp-jdn-a:hover { text-decoration: underline; text-underline-offset: 3px; }

/* The match as it stands, in the corner of the card that opens the panel
   that changes it. */
.aisp-jdc-fit {
  flex: none; display: flex; flex-direction: column; align-items: flex-end;
  line-height: 1.1;
}
.aisp-jdc-fit b {
  font-size: 23px; font-weight: 750; letter-spacing: -.03em; color: #16263C;
}
.aisp-jdc-fit-l { margin-top: 2px; font-size: 12.5px; color: #7A8899; }

/* A BLOCK, NOT A PILL. The pill plus an arrow read as a chip that happened
   to be wide; squared off and filled it reads as the card's one action. */
.aisp-jdc-go {
  display: flex; align-items: center; justify-content: center;
  width: 100%; box-sizing: border-box; margin-top: 15px;
  padding: 13px 16px; border: 0; border-radius: 13px;
  font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: -.01em;
  background: #253B5C; color: #fff; text-decoration: none; cursor: pointer;
  transition: background .12s;
}
.aisp-jdc-go:hover { background: #1A2C47; }
.aisp-jdc-go:focus-visible { outline: 2px solid #1F5FB8; outline-offset: 2px; }

/* Narrow: the cards go under the posting rather than squeezing it. */
@media (max-width: 1240px) {
  .aisp-detail.aisp-jd { flex-direction: column; }
  .aisp-jd-side { flex: none; max-width: none; flex-direction: row; flex-wrap: wrap; }
  .aisp-jdc { flex: 1 1 260px; }
}

/* Pushed to the right end of the company row by margin-left:auto, and
   allowed to shrink so a long "Matched on role, term, location" truncates
   rather than wrapping the row. */
.aisp-jd-fit {
  display: flex; align-items: center; gap: 10px; margin-left: auto;
  min-width: 0; padding-left: 12px;
}
.aisp-jd-fit-pill {
  flex: none;
  padding: 6px 14px; border-radius: 999px;
  background: #EAF1FB; color: #1E3A5F;
  font-size: 13px; font-weight: 700; letter-spacing: -.01em;
}
/* One line, sharing the width. It was a grid with a 240px minimum per cell,
   which is a minimum the band could not honour: three cells wrapped to two
   rows and the third ran off the right-hand edge. min-width:0 is what lets
   a cell be narrower than its own text and truncate instead. */
.aisp-band-tools {
  flex: 1 1 0; min-width: 0;
  display: flex; align-items: stretch; gap: 12px;
}
.aisp-btool {
  flex: 1 1 0; min-width: 0;
  display: flex; align-items: center; gap: 12px; text-align: left;
  padding: 13px 12px 13px 14px; border: 0; border-radius: 14px;
  font: inherit; color: inherit; text-decoration: none; cursor: pointer;
  background: rgba(255,255,255,.07); transition: background .12s;
}
.aisp-btool:hover { background: rgba(255,255,255,.13); }
.aisp-btool:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.aisp-btool-ic {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 10px;
}
.aisp-btool-ic svg { width: 18px; height: 18px; }
/* One colour per kind of help, so the cells are told apart without reading. */
.aisp-btool-ic.is-people { background: #fff; color: #1E3A5F; }
.aisp-btool-ic.is-doc { background: #F3C97A; color: #6B4A12; }
.aisp-btool-ic.is-ok { background: #8FD3AE; color: #14532D; }
.aisp-btool-ic.is-wait { background: rgba(255,255,255,.22); color: #fff; }
.aisp-btool-txt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.aisp-btool-t {
  font-size: 14.5px; font-weight: 700; color: #fff; letter-spacing: -.01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.aisp-btool-s {
  margin-top: 3px; font-size: 12.5px; color: rgba(255,255,255,.62);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.aisp-btool-go {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 16px; color: rgba(255,255,255,.55);
}
.aisp-btool-go svg { width: 15px; height: 15px; }
.aisp-btool:hover .aisp-btool-go { color: #fff; }
/* Narrow enough that one line of three cannot be read: they stack. */
@media (max-width: 1100px) {
  .aisp-band-tools { flex-wrap: wrap; }
  .aisp-btool { flex: 1 1 260px; }
}
@media (max-width: 720px) {
  .aisp-band { padding: 12px; }
  .aisp-band-fit { max-width: none; }
  .aisp-btool { flex: 1 1 100%; }
}

/* The column, in the mockup's order: title, the card holding the query and
   the box, the filters, and the recent searches pinned to the foot. */
body.aisp-page.aisp-results-mode .aisp-hero-inner {
  display: flex; flex-direction: column; gap: 10px; max-width: none; margin: 0; text-align: left;
  min-height: 100%;
}
/* The question is gone from this column: a search box with "Role, company
   or skill" in it has already asked it. It stays on the landing screen,
   where there is nothing else on the page to explain what the box is for. */
body.aisp-page.aisp-results-mode .aisp-headline { display: none; }

/* The query sits at the top of the white card and the box underneath it, so
   the two read as one control rather than a label floating on the navy. */
body.aisp-page.aisp-results-mode .aisp-summary {
  display: block; margin: 0 0 10px; padding: 0; background: none; border: 0; border-radius: 0;
}
body.aisp-page.aisp-results-mode .aisp-summary:empty { display: none; }
body.aisp-results-mode .aisp-summary-label, body.aisp-results-mode .aisp-summary-count { display: none; }
body.aisp-results-mode .aisp-summary-q { font-size: 14.5px; font-weight: 650; color: #16263C; line-height: 1.4; }
body.aisp-results-mode .aisp-summary-rev { color: #8A97A8; }
/* "New search" belongs with the query it replaces, not as a button on navy. */
body.aisp-page.aisp-results-mode .aisp-newsearch {
  margin: 10px 0 0; background: none; border: 0; padding: 0;
  color: #2E6BD0; font-size: 12.5px; font-weight: 650;
}
body.aisp-page.aisp-results-mode .aisp-newsearch:hover { color: #16263C; background: none; }
body.aisp-page.aisp-results-mode .aisp-newsearch svg { display: none; }
/* One line: the question and the button that sends it, side by side. The
   box used to be a card two rows tall, and the second row held nothing a
   student could see. */
body.aisp-page.aisp-results-mode .aisp-bar {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 8px;
  order: 1; width: 100%; max-width: none; margin: 0 0 18px; padding: 0 16px 0 12px;
  min-height: 48px; box-sizing: border-box;
  background: #fff; border: 1.5px solid #1E3A5F; border-radius: 12px; box-shadow: none;
}

/* THE GLOW, AND WHY IT IS A SHADOW RATHER THAN A GRADIENT.
   The first version drew a blurred gradient on a ::before with z-index:-1,
   expecting it to sit behind the field. It does not. The bar makes its own
   stacking context (position:relative, z-index:1), and inside one of those a
   negative-z-index child paints ABOVE the parent's background and below its
   content: the blue wash came up through the white and filled the box.
   A box-shadow is painted outside the border box by definition, so it cannot
   bleed inward however far it is blurred. Three of them stacked give the
   soft radiant edge without the trick. */
body.aisp-page.aisp-results-mode .aisp-bar {
  box-shadow:
    0 0 0 3px rgba(46,107,208,.10),
    0 2px 14px -2px rgba(46,107,208,.28),
    0 0 26px -4px rgba(92,168,240,.30);
  transition: box-shadow .18s, border-color .12s;
}
body.aisp-page.aisp-results-mode .aisp-bar:hover {
  box-shadow:
    0 0 0 3px rgba(46,107,208,.14),
    0 2px 18px -2px rgba(46,107,208,.36),
    0 0 34px -4px rgba(92,168,240,.38);
}
body.aisp-page.aisp-results-mode .aisp-bar:focus-within {
  border-color: #2E6BD0;
  box-shadow:
    0 0 0 4px rgba(46,107,208,.18),
    0 2px 22px -2px rgba(46,107,208,.44),
    0 0 44px -4px rgba(92,168,240,.46);
}

/* The way out of a half-typed question. Without it the only way to empty the
   box was to select the text and delete it, which is why a stale query sat
   in the field looking like a bug. It appears only when there is something
   to clear. */
.aisp-clearq {
  flex: none; display: none; align-items: center; justify-content: center;
  width: 22px; height: 22px; margin-left: 6px; border: 0; border-radius: 50%;
  background: #DDE3EC; color: #fff; cursor: pointer; transition: background .12s;
}
body.aisp-results-mode .aisp-bar.has-q .aisp-clearq { display: inline-flex; }
.aisp-clearq:hover { background: #9FADC0; }
.aisp-clearq:focus-visible { outline: 2px solid #1F5FB8; outline-offset: 2px; }
.aisp-clearq svg { width: 10px; height: 10px; }
/* The magnifier reads the box rather than sending it: it sits inside on the
   left, where it says "this is a search field", and Enter or a click on it
   runs the search. */
body.aisp-page.aisp-results-mode .aisp-bar-tools { order: -1; }
body.aisp-page.aisp-results-mode .aisp-submit {
  width: 26px; height: 26px; border-radius: 7px;
  background: none; color: #8A97A8;
}
body.aisp-page.aisp-results-mode .aisp-submit:hover:not(:disabled) { background: none; color: #16263C; }
body.aisp-page.aisp-results-mode .aisp-submit svg { width: 15px; height: 15px; }
body.aisp-page.aisp-results-mode .aisp-submit:disabled {
  opacity: 1; background: none; color: #A6B0BF; box-shadow: none; transform: none;
}
body.aisp-page.aisp-results-mode .aisp-input { padding: 0; }
body.aisp-page.aisp-results-mode .aisp-input-row { flex: 1 1 auto; min-width: 0; }
body.aisp-page.aisp-results-mode .aisp-bar-tools { flex: none; padding: 0; }

body.aisp-page.aisp-results-mode .aisp-summary-q { font-size: 15.5px; font-weight: 650; line-height: 1.35; }
/* "New search" and the history clock are gone from the card: Recent below is
   the history, and typing a new question is what starts a new search. */
/* The card holds the box and the hint, and nothing else: the query is the
   box's own placeholder now, filters live in the chips below as "+ Add", and
   Recent is the list at the foot of the column. */
body.aisp-page.aisp-results-mode .aisp-newsearch,
body.aisp-page.aisp-results-mode .aisp-summary,
body.aisp-page.aisp-results-mode .aisp-bar-ic,
/* The "+" button and the clock are gone from the box, but their wrapper
   stays in the document: the filters menu lives INSIDE it, and a display:none
   parent hides a child whatever the child says. Hiding the wrapper was why
   "+ Add" opened a menu nobody could see. It takes no room. */
body.aisp-page.aisp-results-mode #aisp-add-btn,
body.aisp-page.aisp-results-mode .aisp-coach { display: none; }
/* Recent searches has no control of its own in this column. The list down
   the side took a third of the panel and the clock in the box was one more
   thing in a box with two icons already; clicking into an empty box offers
   the list instead, which is where a student is looking anyway. */
body.aisp-page.aisp-results-mode .aisp-recentrail { display: none; }
/* The wrapper stays: the menu lives inside it, and a display:none parent
   hides a child whatever the child says — the same trap the filters menu
   was in. Only the button is hidden, and the wrapper takes no room. */
body.aisp-page.aisp-results-mode .aisp-histwrap {
  display: block; position: static; width: 0; height: 0; overflow: visible;
}
body.aisp-page.aisp-results-mode #aisp-hist-btn { display: none; }

/* The clock is in here, so the wrapper is a real box again — it used to be
   collapsed to nothing because the only thing it held was the hidden "+"
   and the filters menu that hangs off it. */
body.aisp-page.aisp-results-mode .aisp-tool-left {
  display: flex; align-items: center; width: auto; height: auto; overflow: visible; margin: 0;
}
body.aisp-page.aisp-results-mode .aisp-addwrap { display: block; position: static; }
/* And it hangs off the chip against the WINDOW, because the navy column it
   would otherwise sit in clips its own overflow. placeAddMenu() sets the
   coordinates. */
body.aisp-page.aisp-results-mode .aisp-addmenu { position: fixed; }
body.aisp-page.aisp-results-mode .aisp-input { font-size: 14.5px; }
body.aisp-page.aisp-results-mode .aisp-tool-label {
  font-size: 13px; color: #8A97A8; font-weight: 500;
}
body.aisp-page.aisp-results-mode .aisp-bar:focus-within { transform: none; }
/* One line stays one line. A long query wrapped the box back into the two
   rows it was just cut down from; it scrolls sideways instead. */
/* 450 at 14px, antialiased, read as washed out next to everything else in
   the card. What a student typed is the most important text on this page. */
body.aisp-page.aisp-results-mode .aisp-input {
  height: 20px; min-height: 20px; max-height: 20px;
  font-size: 13.5px; font-weight: 600; color: #16263C;
  white-space: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
}
/* The placeholder stays light, so the last search and a new one never look
   like the same thing. */
body.aisp-page.aisp-results-mode .aisp-input::placeholder {
  font-weight: 500; color: #98A5B6;
}
body.aisp-page.aisp-results-mode .aisp-input::-webkit-scrollbar { display: none; }
body.aisp-page.aisp-results-mode .aisp-tool-label {
  color: #8A97A8; font-size: 12px; font-weight: 550; margin-left: 0;
}
/* Two glyphs, one button: an arrow where the box starts a conversation, a
   magnifier where it is the search field at the top of a result list. */
.aisp-submit-find { display: none; }
body.aisp-results-mode .aisp-submit-go { display: none; }
body.aisp-results-mode .aisp-submit-find { display: block; }

/* Filters, named, with the "+" to add another. */
body.aisp-page.aisp-results-mode .aisp-chippane { display: block; order: 2; margin-bottom: 0; }
body.aisp-results-mode .aisp-chippane { position: relative; z-index: 1; }
body.aisp-results-mode .aisp-chippane .aisp-pchips { margin: 0; gap: 7px; }
/* A filter that is ON: filled, with the × that takes it off. */
/* On: the same outline, filled pale so it reads as pressed rather than as
   a different kind of control. */
body.aisp-results-mode .aisp-pchip {
  background: #EAF0F8; border: 1px solid #1E3A5F; color: #1E3A5F;
  height: 32px; padding: 0 12px; border-radius: 9px; font-size: 12.5px; font-weight: 600;
}
body.aisp-results-mode .aisp-pchip:hover { background: #DCE7F5; }
body.aisp-results-mode .aisp-pchip-x { color: rgba(30,58,95,.5); }
body.aisp-results-mode .aisp-pchip-x:hover { color: #1E3A5F; }
/* The filter "+" sits with the chips as a dashed "+ Add", the way a chip that
   adds another chip should read. */
.aisp-addchip {
  display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 14px;
  border: 1px dashed rgba(30,58,95,.28); border-radius: 999px; background: none;
  color: #5D6E88; font: inherit; font-size: 13px; font-weight: 550; cursor: pointer;
}
.aisp-addchip:hover { background: rgba(30,58,95,.05); color: #16263C; }
/* ── The filters, in the column ──────────────────────────────────────────
   A line per group: what it is, what it is set to, and a chevron. Five
   groups of chips all open filled the column and still had to be read to
   find out what was on. */
.aisp-fset { display: flex; flex-direction: column; }
.aisp-pchips-extra { margin-bottom: 14px; }
.aisp-frows { display: flex; flex-direction: column; }
.aisp-frow-item + .aisp-frow-item { border-top: 1px solid rgba(30,58,95,.09); }
.aisp-frow-row {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 15px 2px; border: 0; background: none; cursor: pointer; text-align: left;
  font: inherit;
}
.aisp-frow-k {
  flex: none; font-size: 14px; font-weight: 700; color: #16263C; letter-spacing: -.01em;
}
.aisp-frow-v {
  flex: 1 1 auto; min-width: 0; text-align: right;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 13.5px; font-weight: 500; color: #1E3A5F;
}
.aisp-frow-v.is-any { color: #9AA6B6; }
.aisp-frow-c { flex: none; width: 12px; height: 12px; color: #9AA6B6; transition: transform .15s; }
.aisp-frow-item.is-open .aisp-frow-c { transform: rotate(90deg); }
.aisp-frow-row:hover .aisp-frow-k { color: #2E6BD0; }
.aisp-frow-body { padding: 0 2px 16px; }
.aisp-frow-foot { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(30,58,95,.09); }

/* Advanced filters: the sixth row, to the founder's design. */
.aisp-fadv-k { display: inline-flex; align-items: center; gap: 9px; }
.aisp-fadv-row { gap: 12px; }
.aisp-fadv-tag {
  font-size: 11px; font-weight: 750; color: #fff; background: #253858;
  border-radius: 999px; padding: 3px 9px; letter-spacing: .01em;
}
.aisp-fadv-v { flex: 1 1 auto; text-align: right; font-size: 13.5px; font-weight: 600; color: #253858; white-space: nowrap; }
.aisp-fadv-v.is-any { color: #9AA6B6; font-weight: 500; }
.aisp-fadv-caret { flex: none; width: 12px; height: 12px; color: #253858; transition: transform .15s; }
.aisp-fadv-item.is-open .aisp-fadv-caret { transform: rotate(180deg); }
.aisp-fadv-item.is-open { padding-bottom: 6px; }
.aisp-fadv {
  border: 1px solid #D9DDE6; border-radius: 14px; background: #fff; padding: 0 12px;
}
.aisp-fadv-grp {
  display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: center; gap: 10px;
  padding: 12px 0;
}
.aisp-fadv-grp + .aisp-fadv-grp { border-top: 1px solid #ECEEF3; }
.aisp-fadv-gk { font-size: 12.5px; font-weight: 700; color: #9AA0AE; }
.aisp-fadv-pills { display: flex; flex-wrap: wrap; gap: 7px; }
.aisp-fadv-pill {
  height: 30px; padding: 0 13px; border-radius: 999px; cursor: pointer; font: inherit;
  border: 1px solid #D5D9E2; background: #fff; color: #16263C; font-size: 12.5px; font-weight: 600;
  white-space: nowrap; transition: background .12s, border-color .12s, color .12s;
}
.aisp-fadv-pill:hover { border-color: #253858; }
.aisp-fadv-pill.is-on { background: #253858; border-color: #253858; color: #fff; }

/* The phone "Filters" button; hidden on wider screens, where the rows show. */
.aisp-fmob { display: none; }
@media (max-width: 760px) {
  .aisp-fmob {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 12px 14px;
    border: 1px solid rgba(30,58,95,.14); border-radius: 12px; background: #fff;
    font: inherit; font-size: 14px; font-weight: 700; color: #16263C; cursor: pointer; text-align: left;
  }
  .aisp-fmob > svg:first-child { width: 16px; height: 16px; flex: none; }
  .aisp-fmob-n {
    font-size: 12px; font-weight: 700; color: #1E3A5F; background: #EAF0F8;
    border-radius: 999px; padding: 2px 8px;
  }
  .aisp-fmob .aisp-frow-c { margin-left: auto; }
  .aisp-fset.is-mob-open .aisp-fmob .aisp-frow-c { transform: rotate(90deg); }
  .aisp-fset:not(.is-mob-open) .aisp-fset-body { display: none; }
  .aisp-fset.is-mob-open .aisp-fset-body { margin-top: 6px; }
}

.aisp-fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.aisp-fchip {
  display: inline-flex; align-items: center; height: 28px; padding: 0 11px;
  border: 1px solid rgba(30,58,95,.16); border-radius: 999px; background: #fff;
  color: #45566E; font: inherit; font-size: 12.5px; font-weight: 550; cursor: pointer;
  transition: border-color .12s, background .12s, color .12s;
}
.aisp-fchip:hover { border-color: #1E3A5F; color: #16263C; }
.aisp-fchip.is-on { background: #EAF0F8; border-color: #1E3A5F; color: #1E3A5F; font-weight: 600; }
.aisp-fadd {
  display: inline-flex; align-items: center; height: 28px; padding: 0 11px;
  border: 1px dashed rgba(46,107,208,.4); border-radius: 999px; background: none;
  color: #2E6BD0; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.aisp-fadd:hover { background: rgba(46,107,208,.07); border-color: #2E6BD0; }
/* The box it becomes, the same height and shape as the chip it replaced, so
   the row does not change height while you type in it. */
.aisp-faddbox { display: inline-flex; position: relative; }
/* The city list under the box. */
.aisp-fsugg {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 190px;
  display: flex; flex-direction: column; padding: 5px; border-radius: 12px; background: #fff;
  border: 1px solid rgba(30,58,95,.12); box-shadow: 0 12px 28px rgba(22,38,60,.14);
}
.aisp-fsugg[hidden] { display: none; }
.aisp-fsugg-opt {
  border: 0; background: none; text-align: left; cursor: pointer; font: inherit;
  padding: 8px 10px; border-radius: 8px; font-size: 13px; font-weight: 550; color: #16263C;
}
.aisp-fsugg-opt:hover, .aisp-fsugg-opt.is-active { background: #EEF3FA; color: #1E3A5F; }
.aisp-faddin {
  width: 140px; height: 28px; padding: 0 11px; box-sizing: border-box;
  border: 1px solid #2E6BD0; border-radius: 999px; background: #fff;
  font: inherit; font-size: 12.5px; font-weight: 550; color: #16263C;
}
.aisp-faddin:focus { outline: none; box-shadow: 0 0 0 3px rgba(46,107,208,.14); }
.aisp-faddin::placeholder { color: #9AA6B6; font-weight: 500; }
/* Why the last attempt did not take. It sits on its own line so appearing
   cannot reflow the chips beside it. */
.aisp-fnote {
  flex-basis: 100%; margin-top: 2px; font-size: 11.5px; color: #8A6A2E;
}
.aisp-fclear {
  display: inline-flex; align-items: center; gap: 6px;
  border: 0; background: none; padding: 4px 0; cursor: pointer;
  font: inherit; font-size: 13px; font-weight: 600; color: #45566E;
}
.aisp-fclear svg { width: 11px; height: 11px; flex: none; }
.aisp-fclear:hover { color: #16263C; text-decoration: underline; text-underline-offset: 3px; }

/* Recent searches: a section of the panel, not a card of its own. Still a
   disclosure, so it folds away. */
.aisp-recentrail { order: 6; position: relative; z-index: 1; }
.aisp-recentrail[hidden] { display: none; }
.aisp-recentrail-h {
  display: flex; align-items: center; gap: 6px; cursor: pointer; list-style: none;
  font-size: 12.5px; font-weight: 500; color: #8A97A8;
}
.aisp-recentrail-h::-webkit-details-marker { display: none; }
.aisp-recentrail-h:hover { color: #16263C; }
/* The chevron is the only thing that says this folds, so it is always
   there. Hiding it until hover made a disclosure nobody could find. */
.aisp-recentrail-h svg {
  width: 12px; height: 12px; margin-left: auto; opacity: .75; transition: transform .15s;
}
.aisp-recentrail[open] .aisp-recentrail-h svg { transform: rotate(180deg); }
.aisp-recentrail[open] .aisp-recentrail-h svg { transform: rotate(180deg); }
.aisp-recentrail-list { display: flex; flex-direction: column; margin-top: 8px; }
.aisp-recentrail-item {
  display: flex; align-items: center; gap: 10px;
  border: 0; background: none; padding: 7px 0; text-align: left; cursor: pointer;
  font: inherit; font-size: 13.5px; color: #2A3E57;
}
.aisp-recentrail-item > span {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.aisp-recentrail-ic { flex: none; width: 15px; height: 15px; color: #A6B0BF; }
.aisp-recentrail-item:hover { color: #16263C; }
.aisp-recentrail-item:hover .aisp-recentrail-ic { color: #53637A; }


/* ── The list ── */
body.aisp-page.aisp-results-mode .aisp-panel-wrap {
  grid-column: 2; grid-row: 2; background: #fff; border-radius: 0;
  border-left: 1px solid rgba(30,58,95,.09);
  padding: 16px 0 28px; overflow-y: auto;
}
body.aisp-page.aisp-results-mode .aisp-panel { max-width: none; margin: 0; width: 100%; }
/* The list's own header: how many, and how they are ordered. */
/* A caption, not a headline: the roles under it are the thing to look at.
   It also reads in one weight and one colour now, rather than half bold. */
.aisp-listhead {
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  margin: 0 21px 10px;
}
.aisp-listhead-n { font-size: 12.5px; font-weight: 600; letter-spacing: 0; color: #8A97A8; }
.aisp-listhead-n span { font-weight: 600; color: #8A97A8; }
.aisp-listhead-sort { font-size: 12.5px; font-weight: 600; color: #8A97A8; }

@media (max-width: 980px) {
  body.aisp-page.aisp-results-mode .main {
    display: flex; flex-direction: column; padding: 0; background: #fff;
  }
  body.aisp-page.aisp-results-mode .aisp-hero { border-radius: 0; padding: 18px 16px; }
  /* Stacked, so the divider between the columns would be a stray line down
     the left edge of the list. */
  body.aisp-page.aisp-results-mode .aisp-panel-wrap {
    border-radius: 0; border-left: 0; border-top: 1px solid rgba(30,58,95,.09);
    padding: 16px 14px 24px;
  }
}
body.aisp-page .aisp-lock-banner { padding-left: 0; padding-right: 0; }
body.aisp-page .aisp-controls { padding-left: 0; padding-right: 0; border-bottom: 0; box-shadow: none; }
body.aisp-page .aisp-controls::after { display: none; }
/* No heading or count above the results: the conversation already says how
   many were found. The cards start at the top. */
body.aisp-page .aisp-lock-banner, body.aisp-page .aisp-controls { display: none !important; }
body.aisp-page #aisp-list { padding-top: 0; }
/* Fill the results pane: no centred 780px column with empty sides, and no
   side padding — the rows carry that, so their dividers reach both edges. */
body.aisp-page.aisp-results-mode .aisp-panel-wrap { padding: 16px 0 28px; }
/* The strip above and the list below sit in the same column, with the same
   side padding, so the query lines up with the roles it produced. Two rules
   used to fight over this: one centred the list at 980px, the next let it
   run full width, and the later one won. */
body.aisp-page.aisp-results-mode .aisp-panel { max-width: 1120px; margin: 0 auto; width: 100%; }
/* Full screen: the page fills everything right of the rail, no 7px inset
   and no rounded outer card. */
body.aisp-page .main {
  margin: 0 0 0 var(--sidebar-w); border-radius: 0; min-height: 100vh; box-shadow: none;
}
body.aisp-page.aisp-results-mode .main { height: 100vh; }
body.aisp-page .main::before { border-radius: 0; }

/* A role is a card, not a line in a list.
   Three parts, left to right: the company's mark, big enough to recognise
   without reading; the title with one quiet line of facts under it; and a
   panel holding the two things the row exists for, the match and Apply.
   Those two sit together because they are one decision, not two. */
/* A role is one line of card: the score at the left edge where a column of
   them reads straight down, the title and who-and-where beside it, and the
   way in at the right. It was three stacked blocks and a tile, which is a
   lot of room for a row somebody is scanning past. */
body.aisp-page #aisp-list { gap: 12px; padding: 2px 20px 28px; }
/* ROOMIER, so a role is a thing rather than a line in a list. Six or seven
   on a screen, not twelve: a student triaging internships is reading each one,
   and a dense list makes them all look the same. */
body.aisp-page .aisp-rcard {
  border: 1px solid rgba(30,58,95,.11); border-radius: 16px;
  background: #fff; padding: 20px 20px; margin: 0;
  display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; column-gap: 18px;
  align-items: center;
  transition: border-color .12s, background .12s;
}
body.aisp-page .aisp-rcard:hover { border-color: rgba(30,58,95,.22); }
body.aisp-page .aisp-rcard.expanded { border-color: rgba(44,90,160,.45); background: rgba(44,90,160,.03); }

/* The score. */
.aisp-rcard-fit {
  grid-column: 1; align-self: stretch; min-width: 0; min-height: 72px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 14px; background: #EAF0F8;
}
.aisp-rcard-fit.is-strong { background: #1E3A5F; }
.aisp-fp-n {
  font-size: 21px; font-weight: 800; color: #1E3A5F; letter-spacing: -.035em;
  line-height: 1; font-variant-numeric: tabular-nums;
}
.aisp-rcard-fit.is-strong .aisp-fp-n { color: #fff; }
.aisp-fp-l { margin-top: 4px; font-size: 10.5px; font-weight: 500; color: #5A7396; }
.aisp-rcard-fit.is-strong .aisp-fp-l { color: rgba(255,255,255,.72); }
.aisp-rcard-fit.is-none { background: #F4F6FA; cursor: help; }
.aisp-fp-word {
  padding: 0 8px; text-align: center; line-height: 1.3;
  font-size: 12px; font-weight: 650; color: #8494A8; letter-spacing: -.01em;
}

/* The role. */
body.aisp-page .aisp-rcard-toggle { grid-column: 2; display: block; min-width: 0; }
body.aisp-page .aisp-rcard-title {
  font-size: 17px; font-weight: 750; color: #16263C; line-height: 1.3; letter-spacing: -.022em;
}
body.aisp-page .aisp-rcard-line {
  display: flex; align-items: center; gap: 8px; margin-top: 8px; min-width: 0;
}
.aisp-rcard-linetxt {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 13.5px; color: #8A97A8;
}
/* The employer's mark, inline in that line rather than a block of its own. */
body.aisp-page .aisp-rcard-logo {
  flex: none; width: 22px; height: 22px; border-radius: 6px; border: 0;
  font-size: 8.5px; font-weight: 750; letter-spacing: 0; box-shadow: none; background: #fff;
}
body.aisp-page .aisp-rcard-logo img { padding: 0; border-radius: 5px; }

/* The way in. */
body.aisp-page .aisp-rcard-acts {
  position: static; grid-column: 3; margin: 0; opacity: 1;
  display: flex; flex-direction: row; align-items: center; gap: 10px;
  padding: 0; border-radius: 0; background: none;
}
/* APPLY IS THE ONLY DECISION ON THE ROW, so it is the only thing on the row
   that carries a fill. It was #E9F0F9 on navy text, which at this size reads
   as a disabled chip: every row had eight of them going down the page and
   none of them looked pressable. */
body.aisp-page .aisp-rcard-act.is-apply {
  width: auto; min-width: 100px; height: 40px; padding: 0 24px; justify-content: center;
  background: #16263C; border: 0; color: #fff;
  border-radius: 999px; font-size: 13.5px; font-weight: 700;
}
body.aisp-page .aisp-rcard-act.is-apply:hover { background: #294566; color: #fff; }
body.aisp-page .aisp-rcard-save {
  position: static; flex: none; width: 26px; height: 26px; border-radius: 7px;
  border: 0; background: none; color: #A6B0BF;
}
body.aisp-page .aisp-rcard-save:hover { background: #F2F5F9; color: #16263C; }
body.aisp-page .aisp-rcard-save.saved { color: #1F5FAF; }
body.aisp-page .aisp-rcard-save svg { width: 15px; height: 15px; }
body.aisp-page .aisp-bubble {
  max-width: 88%; padding: 7px 12px; border-radius: 8px;
  background: #F2F4F7; border: 0; box-shadow: none;
  font-size: 13.5px; font-weight: 500; color: #16263C; line-height: 1.45;
}
body.aisp-page .aisp-turn.assistant .aisp-mark { display: none; }
body.aisp-page .aisp-assist { font-size: 13.5px; font-weight: 500; color: #4A5B70; padding: 0; }
/* The bar's own look is set once, further up, as a filled pill with a navy
   round button. Three later blocks were each re-stating a border, a white
   fill, a box-shadow and a 30px square button, and the last one won — which
   is why the box kept coming back hairlined with a grey button. */
body.aisp-page.aisp-results-mode .aisp-bar-ic { opacity: .7; }
/* Petite: a smaller menu with smaller rows, an icon between the box and the
   words, and no "Soon" rows. */
.aisp-addmenu { width: 272px; padding: 6px; border-radius: 13px; }
.aisp-addmenu .aisp-scopemenu-lbl { margin: 0 -6px; padding: 7px 14px 3px; }
.aisp-scopemenu-lbl { font-size: 9px; }
.aisp-scopeopt { font-size: 12px; font-weight: 550; gap: 8px; padding: 5px 7px; border-radius: 7px; }
.aisp-scopeopt .aisp-tick { width: 14px; height: 14px; border-radius: 4px; border-width: 1.25px; }
.aisp-scopeopt .aisp-tick svg { width: 8px; height: 8px; }
.aisp-optic { width: 16px; display: inline-flex; justify-content: center; flex-shrink: 0; color: #6E7F95; }
.aisp-scopeopt:hover .aisp-optic, .aisp-scopeopt[aria-pressed="true"] .aisp-optic { color: #1F6CE1; }
/* Locked Pro filters stay visible and clickable — clicking explains the
   upgrade rather than doing nothing. Muted, but not greyed into looking
   broken: the point is that a Free student can see what Pro buys. */
.aisp-scopeopt.locked { color: #6B7688; cursor: pointer; }
.aisp-scopeopt.locked:hover { background: rgba(31,108,225,.09); color: #2C3B52; }
.aisp-scopeopt .aisp-tick.lock {
  background: transparent; border-color: rgba(22,38,60,.18); color: #94A2B5;
}
.aisp-prolabel {
  margin-left: auto; flex-shrink: 0;
  font-size: 9px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
  color: #7A5AF8; background: #F0EDFE; border: 1px solid #DCD5FB;
  border-radius: 999px; padding: 2px 7px;
}
/* Refinements are commands, not toggles — no checkbox slot to align to, so
   the text is aligned by padding alone rather than an empty icon element.
   The padding must still equal what a ticked row's text sits at: base
   .aisp-scopeopt padding-left (8px) + tick width (16px) + gap (9px) = 33px.
   This was 25px — 8px short, exactly the tick's own missing width — so
   every plain row's text started to the left of every other row's, which
   is what read as the menu being out of alignment with itself. */
.aisp-scopeopt.plain { font-weight: 550; color: #46586F; }
/* No override on the box. It was toned down on the theory that a command
   should not look like a toggle, which just produced two different boxes
   in one menu. Identical to every other row now. */
.aisp-scopemenu-lbl.aisp-refine-group { border-top: 1px solid rgba(22,38,60,.08); padding-top: 9px; }
.aisp-submit {
  width: 32px; height: 32px; border-radius: 50%; border: none; flex-shrink: 0;
  background: #C2D9F5; color: #2E5C93; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: none;
  transition: background .12s, color .12s, transform .12s, box-shadow .12s;
}
.aisp-submit:hover { background: #1765E5; color: #fff; transform: translateY(-1px); box-shadow: 0 7px 16px rgba(18,94,207,.25); }
.aisp-submit:disabled { background: #C2D9F5; color: #2E5C93; cursor: default; transform: none; box-shadow: none; }

.aisp-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
.aisp-chip {
  font-family: inherit; font-size: 12.5px; font-weight: 600; color: #3A4453;
  background: rgba(255,255,255,.66); border: 1px solid rgba(22,38,60,.12);
  border-radius: 999px; padding: 8px 15px; cursor: pointer;
  backdrop-filter: blur(6px); transition: background .12s, border-color .12s, transform .12s;
}
.aisp-chip:hover { background: #fff; border-color: rgba(22,38,60,.24); transform: translateY(-1px); }

/* ── Floating panel ── */
.aisp-panel-wrap { position: relative; z-index: 3; padding: 0 24px 64px; margin-top: 4px; flex: 1; }
.aisp-panel {
  max-width: 760px; margin: 0 auto;
  background: rgba(255,255,255,.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.72); border-radius: 26px;
  box-shadow: 0 6px 18px rgba(15,48,92,.07), 0 28px 80px rgba(11,53,123,.12);
  padding: 30px 32px 26px; min-height: 270px;
  transition: opacity .16s ease, filter .16s ease;
}
/* Brief settle state between a refinement and its results — dims the
   still-visible previous results rather than clearing them, so an edit
   reads as "working on it" instead of vanishing and instantly reappearing. */
.aisp-panel.aisp-thinking { opacity: .5; filter: saturate(.6); pointer-events: none; }

/* ── Stacked sheet (initial screen only) ──
   The suggestions sit in a sheet tucked under the composer's bottom edge and
   inset on both sides, so the two read as one stacked object instead of two
   cards floating at different depths. The composer is lifted above the sheet
   so the overlap is genuinely hidden behind it. */
/* The landing screen is one centred composition: greeting, count, and the bar
   sit in the middle of the viewport with air on both sides. Top-aligning them
   left a crowded band at the top and a large empty field underneath — the
   opposite of where the eye should land. The suggestions sheet deliberately
   starts BELOW the fold: it is there if you scroll for ideas, not competing
   with the thing you came to do. */
body:not(.aisp-results-mode) .aisp-hero {
  min-height: calc(100vh - 92px);   /* viewport minus topbar and the main's inset */
  place-items: center;
  padding: 16px 32px 48px;
  z-index: 4;
}
/* The composer carries the landing screen, so it gets the full column. */
body:not(.aisp-results-mode) .aisp-hero-inner { width: min(740px, 100%); }
body:not(.aisp-results-mode) .aisp-panel-wrap { z-index: 2; margin-top: 0; padding: 0 24px 56px; }
body:not(.aisp-results-mode) .aisp-panel {
  max-width: 720px;
