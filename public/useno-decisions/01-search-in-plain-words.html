/* ── Email alert opt-in prompt (email-alerts-prompt.js) ──────────────────────
   A card in the page flow, never an overlay: it must not sit on top of the
   feed, must not trap focus, and must be scrollable past. Both buttons are
   real buttons with visible focus rings, and the decline is not styled to
   disappear — a "Not now" you have to hunt for is the dark pattern this
   feature is supposed to avoid. */
.eap {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  margin: 0 0 14px; padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--navy-border);
  border-radius: 12px;
}
.eap.is-busy { opacity: .75; }
/* The STANDING control — a setting, not an interruption.

   Quieter than the one-time ask on purpose: it is always on screen, so it
   has to be legible for months rather than arresting for one impression.
   Tinted rather than plain so it reads as a distinct band above the toolbar,
   and it never gets the ask's heavier border. */
/* The inline control — a toolbar item, not a banner.

   It began as a full-width tinted band above the toolbar. That band sat on
   the sticky header's border, scrolled underneath it, and added a third
   stacked horizontal bar to a page that already had two. Slimming it did not
   help, because the band was the problem: this is the same control with the
   card taken away.

   Bordered like the pills beside it so it reads as a control rather than
   loose text, but not pill-rounded, because it is a setting for the board and
   not another filter. */
.eap-inline {
  position: relative;
  display: inline-flex; align-items: center; gap: 9px;
  height: 40px; padding: 0 8px 0 14px;
  border: 1.5px solid var(--navy-border); border-radius: 12px;
  background: #fff;
  font-size: 13px; white-space: nowrap;
}
.eap-inline-label { font-weight: 500; color: var(--navy); cursor: pointer; user-select: none; }
/* Absolutely positioned so a failure message cannot widen the control and
   shove the toolbar — the same reflow the label and the Manage link used to
   cause on every toggle. */
.eap-inline .eap-status {
  position: absolute; top: calc(100% + 4px); right: 0;
  margin: 0; font-size: 12px; white-space: nowrap; z-index: 5;
  background: #fff; padding: 2px 6px; border-radius: 6px;
}
.eap-inline .eap-status[hidden] { display: none; }
.eap-prefs {
  font-size: 12.5px; font-weight: 600; color: var(--navy); text-decoration: none;
  border-bottom: 1px solid rgba(22, 38, 60, .28); padding-bottom: 1px;
}
.eap-prefs:hover { border-bottom-color: var(--navy); }
.eap-prefs:focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; border-radius: 2px; }
.eap-prefs[hidden] { display: none; }
/* A switch, sized to the 44px touch target its hit area needs while the
   painted track stays small. */
.eap-switch {
  position: relative; flex-shrink: 0; cursor: pointer;
  width: 44px; height: 26px; padding: 0;
  border: 1px solid var(--navy-border); border-radius: 999px;
  background: #FFFFFF; transition: background .15s, border-color .15s;
}
.eap-switch[aria-checked="true"] { background: var(--navy); border-color: var(--navy); }
.eap-switch:disabled { cursor: default; opacity: .6; }
.eap-switch:focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; }
.eap-switch-knob {
  position: absolute; top: 50%; left: 3px; transform: translateY(-50%);
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--navy-border);
  transition: transform .15s ease, background .15s;
}
.eap-switch[aria-checked="true"] .eap-switch-knob {
  background: #FFFFFF; transform: translateY(-50%) translateX(18px);
}
@media (prefers-reduced-motion: reduce) {
  .eap-switch, .eap-switch-knob { transition: none; }
}
.eap-text { min-width: 0; flex: 1 1 260px; }
.eap-title { margin: 0; font-size: 14px; font-weight: 700; color: var(--navy); letter-spacing: -0.01em; }
.eap-body { margin: 3px 0 0; font-size: 13px; line-height: 1.45; color: var(--navy-muted); }
.eap-status { margin: 6px 0 0; font-size: 12px; font-weight: 600; color: var(--navy-muted); }
.eap-status.is-error { color: #B4342B; }
.eap-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.eap-btn {
  font: inherit; font-size: 13px; font-weight: 600;
  padding: 8px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid transparent; transition: background .15s, color .15s, border-color .15s;
}
.eap-btn:disabled { cursor: default; opacity: .6; }
.eap-btn:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
.eap-btn-primary { background: var(--navy); color: #fff; }
.eap-btn-primary:hover:not(:disabled) { background: var(--navy-hover); }
.eap-btn-quiet { background: transparent; color: var(--navy-muted); border-color: var(--navy-border); }
.eap-btn-quiet:hover:not(:disabled) { color: var(--navy); border-color: var(--navy-border-strong); }

@media (max-width: 640px) {
  /* Stacked rather than squeezed: side by side at this width the decline
     shrinks to a sliver, which is exactly the shape being avoided. */
  .eap { flex-direction: column; align-items: stretch; }
  /* flex-basis is the MAIN axis, which is now the vertical one — the 260px
     that keeps the text from collapsing in a row became 260px of empty height
     between the copy and the buttons. */
  .eap-text { flex: 0 1 auto; }
  .eap-actions { width: 100%; }
  .eap-btn { flex: 1 1 0; }
}

/* ── Page-name tab, one size on every page ───────────────────────────────
   Search, Resources, Applications, Employers and Settings each styled their
   own header tab, at four different sizes. One rule for all of them: any
   tab container sitting directly in the top header. */
body header.top-header > [class$="-tabs"] > a,
body header.top-header > [class$="-tabs"] > button,
body header.top-header > [class$="-tabs"] > span {
  font-family: 'Plus Jakarta Sans', var(--sidebar-f), system-ui, sans-serif;
  font-size: 14px; font-weight: 600; letter-spacing: -0.005em; line-height: 1.3;
  padding: 5px 11px; border-radius: 7px; border: 0;
  color: rgba(47, 82, 112, 0.5); background: transparent; text-decoration: none;
}
body header.top-header > [class$="-tabs"] > .active,
body header.top-header > [class$="-tabs"] > [aria-current="page"],
body header.top-header > [class$="-tabs"] > :only-child {
  color: #2F5270; background: rgba(47, 82, 112, 0.07);
}

/* ── One hairline between the rail and the page ──────────────────────────
   The rail wore a #D7E0EA border AND a 22px soft shadow, which drew a blurry
   double edge down the whole page. One thin line, no shadow. On Explore the
   white fade painted over the blue field's left edge is gone too. */
body .sidebar.sidebar-student {
  border-right: 1px solid rgba(30, 58, 95, .11) !important;
  box-shadow: none !important;
}
body.aisp-page .main::after { display: none !important; }
body.aisp-page .main { box-shadow: none !important; }

/* ── A white rail ─────────────────────────────────────────────────────────
   The grey-blue rail next to white pages read as a tinted panel bolted on,
   and pure white lost the edge entirely. A barely-off-white rail, a firmer
   hairline, and a clearer tint on the current page. */
body .sidebar.sidebar-student { background: #FAFBFD !important; }
body .sidebar.sidebar-student #sidebar-nav .nav-item.active { background: rgba(44, 90, 160, .10) !important; }
body .sidebar.sidebar-student #sidebar-nav .nav-item:hover { background: rgba(30, 58, 95, .035) !important; }

/* No hover label on the resize edge: dragging still works, the tooltip was
   clutter. */
.sidebar-resize-tip { display: none !important; }

/* Every student page's header carries the same hairline under it. Some page
   stylesheets had dropped it. */
body header.top-header { border-bottom: 1px solid rgba(30, 58, 95, .10) !important; }


body.aisp-page .main {
  background: linear-gradient(180deg, #FBFDFF 0%, #F1F6FD 45%, #E4EDF9 100%);
  background-color: #E4EDF9;
  display: flex; flex-direction: column;
  margin-top: 7px; margin-right: 7px; margin-bottom: 7px;
  margin-left: calc(var(--sidebar-w) + 7px);
  min-height: calc(100vh - 14px); position: relative; overflow: clip;
  border-radius: 14px;
  isolation: isolate;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.5),
    0 10px 30px rgba(17,55,110,.075);
}
body.aisp-page .main::before {
  content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  border-radius: inherit;
  background:
    radial-gradient(ellipse 48% 42% at 50% -2%, rgba(255,255,255,.98) 0%, rgba(247,251,255,.88) 34%, rgba(238,246,255,.18) 71%, transparent 100%),
    radial-gradient(ellipse 46% 54% at 2% 53%, #3D7DF1 0%, rgba(61,125,241,.72) 39%, transparent 78%),
    radial-gradient(ellipse 48% 58% at 99% 48%, #4E8DF4 0%, rgba(78,141,244,.7) 40%, transparent 79%),
    radial-gradient(ellipse 50% 45% at 50% 82%, #124DBA 0%, rgba(18,77,186,.72) 44%, transparent 82%),
    linear-gradient(180deg, #F8FBFF 0%, #DCEAFF 27%, #83AEF5 58%, #316FD8 83%, #1B56B7 100%);
  background-color: #1B56B7;
  background-repeat: no-repeat;
  background-size: 100% max(100vh, 760px);
}
body.aisp-page .main::after {
  content: ''; position: absolute; inset: 0 auto 0 0; z-index: 1;
  width: 30px; pointer-events: none; border-radius: 14px 0 0 14px;
  background: linear-gradient(90deg, rgba(244,246,249,.78) 0%, rgba(244,246,249,.24) 42%, rgba(244,246,249,0) 100%);
}

/* ── Signal Ignition: the AI mark activates the blue field ── */
html.aisp-motion-first body.aisp-page .main::before {
  clip-path: circle(0 at var(--aisp-origin-x, 50%) var(--aisp-origin-y, 38%));
  will-change: clip-path, filter;
}
html.aisp-motion-return body.aisp-page .main::before {
  clip-path: circle(64% at var(--aisp-origin-x, 50%) var(--aisp-origin-y, 38%));
  opacity: .82;
}
html.aisp-motion-first body.aisp-page .aisp-headline,
html.aisp-motion-first body.aisp-page .aisp-bar,
html.aisp-motion-first body.aisp-page .aisp-panel-wrap {
  opacity: 0;
}
html.aisp-motion-first body.aisp-page .aisp-headline {
  filter: blur(5px); transform: translateY(8px);
}
html.aisp-motion-first body.aisp-page .aisp-bar {
  filter: blur(4px); transform: translateY(14px) scale(.987);
}
html.aisp-motion-first body.aisp-page .aisp-panel-wrap { transform: translateY(18px); }
html.aisp-motion-first body.aisp-page .aisp-kicker { color: rgba(32,75,128,.68); }
html.aisp-motion-first body.aisp-page .aisp-kicker-mark::after {
  content: ''; position: absolute; inset: -5px; border: 1px solid rgba(31,108,225,.38);
  border-radius: 50%; opacity: 0; transform: scale(.55); pointer-events: none;
}

html.aisp-motion-first.aisp-motion-run body.aisp-page .main::before {
  animation: aispSignalField 880ms cubic-bezier(.16,1,.3,1) 90ms both;
}
html.aisp-motion-first.aisp-motion-run body.aisp-page .aisp-kicker-mark {
  animation: aispSignalStar 620ms cubic-bezier(.2,.8,.2,1) both;
}
html.aisp-motion-first.aisp-motion-run body.aisp-page .aisp-kicker {
  animation: aispSignalKicker 420ms ease-out 80ms both;
}
html.aisp-motion-first.aisp-motion-run body.aisp-page .aisp-kicker-mark::after {
  animation: aispSignalRing 700ms cubic-bezier(.16,1,.3,1) 35ms both;
}
html.aisp-motion-first.aisp-motion-run body.aisp-page .aisp-headline {
  animation: aispSignalContent 540ms cubic-bezier(.16,1,.3,1) 310ms both;
}
html.aisp-motion-first.aisp-motion-run body.aisp-page .aisp-bar {
  animation: aispSignalBar 600ms cubic-bezier(.16,1,.3,1) 410ms both;
}
html.aisp-motion-first.aisp-motion-run body.aisp-page .aisp-panel-wrap {
  animation: aispSignalPanel 560ms cubic-bezier(.16,1,.3,1) 540ms both;
}

html.aisp-motion-return body.aisp-page .aisp-headline,
html.aisp-motion-return body.aisp-page .aisp-bar { opacity: .82; transform: translateY(3px); }
html.aisp-motion-return.aisp-motion-run body.aisp-page .main::before {
  animation: aispSignalReturnField 280ms cubic-bezier(.2,.8,.2,1) both;
}
html.aisp-motion-return.aisp-motion-run body.aisp-page .aisp-headline,
html.aisp-motion-return.aisp-motion-run body.aisp-page .aisp-bar {
  animation: aispSignalReturnContent 260ms ease-out 40ms both;
}

@keyframes aispSignalField {
  0% { clip-path: circle(0 at var(--aisp-origin-x) var(--aisp-origin-y)); filter: saturate(.72); }
  42% { filter: saturate(.92); }
  100% { clip-path: circle(145% at var(--aisp-origin-x) var(--aisp-origin-y)); filter: saturate(1); }
}
@keyframes aispSignalStar {
  0% { transform: scale(.88); box-shadow: 0 0 0 rgba(31,108,225,0); }
  38% { transform: scale(1.12); box-shadow: 0 0 22px rgba(31,108,225,.32); }
  100% { transform: scale(1); box-shadow: 0 0 0 rgba(31,108,225,0); }
}
@keyframes aispSignalKicker {
  from { color: rgba(32,75,128,.68); }
  to { color: #204B80; }
}
@keyframes aispSignalRing {
  0% { opacity: 0; transform: scale(.55); }
  22% { opacity: .72; }
  100% { opacity: 0; transform: scale(2.15); }
}
@keyframes aispSignalContent {
  from { opacity: 0; filter: blur(5px); transform: translateY(8px); }
  to { opacity: 1; filter: blur(0); transform: translateY(0); }
}
@keyframes aispSignalBar {
  from { opacity: 0; filter: blur(4px); transform: translateY(14px) scale(.987); }
  to { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); }
}
@keyframes aispSignalPanel {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes aispSignalReturnField {
  from { clip-path: circle(64% at var(--aisp-origin-x) var(--aisp-origin-y)); opacity: .82; }
  to { clip-path: circle(145% at var(--aisp-origin-x) var(--aisp-origin-y)); opacity: 1; }
}
@keyframes aispSignalReturnContent {
  from { opacity: .82; transform: translateY(3px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Transparent floating topbar: hamburger slot (mobile) + profile circle ── */
.aisp-topbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 22px; pointer-events: none;
}
/* The page-title tab that used to sit here is gone; its rules went with it
   rather than lingering as dead CSS waiting to be re-applied by accident.
   `margin-left: auto` is what now holds this against the right edge — with
   the tab removed it is the topbar's only child, and space-between does
   nothing to a single item. */
.aisp-topbar .top-header-inner {
  display: flex; align-items: center; pointer-events: auto; margin-left: auto;
}

/* ── Hero with dimensional gradient ── */
/* The hero is deliberately short and the same height in every mode: the
   search bar has to sit in one fixed place whether you are about to
   generate matches or refining the ones already on screen. Anything that
   moves the bar makes it read as a different control. */
.aisp-hero {
  position: relative; flex-shrink: 0;
  display: grid; place-items: start center;
  padding: clamp(54px, 7vh, 76px) 32px 26px;
}

.aisp-hero-inner { position: relative; z-index: 2; width: min(1000px, 100%); margin: 0 auto; text-align: center; }
.aisp-kicker {
  width: max-content; max-width: 100%; margin: 0 auto 24px;
  display: flex; align-items: center; gap: 8px; color: #204B80;
  font-size: 11px; font-weight: 750; letter-spacing: .085em; text-transform: uppercase;
}
.aisp-kicker-mark {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 999px; background: rgba(23,101,229,.1); color: #1765E5;
}
/* Weight 700 at -.04em tracking packed the letters together and read as
   heavy rather than confident — the thing that made this look tacky. Lighter
   weight with normal-ish tracking carries the same size far more calmly, and
   the white text-shadow (a faux emboss against the gradient) comes off. */
.aisp-headline {
  /* 700 and #123F76, the landing page's hero values, so the two read as the
     same product rather than a heavier marketing page and a lighter app. */
  font-size: clamp(27px, 2.8vw, 36px); font-weight: 700; color: #123F76;
  letter-spacing: -.022em; line-height: 1.12; margin-bottom: 26px;
  text-wrap: balance;
}

/* ── Opening brief ──
   Two states share one slot so the bar below never shifts: "counting" while
   the corpus is being ranked, then the count plus the generate button. */
.aisp-brief { min-height: 0; margin-bottom: 18px; display: grid; place-items: center; align-content: start; gap: 12px; }
/* Hidden: the page opens on the question and the bar. The element stays in
   the DOM because the Generate handler still looks it up. */
.aisp-brief { display: none !important; }
body.aisp-results-mode .aisp-brief { display: none; }

/* ── Hiring managers: card on the role, modal with the people ────────────── */
.aisp-ref-row {
  display: flex; align-items: center; gap: 14px; width: 100%;
  padding: 18px 20px; border: 0; border-radius: 14px;
  background: #16263C; color: #fff; cursor: pointer; font-family: inherit; text-align: left;
  transition: background .12s, box-shadow .12s;
}
.aisp-ref-row:hover { background: #21344F; box-shadow: 0 10px 26px -16px rgba(22,38,60,.7); }
.aisp-ref-row:focus-visible { outline: 2px solid #1F5FB8; outline-offset: 2px; }
.aisp-ref-ic { flex: 0 0 36px; width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: rgba(31,95,184,.1); color: #1F5FB8; }
.aisp-ref-ic svg { width: 17px; height: 17px; }
.aisp-ref-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.aisp-ref-name { font-size: 15px; font-weight: 700; color: #fff; }
.aisp-ref-sub { font-size: 12.5px; color: rgba(255,255,255,.72); line-height: 1.45; }
.aisp-ref-go {
  display: inline-flex; align-items: center; gap: 4px; padding: 8px 14px; border-radius: 9px;
  background: #fff; color: #16263C; font-size: 13px; font-weight: 700; white-space: nowrap;
}
.aisp-ref-go svg { width: 13px; height: 13px; }

.aisp-rmodal {
  position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center;
  padding: 24px; background: rgba(15,25,40,.16);
}
.aisp-rmodal-card {
  width: min(560px, 100%); max-height: min(78vh, 760px); display: flex; flex-direction: column;
  background: #fff; border-radius: 20px; box-shadow: 0 30px 70px -20px rgba(15,25,40,.45); overflow: hidden;
}
/* Who the team belongs to, and the way out. The company name is the real
   heading; "Hiring team" is a status line under it that later gets replaced
   with a count once a lookup has actually run. */
.aisp-rmodal-head {
  display: flex; align-items: center; gap: 14px;
  margin: 0; padding: 26px 26px 0;
  border: 0; background: transparent;
}
.aisp-rmodal-mark {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 52px; height: 52px; border-radius: 12px;
  background: #15181F; color: #fff; font-size: 18px; font-weight: 800;
}
.aisp-rmodal-txt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.aisp-rmodal-h {
  font-size: 20px; font-weight: 800; color: #16263C; letter-spacing: -.01em; line-height: 1.25;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.aisp-rmodal-sub {
  margin-top: 2px; font-size: 14px; color: #6b7686;
}
.aisp-rmodal-x {
  flex: none; align-self: flex-start; width: 30px; height: 30px; border: 0; border-radius: 50%;
  background: transparent; color: #9aa6b8; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.aisp-rmodal-x:hover { background: rgba(22,38,60,.07); color: #5a6d82; }
.aisp-rmodal-x svg { width: 15px; height: 15px; }

/* ── The tailoring panel ───────────────────────────────────────
 *
 * Tailoring used to be a page: pressing "Tailor my resume" left Explore,
 * loaded a second app, asked which of six resumes to use, and then showed a
 * report. It is one decision, about one document, for the role already on
 * screen, so it opens over the role instead and takes the primary resume
 * without asking.
 *
 * THE DOCUMENT IS THE POINT, so the right-hand pane is a sheet of paper and
 * not a preview pane: a white page with page margins, on grey, at the size a
 * resume is read at. The rail on the left names every change in the student's
 * own words, and each change is ALSO drawn on the line it changed, so the
 * list and the page say the same thing and neither has to be matched against
 * the other.
 *
 * The match hangs off the outside edge as a small chip. It is a fact about
 * the posting rather than a result of tailoring, and it had grown into the
 * largest thing on a panel it is not the subject of.
 */
.aisp-tlr {
  position: fixed; inset: 0; z-index: 1000; display: flex;
  align-items: center; justify-content: center; padding: 20px;
  background: rgba(13, 26, 43, .5);
}
/* BIGGER, AND THE EXTRA GOES TO THE RAIL.
 *
 * The panel was 1140 x 780 with a 440px rail, which on a laptop left a third
 * of the screen as backdrop while the rail scrolled: "Looks good" sat below
 * the fold on a resume with one problem. The card now takes what the window
 * will give it and stops at a size a document is still comfortable in.
 *
 * The resume does NOT grow with it. Its type stays where it is, because a
 * resume set in large type is not a resume: the whole point of the right-hand
 * pane is that it looks like the page an employer will open. */
.aisp-tlr-card {
  position: relative;
  display: flex; flex-direction: column;
  width: 100%; max-width: 1420px; height: 100%; max-height: 920px;
  background: #fff; border-radius: 18px; overflow: hidden;
  box-shadow: 0 32px 80px -20px rgba(13, 26, 43, .5);
}
.aisp-tlr-panes { flex: 1 1 auto; min-height: 0; display: flex; }

/* ── The rail ───────────────────────────────────────────────── */
/* The rail takes the extra width, up to a point: past about 560px the chips
   stop wrapping and the group headings pull apart from their counts. */
.aisp-tlr-side {
  flex: 0 1 540px; min-width: 400px; max-width: 540px;
  display: flex; flex-direction: column;
  background: #fff; border-right: 1px solid #ECF0F5;
}
/* The mark, the role and the way out on one line. */
/* ALIGNED TO THE TOP, NOT TO THE MIDDLE. Centred, the way out drifted down
   the header as the role title wrapped to a second line and a third, so it
   sat level with nothing in particular. The corner is where a way out is. */
.aisp-tlr-head {
  flex: none; display: flex; justify-content: flex-start; padding: 14px 16px 0;
}
.aisp-tlr-x {
  flex: none; width: 30px; height: 30px; border: 0; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: #F2F5F9; color: #5D6E88; cursor: pointer; transition: background .12s;
}
.aisp-tlr-x:hover { background: #E4EAF3; }
.aisp-tlr-x svg { width: 12px; height: 12px; }

.aisp-tlr-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 16px 26px 22px; }
.aisp-tlr-foot {
  flex: none; padding: 14px 26px; border-top: 1px solid #EEF1F6; background: #fff;
}

/* THIS RESUME AGAINST THIS POSTING, on one line: which document, and what it
   scores. They are two halves of the same question, and the match sitting on
   a line of its own above read as a fact about the job instead.

   One number, and no arrow out of a second one: see tailorScoreHtml for why a
   before-and-after here is a claim the engine cannot back. */
/* WHICH DOCUMENT, AND WHAT IT SCORES, as one line under the role. The rule
   below them is what separates the thing being judged from the judgement. */
/* ONE LINE, ALWAYS. It wrapped the moment the resume was called "RTX:
   Systems Engineering - Summer Intern 2027", which is exactly the name this
   panel gives the documents it writes: the match fell to a second row and the
   header grew a step every time a student came back to a role they had
   already tailored. The name truncates instead. */
.aisp-tlr-row {
  flex: none; display: flex; flex-wrap: nowrap; align-items: center; gap: 8px;
  padding: 14px 20px; border-bottom: 1px solid #EDF0F5;
}
.aisp-tlr-row .aisp-tlr-using { margin-left: 4px; }
.aisp-tlr-using { flex: none; font-size: 14.5px; color: #8494A8; }

/* The match, as a pill rather than a tile: it is a fact about the pair above
   it, not a second subject. */
.aisp-tlr-fit {
  flex: none; margin-left: auto; display: inline-flex; align-items: baseline; gap: 7px;
  padding: 6px 14px; border-radius: 999px;
  background: #EAF1FB; color: #1B4E9B; font-size: 13.5px; font-weight: 700;
}
.aisp-tlr-fit-w { font-size: 11.5px; font-weight: 600; color: #6B86AC; }

/* The name over a control, in the words of the question it answers. */
.aisp-tlr-lab {
  margin: 0 0 8px; font-size: 12.5px; font-weight: 650; color: #7C8B9E;
}

/* WHICH VERSION IS ON SCREEN. Screen 2 only: there is nothing to compare
   against until something has been changed. */
.aisp-tlr-pv {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-top: 20px;
}
.aisp-tlr-pv .aisp-tlr-lab { margin: 0; }
.aisp-tlr-seg {
  display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: #EEF2F7;
}
.aisp-tlr-seg-b {
  padding: 6px 14px; border: 0; border-radius: 999px; background: none;
  font-family: inherit; font-size: 12.5px; font-weight: 650; color: #7C8B9E;
  cursor: pointer; transition: background .12s, color .12s;
}
.aisp-tlr-seg-b:hover { color: #16263C; }
.aisp-tlr-seg-b.is-on {
  background: #fff; color: #16263C; box-shadow: 0 1px 2px rgba(22,38,60,.14);
}
.aisp-tlr-seg-b:focus-visible { outline: 2px solid #1F5FB8; outline-offset: 1px; }

/* THE WAIT, AS THE ONLY THING ON THE SCREEN. A dot and a sentence in the
   corner read as a status line on a panel that was otherwise still showing
   the previous answer. Centred, with the rest of the rail empty, the panel is
   plainly doing one thing. */
.aisp-tlr-work {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 240px; padding: 0 20px; text-align: center;
}
.aisp-tlr-work-t {
  margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.015em; color: #16263C;
}
.aisp-tlr-work-bar {
  display: block; width: 100%; max-width: 360px; height: 3px; margin: 20px 0 18px;
  border-radius: 999px; background: #ECEFF4; overflow: hidden;
}
/* A SWEEP, NOT A PERCENTAGE. There is one round trip and no progress to
   report from inside it, so a bar that filled steadily would be inventing
   one. This says "running" and claims nothing about how far along it is. */
.aisp-tlr-work-fill {
  display: block; width: 40%; height: 100%; border-radius: 999px;
  background: #16263C; animation: aisp-worksweep 1.25s ease-in-out infinite;
}
@keyframes aisp-worksweep {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(250%); }
}
.aisp-tlr-work-s { margin: 0; font-size: 13px; color: #9AA6B6; }
@media (prefers-reduced-motion: reduce) {
  .aisp-tlr-work-fill { animation: none; width: 100%; opacity: .25; }
}

/* Which resume. The select is laid invisibly over the row: a native select
   cannot hold a pill and a chevron where this puts them, and replacing it
   with a div would cost the keyboard and the screen reader the one control
   that works. */
.aisp-tlr-pickwrap { position: relative; flex: 0 1 auto; min-width: 0; }
/* Not a field. A button that looks like the name it carries, with a chevron
   to say it can be changed. */
.aisp-tlr-pick {
  display: inline-flex; align-items: center; gap: 5px; max-width: 100%;
  padding: 2px 0; border: 0; border-radius: 6px; background: none;
  font-family: inherit; text-align: left; cursor: pointer;
}
.aisp-tlr-pick:disabled { cursor: default; }
.aisp-tlr-pick:hover:not(:disabled) .aisp-tlr-pick-n { color: #1B4E9B; }
.aisp-tlr-pick:focus-visible { outline: 2px solid #1F5FB8; outline-offset: 2px; }
.aisp-tlr-pick.is-open .aisp-tlr-pick-v { transform: rotate(180deg); }
.aisp-tlr-pick-n {
  min-width: 0; font-size: 14.5px; font-weight: 700; color: #16263C;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.aisp-tlr-pick-v {
  flex: none; width: 14px; height: 14px; color: #8494A8; transition: transform .14s;
}

/* The list. Two lines per row, because the name alone does not tell three
   files called "Riley Morgan" apart. */
.aisp-tlr-menu {
  position: absolute; z-index: 5; top: calc(100% + 6px); left: 0; right: 0;
  max-height: 320px; overflow: auto; padding: 6px;
  background: #fff; border: 1px solid #E2E8F1; border-radius: 14px;
  box-shadow: 0 16px 40px -12px rgba(13, 26, 43, .28);
}
.aisp-tlr-opt {
  display: flex; align-items: center; gap: 11px; position: relative;
  width: 100%; box-sizing: border-box;
  padding: 10px 38px 10px 10px; border: 0; border-radius: 11px;
  background: none; font-family: inherit; text-align: left; cursor: pointer;
}
.aisp-tlr-opt:hover { background: #F4F7FB; }
.aisp-tlr-opt:focus-visible { outline: 2px solid #1F5FB8; outline-offset: -2px; }
/* The one in use is a quiet grey, not a blue selection. It is a statement
   about which document is open, not a thing the student just picked. */
.aisp-tlr-opt.is-on { background: #F2F5F9; }
.aisp-tlr-opt-i {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 9px; background: #EDF1F6; color: #5D6E88;
}
.aisp-tlr-opt.is-on .aisp-tlr-opt-i { background: #fff; }
.aisp-tlr-opt-i svg { width: 15px; height: 15px; }
.aisp-tlr-opt-c { flex: 1 1 auto; min-width: 0; }
.aisp-tlr-opt-t { display: flex; align-items: baseline; gap: 5px; }
.aisp-tlr-opt-n {
  min-width: 0; font-size: 14.5px; font-weight: 700; color: #16263C;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.aisp-tlr-opt-p { flex: none; font-size: 13px; color: #8494A8; }
.aisp-tlr-opt-s {
  display: block; margin-top: 1px; font-size: 13px; color: #8494A8;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.aisp-tlr-opt-k {
  position: absolute; right: 13px; top: 50%; margin-top: -8px;
  width: 16px; height: 16px; color: #253B5C;
}

/* ── Screen 1: what is wrong, and what is already right ─────────────── */
.aisp-tlr-dx { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }

.aisp-tlr-g { border-radius: 16px; overflow: hidden; }
.aisp-tlr-g.is-bad { background: #FDF1EF; }
.aisp-tlr-g.is-ok { background: #EFF6F1; }
.aisp-tlr-g-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; }
.aisp-tlr-g-k { flex: none; display: inline-flex; }
.aisp-tlr-g-k svg { width: 20px; height: 20px; }
.aisp-tlr-g.is-bad .aisp-tlr-g-k { color: #D1503F; }
.aisp-tlr-g.is-ok .aisp-tlr-g-k { color: #3C9B62; }
.aisp-tlr-g-n {
  flex: 1 1 auto; font-size: 16.5px; font-weight: 750; letter-spacing: -.02em;
  color: #16263C;
}
.aisp-tlr-g-c { flex: none; font-size: 13px; font-weight: 600; }
.aisp-tlr-g.is-bad .aisp-tlr-g-c { color: #C0493A; }
.aisp-tlr-g.is-ok .aisp-tlr-g-c { color: #2F7E4E; }

/* A ROW INSIDE ITS GROUP. Hairlines rather than gaps, so the group reads as
   one object with parts and not as cards that happen to share a colour. */
.aisp-tlr-dx-b { border-top: 1px solid rgba(22,38,60,.06); }
.aisp-tlr-dx-b:not(.is-shut) { background: rgba(255,255,255,.45); }
.aisp-tlr-dx-h {
  display: flex; align-items: center; gap: 11px; width: 100%; box-sizing: border-box;
  padding: 13px 16px; border: 0; background: none; font-family: inherit;
  text-align: left; cursor: pointer;
}
.aisp-tlr-dx-h:focus-visible { outline: 2px solid #1F5FB8; outline-offset: -2px; }
.aisp-tlr-dx-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.aisp-tlr-dx-dot.is-red { background: #D8524A; }
.aisp-tlr-dx-dot.is-amber { background: #E0A32B; }
.aisp-tlr-dx-dot.is-green { background: #3C9B62; }
.aisp-tlr-dx-n {
  flex: 1 1 auto; min-width: 0; font-size: 15px; font-weight: 700;
  letter-spacing: -.015em; color: #16263C;
}
.aisp-tlr-dx-v { flex: none; font-size: 13.5px; color: #6E7E92; }
.aisp-tlr-dx-c {
  flex: none; width: 14px; height: 14px; color: #A6B2C2;
  transform: rotate(180deg); transition: transform .16s;
}
.aisp-tlr-dx-b.is-shut .aisp-tlr-dx-c { transform: rotate(-90deg); }
.aisp-tlr-dx-body { padding: 0 16px 14px; }
.aisp-tlr-dx-b.is-shut .aisp-tlr-dx-body { display: none; }
.aisp-tlr-dx-t { margin: 10px 0 0; font-size: 13px; line-height: 1.5; color: #7A8899; }
.aisp-tlr-dx-q {
  margin: 0 0 8px; padding: 11px 13px; border-radius: 10px; background: #fff;
  font-size: 13px; line-height: 1.5; color: #24384F;
}
.aisp-tlr-dx-w {
  display: block; margin-top: 5px; font-size: 11.5px; font-weight: 650; color: #BF7A1C;
}

/* A misspelling and its spelling, side by side, because the student has to
   find the word on their own resume and then know what to type. */
.aisp-tlr-sp { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.aisp-tlr-sp-x {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 13px; border-radius: 999px;
  background: #FDF1F1; border: 1px solid #F3DEDE; font-size: 13px;
}
.aisp-tlr-sp-x s { color: #B4463F; text-decoration-thickness: 1.5px; }
.aisp-tlr-sp-x b { font-weight: 650; color: #16263C; }

/* The phrases. White on the card's grey, so a chip reads as something to pick
   up rather than as more of the card. */
/* THE ATS QUESTION, AND THE LIST OF ANSWERS. */
.aisp-tlr-ats { padding: 2px 16px 16px; }
.aisp-tlr-ats-k {
  margin: 12px 0 0; font-size: 10.5px; font-weight: 750; letter-spacing: .09em;
  text-transform: uppercase; color: #C0493A;
}
.aisp-tlr-ats-q {
  margin: 5px 0 0; font-size: 15.5px; font-weight: 750; letter-spacing: -.02em;
  color: #16263C;
}
.aisp-tlr-ats-s { margin: 3px 0 12px; font-size: 13px; color: #7A8899; }
.aisp-tlr-ats-l {
  border-radius: 14px; background: #fff; overflow: hidden;
  box-shadow: 0 1px 2px rgba(22,38,60,.05);
}
.aisp-tlr-ats-r {
  display: flex; align-items: center; gap: 13px; width: 100%; box-sizing: border-box;
  padding: 13px 15px; border: 0; border-top: 1px solid #F0F3F7; background: none;
  font-family: inherit; text-align: left; cursor: pointer; transition: background .12s;
}
.aisp-tlr-ats-r:first-child { border-top: 0; }
.aisp-tlr-ats-r:hover { background: #FAFBFD; }
.aisp-tlr-ats-r:focus-visible { outline: 2px solid #1F5FB8; outline-offset: -2px; }
/* The box is the decision. Empty and outlined it is plainly unanswered;
   filled it is plainly a yes, and neither state needs a word to explain it. */
.aisp-tlr-ats-b {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 7px;
  border: 1.5px solid #D3DBE6; background: #fff; color: #fff;
  transition: background .12s, border-color .12s;
}
.aisp-tlr-ats-r.is-on .aisp-tlr-ats-b { background: #16263C; border-color: #16263C; }
.aisp-tlr-ats-b svg { width: 12px; height: 12px; }
.aisp-tlr-ats-n {
  flex: 1 1 auto; min-width: 0; font-size: 14px; color: #16263C;
}
.aisp-tlr-ats-t { flex: none; font-size: 13px; font-weight: 600; color: #2F7E4E; }

.aisp-tlr-kw { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.aisp-tlr-kw-x {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 15px; border: 1px solid transparent; border-radius: 999px;
  font-family: inherit; font-size: 14px; font-weight: 600;
  background: #fff; color: #24384F; cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.aisp-tlr-kw-x:hover { border-color: #CBD6E4; }
.aisp-tlr-kw-x:focus-visible { outline: 2px solid #1F5FB8; outline-offset: 1px; }
/* The chip does not change shape, the PLUS changes colour. Six tinted chips
   in a block read as one coloured area; six white chips with a green plus
   each read as six separate yesses, which is what they are. */
.aisp-tlr-kw-tick { display: inline-flex; width: 13px; height: 13px; color: #B6C2D1; }
.aisp-tlr-kw-x.is-added .aisp-tlr-kw-tick { color: #3C9B62; }
/* ADDED: the border and the plus go green, and the chip stays white. There is
   no struck-through state here any more. Nothing starts on, so a chip that is
   not green has not been REFUSED, it has not been chosen yet, and striking it
   through said the student had turned down six phrases they had not read. */
.aisp-tlr-kw-x.is-added { border-color: #CBE6D6; background: #F6FBF8; }
.aisp-tlr-kw-tick svg { width: 13px; height: 13px; }

/* The skills, in the order they are read, with the one that moves marked.
   Not controls: the reorder is one change and the panel already has a way to
   refuse it, on the line itself. */
.aisp-tlr-sk {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 8px 14px; border-radius: 999px;
  background: #fff; color: #7A8899; font-size: 13.5px; font-weight: 600;
}
.aisp-tlr-sk.is-move { background: #F6E7C6; color: #74510D; }
.aisp-tlr-sk svg { width: 10px; height: 10px; }

/* ── What changed, on screen 2 ─────────────────────────────────── */
.aisp-tlr-pv {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin: 2px 0 16px;
}
.aisp-tlr-pv .aisp-tlr-lab { margin: 0; font-weight: 600; color: #8D9AAB; }

/* A GROUP PER KIND OF CLAIM, in its own colour. Green is what the student
   put in, amber is their sentence said again, blue is the same words read
   sooner. Three different things, and the tint says which before the heading
   is read. */
.aisp-tlr-cg { padding: 14px 15px 15px; border-radius: 16px; margin-bottom: 12px; }
.aisp-tlr-cg.is-add { background: #EDF5EF; }
.aisp-tlr-cg.is-edit { background: #FCF3E6; }
.aisp-tlr-cg.is-move { background: #EAF0FA; }
.aisp-tlr-cg-h {
  display: flex; align-items: center; gap: 11px; width: 100%; box-sizing: border-box;
  padding: 0; margin-bottom: 12px; border: 0; background: none;
  font-family: inherit; text-align: left; cursor: pointer;
}
.aisp-tlr-cg-h:focus-visible { outline: 2px solid #1F5FB8; outline-offset: 3px; }
.aisp-tlr-cg-v {
  flex: none; width: 14px; height: 14px; color: #93A1B2;
  transform: rotate(180deg); transition: transform .16s;
}
.aisp-tlr-cg.is-shut .aisp-tlr-cg-v { transform: rotate(0deg); }
.aisp-tlr-cg.is-shut .aisp-tlr-cg-h { margin-bottom: 0; }
.aisp-tlr-cg.is-shut .aisp-tlr-cg-b { display: none; }
.aisp-tlr-cg-k {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%; color: #fff;
}
.aisp-tlr-cg-k svg { width: 16px; height: 16px; }
.aisp-tlr-cg.is-add .aisp-tlr-cg-k { background: #3C9B62; }
.aisp-tlr-cg.is-edit .aisp-tlr-cg-k { background: #BC8420; }
.aisp-tlr-cg.is-move .aisp-tlr-cg-k { background: #2E6BD0; }
.aisp-tlr-cg-n {
  flex: 1 1 auto; font-size: 15.5px; font-weight: 750; letter-spacing: -.02em;
  color: #16263C;
}
.aisp-tlr-cg-c { flex: none; font-size: 13px; font-weight: 650; }
.aisp-tlr-cg.is-add .aisp-tlr-cg-c { color: #2F7E4E; }
.aisp-tlr-cg.is-edit .aisp-tlr-cg-c { color: #9A6A12; }
.aisp-tlr-cg.is-move .aisp-tlr-cg-c { color: #255AAE; }

/* The phrases, as chips you can still take back. White on the tint, so the
   group's colour stays the heading's and the chips stay legible. */
.aisp-tlr-cg-kw { display: flex; flex-wrap: wrap; gap: 8px; }
.aisp-tlr-cgk {
  padding: 7px 14px; border: 1px solid #C7E0D1; border-radius: 999px;
  background: #fff; color: #2F7E4E;
  font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  transition: border-color .12s, color .12s;
}
.aisp-tlr-cgk:hover { border-color: #A9D2B9; }
.aisp-tlr-cgk:focus-visible { outline: 2px solid #1F5FB8; outline-offset: 1px; }
.aisp-tlr-cgk.is-off { border-color: #E2E6EC; color: #A3AFBE; text-decoration: line-through; }

/* One changed line, on the page's own white. */
.aisp-tlr-cgc {
  display: block; width: 100%; box-sizing: border-box; margin-bottom: 8px;
  padding: 13px 15px; border: 0; border-radius: 12px; background: #fff;
  font-family: inherit; text-align: left; cursor: pointer;
}
.aisp-tlr-cgc:last-child { margin-bottom: 0; }
.aisp-tlr-cgc:focus-visible { outline: 2px solid #1F5FB8; outline-offset: 1px; }
.aisp-tlr-cgc-t {
  display: block; font-size: 13.5px; line-height: 1.5; color: #16263C;
}
.aisp-tlr-cgc-u { display: block; margin-top: 6px; font-size: 12.5px; color: #8494A8; }
/* A change the student has refused. It stays on the list, because a refusal
   they cannot undo is not a choice. */
.aisp-tlr-cgc.is-off { background: rgba(255,255,255,.5); }
.aisp-tlr-cgc.is-off .aisp-tlr-cgc-t { color: #9AA6B6; text-decoration: line-through; }

/* ── Ask for another change ────────────────────────────────────── */
/* ONE OBJECT, WITH AN EDGE. The box and the line under it were two loose
   things at the end of a scroll: a field, then a sentence, with nothing
   saying they belonged together or where the panel stopped. Inside a bordered
   card they read as the one control they are, and the card is what tells you
   the list above it has ended. */
.aisp-tlr-ask {
  flex: none; margin: 0 20px 16px; padding: 5px;
  border: 1px solid #E2E8F1; border-radius: 18px; background: #fff;
  box-shadow: 0 1px 2px rgba(22,38,60,.04);
  transition: border-color .16s, box-shadow .16s;
}
.aisp-tlr-ask:focus-within {
  border-color: #BDD0E9; box-shadow: 0 4px 16px -6px rgba(22,38,60,.18);
}
.aisp-tlr-ask-did {
  display: flex; align-items: flex-start; gap: 9px; margin: 5px 5px 2px;
  padding: 10px 12px; border-radius: 13px; background: #F4F7FB;
}
.aisp-tlr-ask-q { flex: 1 1 auto; font-size: 13px; line-height: 1.45; color: #24384F; }
.aisp-tlr-ask-x {
  flex: none; width: 20px; height: 20px; border: 0; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: none; color: #8494A8; cursor: pointer;
}
.aisp-tlr-ask-x:hover { background: #E3EAF3; color: #16263C; }
.aisp-tlr-ask-x svg { width: 9px; height: 9px; }

/* ── Did you apply? ─────────────────────────────────────────────── */
/* IN THE MIDDLE, where the student is already looking. In the corner it was
   a notification, and a notification is a thing you learn to flick away: this
   is one question, asked once, and the answer is the difference between a
   tracker that is true and one that is not.
 *
   It still is not a trap. The backdrop is light rather than a blackout, and
   clicking it answers "not yet" and gives the page back. */
.aisp-da-wrap {
  position: fixed; inset: 0; z-index: 1200; display: flex;
  align-items: center; justify-content: center; padding: 24px;
  background: rgba(13,26,43,.28);
  animation: aisp-da-fade .16s ease-out;
}
.aisp-da {
  width: 100%; max-width: 380px;
  padding: 22px 24px 18px; border-radius: 18px;
  background: #fff;
  box-shadow: 0 28px 70px -20px rgba(13,26,43,.5);
  animation: aisp-da-in .18s ease-out;
}
@keyframes aisp-da-fade { from { opacity: 0; } }
@keyframes aisp-da-in {
  from { opacity: 0; transform: translateY(10px) scale(.98); }
}
@media (prefers-reduced-motion: reduce) {
  .aisp-da-wrap, .aisp-da { animation: none; }
}
.aisp-da-q {
  margin: 0; font-size: 18px; font-weight: 750; letter-spacing: -.02em; color: #16263C;
}
.aisp-da-acts { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 20px; }
.aisp-da-no {
  padding: 9px 13px; border: 0; border-radius: 10px; background: none;
  font-family: inherit; font-size: 13.5px; font-weight: 600; color: #5D6E88; cursor: pointer;
}
.aisp-da-no:hover { color: #16263C; }
.aisp-da-yes {
  padding: 9px 16px; border: 0; border-radius: 10px;
  background: #16263C; color: #fff;
  font-family: inherit; font-size: 13.5px; font-weight: 650; cursor: pointer;
}
.aisp-da-yes:hover { background: #253B5C; }
.aisp-da-busy { font-size: 13px; color: #7A8899; }
/* The job, named once, at the foot of the card: the question stays three
   words, and the footer says which application it is about. */
.aisp-da-job {
  display: flex; flex-direction: column; gap: 1px;
  margin: 18px -24px -18px; padding: 12px 24px 14px;
  border-top: 1px solid #EEF1F5; border-radius: 0 0 18px 18px; background: #F8FAFC;
}
.aisp-da-job-t, .aisp-da-job-c { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aisp-da-job-t { font-size: 13.5px; font-weight: 650; color: #16263C; }
.aisp-da-job-c { font-size: 13px; color: #7A8899; }

/* ── The exchange ──────────────────────────────────────────────── */
.aisp-tlr-th { margin-top: 20px; }
/* The student's own words, in a bubble on their side, the way every chat
   draws the half somebody typed. */
.aisp-tlr-th-u {
  display: flex; align-items: flex-start; gap: 8px; margin-left: auto;
  max-width: 85%; width: fit-content;
  padding: 10px 12px; border-radius: 14px 14px 4px 14px; background: #EEF2F7;
}
.aisp-tlr-th-q { font-size: 13px; line-height: 1.45; color: #24384F; }
.aisp-tlr-th-x {
  flex: none; width: 18px; height: 18px; margin-top: 1px; border: 0;
  border-radius: 50%; display: inline-flex; align-items: center;
  justify-content: center; background: none; color: #8494A8; cursor: pointer;
}
.aisp-tlr-th-x:hover { background: #DFE6EF; color: #16263C; }
.aisp-tlr-th-x svg { width: 8px; height: 8px; }
/* The panel's half: no bubble. It is not a person and dressing it as one
   invites the student to argue with it. */
.aisp-tlr-th-a {
  display: flex; align-items: center; gap: 8px; margin: 12px 2px 0;
  font-size: 13px; line-height: 1.5; color: #5A6B80;
}
.aisp-tlr-th-a.is-no { color: #7A5A14; }
.aisp-tlr-th-d { display: inline-flex; gap: 4px; }
.aisp-tlr-th-d i {
  width: 6px; height: 6px; border-radius: 50%; background: #9AA6B6;
  animation: aisp-think 1.1s ease-in-out infinite;
}
.aisp-tlr-th-d i:nth-child(2) { animation-delay: .15s; }
.aisp-tlr-th-d i:nth-child(3) { animation-delay: .3s; }
@keyframes aisp-think {
  0%, 60%, 100% { opacity: .3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-2px); }
}
@media (prefers-reduced-motion: reduce) {
  .aisp-tlr-th-d i { animation: none; opacity: .6; }
}
/* Said for a screen reader, which cannot see three dots move. */
.aisp-tlr-sr {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
.aisp-tlr-ask-row {
  display: flex; align-items: flex-end; gap: 8px;
  padding: 6px 6px 6px 13px; border: 0; background: none;
}
.aisp-tlr-ask-t {
  flex: 1 1 auto; min-width: 0; max-height: 96px; resize: none;
  padding: 9px 0; border: 0; background: none; outline: none;
  font-family: inherit; font-size: 13.5px; line-height: 1.5; color: #16263C;
}
.aisp-tlr-ask-t::placeholder { color: #A7B3C3; }
.aisp-tlr-ask-go {
  flex: none; width: 34px; height: 34px; border: 0; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: #16263C; color: #fff; cursor: pointer;
  box-shadow: 0 2px 6px -1px rgba(22,38,60,.35);
  transition: background .14s, box-shadow .14s, transform .14s;
}
.aisp-tlr-ask-go:hover:not(:disabled) {
  background: #253B5C; box-shadow: 0 4px 10px -2px rgba(22,38,60,.4);
}
.aisp-tlr-ask-go:active:not(:disabled) { transform: scale(.95); }
.aisp-tlr-ask-go:disabled { background: #D3DBE6; box-shadow: none; cursor: default; }
.aisp-tlr-ask-go svg { width: 15px; height: 15px; }
/* A dot rather than a spinner: the wait is a couple of seconds and a spinner
   at this size reads as an error badge. */
.aisp-tlr-ask-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #fff;
  animation: aisp-askpulse 1s ease-in-out infinite;
}
@keyframes aisp-askpulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) {
  .aisp-tlr-ask-dot { animation: none; }
}

/* ── The two ways out ───────────────────────────────────────── */
/* CENTRED, and sized to their words rather than stretched across the dialog.
   Pushed to the right edge the pair sat under the resume, 900px from the rail
   that contains every decision leading up to it: the eye finishes the changes
   on the left and has to travel the whole width to find the button. In the
   middle it belongs to both halves, which is what it acts on. */
.aisp-tlr-acts { display: flex; justify-content: center; gap: 10px; }
/* ONE BUTTON AND ONE WAY OUT, not two buttons. Outlined, "Keep original" was
   a second control of the same shape and nearly the same weight as the thing
   the panel exists to do: two near-equal boxes read as a choice between
   equals, and this is not one. As plain text it is still perfectly findable
   and it stops arguing. */
.aisp-tlr-keep {
  flex: none; padding: 13px 18px; border: 0; border-radius: 10px;
  font-family: inherit; font-size: 14px; font-weight: 650; letter-spacing: -.01em;
  background: none; color: #5D6E88; cursor: pointer; transition: color .12s;
}
.aisp-tlr-keep:hover { color: #16263C; }
.aisp-tlr-keep:focus-visible { outline: 2px solid #1F5FB8; outline-offset: 1px; }
/* Near-black and fully round. Navy put it in the same family as every other
   blue control on the page; black is the one thing on this screen that is not
   a shade of the interface.
 *
 * FLAT BLACK IS NOT THE SAME AS BLACK. Three things do the work here and none
 * of them is colour: a gradient so the pill has a lit side and a shadowed
 * one, an inset hairline along the top edge where a real object would catch
 * the light, and two shadows rather than one, a tight dark seat on the
 * surface and a wide soft fall beneath it. Each is almost invisible alone;
 * together they are the difference between a black rectangle and a thing. */
.aisp-tlr-go {
  flex: none; min-width: 200px;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 15px 30px; border: 0; border-radius: 999px;
  font-family: inherit; font-size: 14.5px; font-weight: 700; letter-spacing: .005em;
  background: linear-gradient(180deg, #2A2F37 0%, #0D0F12 100%);
  color: #fff; cursor: pointer;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.16),
    0 1px 2px rgba(13,15,18,.4),
    0 10px 24px -10px rgba(13,15,18,.65);
  transition: box-shadow .18s ease, transform .18s ease, filter .18s ease;
}
.aisp-tlr-go:hover {
  filter: brightness(1.14); transform: translateY(-1px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.2),
    0 2px 4px rgba(13,15,18,.4),
    0 16px 32px -12px rgba(13,15,18,.7);
}
.aisp-tlr-go:active {
  transform: translateY(0); filter: brightness(.96);
  box-shadow: inset 0 1px 2px rgba(0,0,0,.4), 0 1px 2px rgba(13,15,18,.35);
}
.aisp-tlr-go:focus-visible { outline: 2px solid #1F5FB8; outline-offset: 3px; }
/* Saving: flat, because an object that cannot be pressed should not look
   like it is sitting proud of the surface waiting to be. */
.aisp-tlr-go:disabled {
  background: #B9BFC8; box-shadow: none; filter: none; transform: none; cursor: default;
}

.aisp-tlr-note { padding: 4px 2px; font-size: 13.5px; line-height: 1.6; color: #7A8899; }

/* ── The sheet ────────────────────────────────────────────────
   A page, not a pane. Grey around it, a white sheet with real page margins
   inside, at a width a resume is actually set at. */
/* A PAGE, ON SOMETHING. White document on white panel, the resume had no
   edge: it ran into the rail and read as more of the same surface. */
.aisp-tlr-doc {
  flex: 1 1 auto; min-width: 0; overflow: auto;
  padding: 20px; box-sizing: border-box; background: #F4F6FA;
}
.aisp-tlr-sheet {
  /* Centred with a ceiling rather than stretched: a line of resume text 900px
     wide is unreadable, and the page should keep the proportions of the thing
     it is a picture of. */
  min-height: 100%; max-width: 720px; margin: 0 auto;
  box-sizing: border-box; background: #fff;
  border-radius: 16px; box-shadow: 0 1px 3px rgba(22,38,60,.07);
  /* The left margin is wide because the margin notes live in it. There is no
     grey gutter around the page: the pane IS the page, so the document gets
     the whole of the space rather than a framed thumbnail of it. */
  padding: 34px 38px 44px 52px;
}
.aisp-tlr-name {
  margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.025em; color: #16263C;
}
.aisp-tlr-contact { margin: 6px 0 0; font-size: 12px; color: #6B7C93; }
.aisp-tlr-sec { margin-top: 22px; }
.aisp-tlr-sec-h {
  margin: 0 0 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: #2E4A73;
  border-bottom: 1px solid #DDE3EC; padding-bottom: 6px;
}
.aisp-tlr-ent { margin-top: 12px; }
.aisp-tlr-ent-top { display: flex; align-items: baseline; gap: 12px; }
.aisp-tlr-ent-t {
  flex: 1 1 auto; min-width: 0; font-size: 12.5px; font-weight: 700; color: #16263C;
}
.aisp-tlr-ent-m { flex: none; font-size: 11.5px; color: #8494A8; }
.aisp-tlr-ent-s { font-size: 11.5px; color: #6B7C93; }

/* A LINE. Every line of the document is one of these, changed or not, so a
   tinted line sits exactly where an untinted one would and the page does not
   shift when a change is refused. */
.aisp-tlr-line {
  position: relative; display: block; width: 100%; box-sizing: border-box;
  margin-top: 3px; padding: 4px 8px; border: 0; border-radius: 4px;
  background: none; text-align: left;
  font-family: inherit; font-size: 12px; line-height: 1.6; color: #24384F;
}
.aisp-tlr-sec > .aisp-tlr-line { margin-top: 7px; }
.aisp-tlr-bl { margin: 5px 0 0; padding: 0; list-style: none; }
/* THE CHOICE, ON THE LINE. Anchored under the sentence it is about, because
   a menu that opens in the corner makes the student hold "which line was I
   on" in their head while they read it. */
.aisp-tlr-lm {
  position: absolute; z-index: 6; left: 8px; top: calc(100% + 4px);
  display: flex; flex-direction: column; min-width: 190px; padding: 5px;
  border-radius: 12px; background: #fff; border: 1px solid #E2E8F1;
  box-shadow: 0 14px 36px -12px rgba(13,26,43,.35);
}
.aisp-tlr-lm-b {
  padding: 9px 11px; border-radius: 8px;
  font-size: 12.5px; font-weight: 600; color: #24384F; white-space: nowrap;
}
.aisp-tlr-lm-b:hover { background: #F2F5F9; }
/* Putting their own words back is the one that undoes us, so it reads as the
   quieter option rather than the dangerous one: it is their resume. */
.aisp-tlr-lm-b.is-rev { color: #5D6E88; }

/* THE HIGHLIGHT, ON THE WORDS. A tinted block with a word in the margin made
   every change an announcement: the page stopped reading like a resume, and
   the label still never said WHICH part was new. A highlight marks the thing
   itself, the way anybody marks a document. */
.aisp-tlr-hi {
  background: #D6F0E0; color: inherit; border-radius: 3px;
  padding: 1px 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone;
}
/* A moved line and a rewritten one are marked WHOLE, because the change is
   the line, and in their own colours: blue for "the same words, read sooner",
   amber for "your sentence, said again". Green is reserved for what the
   student put in. */
.aisp-tlr-hi.is-move { background: #DCE9F8; }
.aisp-tlr-hi.is-edit { background: #FBEBC8; }
/* Flagged, not yet changed. On screen 1 nothing has been touched, so this is
   the only mark the page carries. */
.aisp-tlr-line.is-prop { background: #EEF4FC; border: 1px solid #D5E2F4; }
.aisp-tlr-mv.is-prop { color: #3C6DB0; }
button.aisp-tlr-line { cursor: pointer; transition: background .12s; }
button.aisp-tlr-line:hover { background: #F4F7FB; }
button.aisp-tlr-line:focus-visible { outline: 2px solid #1F5FB8; outline-offset: 1px; }

/* THE MARGIN NOTE: where this line used to be read. "2" means it was the
   second line under this role and now leads. It hangs in the page's own
   margin rather than indenting the text, so the document still reads as the
   document. */
.aisp-tlr-mv {
  position: absolute; right: 100%; top: 4px; margin-right: 9px;
  display: inline-flex; align-items: center; gap: 2px; white-space: nowrap;
  font-size: 11px; font-weight: 700; color: #BF7A1C;
}
.aisp-tlr-mv svg { width: 8px; height: 8px; }

@media (max-width: 900px) {
  .aisp-tlr { padding: 0; }
  .aisp-tlr-card { flex-direction: column; max-height: none; border-radius: 0; }
  .aisp-tlr-side { flex: none; max-width: none; border-radius: 0; border-right: 0; }
  .aisp-tlr-doc { border-radius: 0; padding: 14px; }
  .aisp-tlr-sheet { padding: 24px 18px 30px 56px; }
  .aisp-tlr-acts { flex-wrap: wrap; }
}
.aisp-rmodal-body { overflow-y: auto; padding: 28px 26px 26px; display: flex; flex-direction: column; gap: 8px; }
.aisp-rmodal-empty { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 28px 8px; font-size: 14px; line-height: 1.6; color: #5a6d82; }

  height: 64px; padding: 0 10px 0 22px; margin: 0;

}
.aisp-rmodal-find:hover { background: #2D466E; }
.aisp-rmodal-find:focus-visible { outline: 2px solid #1F5FB8; outline-offset: 2px; }
.aisp-rmodal-find-icon { flex: none; width: 18px; height: 18px; color: #fff; }

}

.aisp-rp {

}

}
.aisp-rp-main { flex: 1; min-width: 0; }
.aisp-rp-name {
  font-size: 15.5px; font-weight: 750; color: #16263C; letter-spacing: -.015em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.aisp-rp-acts { flex: none; display: flex; align-items: center; gap: 9px; }
/* The envelope. Present for everyone so the row does not change shape, and
   plainly dimmed when there is no work email to send to. */
.aisp-rp-mail {
  display: inline-flex; align-items: center; justify-content: center;

  text-decoration: none;
}
.aisp-rp-mail:hover { background: #E3EBF7; }
.aisp-rp-mail.is-off { color: #C3CCD9; background: #fff; cursor: not-allowed; }
.aisp-rp-mail.is-off:hover { background: #fff; }
.aisp-rp-mail svg { width: 18px; height: 18px; }
.aisp-rp-li {
  display: inline-flex; align-items: center; height: 40px; padding: 0 20px;

@media (max-width: 560px) {
  .aisp-rmodal { padding: 0; align-items: flex-end; }
  .aisp-rmodal-card { border-radius: 18px 18px 0 0; max-height: 88vh; }
  .aisp-rp { flex-wrap: wrap; }

/* ── The Explore paywall ───────────────────────────────────────────────────
   Sized and spaced like the empty state it replaces, not like an advert.
   One navy button, no gradient, no lock icon: the page is not broken and
   should not look as though it is. */
.aisp-lock {
  /* Covers the page, not the sidebar: the sidebar stays sharp and usable,
     and the card sits in the middle of the page area beside it. */
  position: fixed; top: 0; right: 0; bottom: 0; left: var(--sidebar-w, 0px);
  z-index: 1000; display: flex; align-items: center; justify-content: center;
  padding: 24px 16px; overflow-y: auto;
  background: rgba(237,241,246,.3);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  animation: aisp-lock-in .18s ease-out;
}
@keyframes aisp-lock-in { from { opacity: 0; } to { opacity: 1; } }
/* A non-subscriber's search, behind the Useno+ card: the count, and the first
   few roles blurred enough to read as results and not as the product. */
.aisp-tz { padding: 18px 22px; }
.aisp-tz-count { font-size: 15px; color: #45566E; margin: 0 0 14px; }
.aisp-tz-count strong { color: #16263C; font-weight: 800; }
.aisp-tz-list { display: flex; flex-direction: column; gap: 12px; filter: blur(5px); user-select: none; pointer-events: none; }
.aisp-tz-row {
  display: flex; align-items: center; gap: 16px; padding: 20px; border-radius: 16px;
  border: 1px solid rgba(30,58,95,.1); background: #fff;
}
.aisp-tz-fit { flex: none; width: 70px; height: 62px; border-radius: 12px; background: #1E3A5F; }
.aisp-tz-txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.aisp-tz-t { font-size: 16px; font-weight: 700; color: #16263C; }
.aisp-tz-s { font-size: 13.5px; color: #8A97A8; }
@media (prefers-reduced-motion: reduce) { .aisp-lock { animation: none; } }
@media (max-width: 768px) { .aisp-lock { left: 0; } .aisp-lock-inner { transform: none; } }
.aisp-lock-inner {
  width: 100%; max-width: 440px; margin: auto; text-align: center;
  /* The blur starts at the sidebar's edge, but the card centres on the whole
     window: shift it back by half the sidebar. */
  transform: translateX(calc(var(--sidebar-w, 0px) / -2));
}
.aisp-lock-x {
  position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border: 0; border-radius: 50%;
  background: rgba(255,255,255,.1); color: rgba(255,255,255,.85); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; transition: background .12s;
}
.aisp-lock-x:hover { background: rgba(255,255,255,.2); color: #fff; }
.aisp-lock-x svg { width: 14px; height: 14px; }
.aisp-lock-card {
  position: relative; text-align: left; padding: 36px 34px 28px; border-radius: 20px;
  background: #16263C; color: #fff;
  box-shadow: 0 30px 60px -24px rgba(22,38,60,.55), 0 10px 24px -10px rgba(31,95,184,.35);
}
.aisp-lock-title { margin: 0; padding-right: 36px; font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -.025em; line-height: 1.15; }
.aisp-lock-feats { list-style: none; margin: 24px 0 28px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.aisp-lock-feats li { display: flex; align-items: center; gap: 10px; font-size: 14px; color: rgba(255,255,255,.92); }
.aisp-lock-check {
  flex: 0 0 18px; width: 18px; height: 18px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.12); color: #9CC3F5;
}
.aisp-lock-check svg { width: 11px; height: 11px; }
.aisp-lock-cta {
  display: flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 12px;
  background: #fff; color: #16263C; font-size: 14.5px; font-weight: 700; text-decoration: none;
  transition: background .12s, transform .12s;
}
.aisp-lock-cta:hover { background: #EAF1FB; }
.aisp-lock-note { margin: 12px 0 0; text-align: center; font-size: 12.5px; font-weight: 600; color: #CFEFE0; }
.aisp-lock-foot { font-size: 13px; color: #7D8CA0; margin: 20px 0 0; }
.aisp-lock-foot a { color: #3D6A9E; font-weight: 600; text-decoration: none; }
.aisp-lock-foot a:hover { text-decoration: underline; }

/* ── Useno+ ──────────────────────────────────────────────────────────────────
 *
 * What a student without a subscription sees when they search. Two panes: the
 * product on the left, drawn rather than screenshotted, and the offer on the
 * right.
 *
 * The left pane is an ILLUSTRATION. Everything in it is sample content, the
 * same way the landing page draws its interface fragments instead of shrinking
 * real captures into a card. It is drawn at full size so the type is legible,
 * which is the whole reason it is drawn.
 *
 * Every amount is read from UsenoPlan at run time, which reads Stripe. None is
 * written into this page: an amount in markup is an amount nobody is charged
 * as soon as a price changes.
 *
 * The old feature-list card's rules are left in place above because
 * demo-explore.html still renders them; this page no longer does.
 */
.aisp-up {
  /* max-width as well as width: .aisp-lock is a flex container, and a flex
     item wider than the line overflows it rather than shrinking. At 1220px
     the card ran off the right-hand edge of the pane.

     No window-centring shift here. .aisp-lock-inner translates its 440px
     card back by half the sidebar so it sits in the middle of the screen,
     which only works while there is room to spare; at this width it pushed
     the card under the sidebar instead. This one centres in the pane. */
  display: flex; width: min(960px, 100%); max-width: 100%;
  max-height: calc(100vh - 56px);
  padding: 0; gap: 0;
  background: #253858; border-radius: 22px; border: 1px solid #253858;
  box-shadow: 0 36px 90px -26px rgba(4, 12, 24, .72);
  text-align: left; overflow: auto;
}

/* ── The left pane: the product, drawn (founder's design, 2026-10-09) ──────── */

}

  box-shadow: 0 10px 30px -18px rgba(22,38,60,.35);

  border-bottom: 1px solid #E8EAF0;
}
.aisp-upd-logo {

  display: inline-flex; align-items: center; justify-content: center; overflow: hidden;
}
.aisp-upd-logo img { width: 26px; height: 26px; object-fit: contain; }
.aisp-upd-jt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.aisp-upd-jt-t { font-size: 14px; font-weight: 700; color: #16263C; }
.aisp-upd-jt-s { font-size: 12px; color: #6B778A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aisp-upd-applied {
