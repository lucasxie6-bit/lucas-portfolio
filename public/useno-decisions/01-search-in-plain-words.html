.aisp-panel-title { font-size: 13px; font-weight: 700; color: #14243C; letter-spacing: -.012em; }
.aisp-panel-meta { font-size: 11.5px; color: #93A0B2; font-weight: 500; }
.aisp-foot-note { font-size: 11.5px; color: #8695A8; line-height: 1.5; margin: 6px 2px 10px; }
.aisp-pchip-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid currentColor; opacity: .8; }
.aisp-loading { display: flex; flex-direction: column; gap: 10px; }
.aisp-load-msg { font-size: 12.5px; font-weight: 600; color: #6B7A8E; }
.aisp-hide-menu {
  grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
  margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(22,38,60,.08);
}
/* ── Conversation thread ──
   What you asked, echoed back above the reply. Your own utterances are
   right-aligned bubbles; the system's line is plain text, so the two are
   never confusable. */
.aisp-thread { display: flex; flex-direction: column; gap: 12px; }
.aisp-turn { display: flex; }
.aisp-turn.user { justify-content: flex-end; }
/* Roomier and rounder, with the Useno tell: a faint blue cast in the fill and
   edge, and navy rather than neutral text — so it reads as ours without being
   a coloured bubble. */
.aisp-bubble {
  max-width: 82%; padding: 12px 20px; border-radius: 22px;
  background: linear-gradient(180deg, #FFFFFF 0%, #FBFCFE 100%);
  border: 1px solid rgba(46,107,208,.16);
  box-shadow: 0 1px 2px rgba(16,38,74,.05), 0 4px 14px rgba(24,60,120,.045);
  font-size: 14px; font-weight: 500; color: #1B2E4A; line-height: 1.5;
  letter-spacing: -.005em; overflow-wrap: anywhere; text-align: left;
}
.aisp-turn.assistant { justify-content: flex-start; align-items: flex-start; gap: 10px; }
.aisp-assist { font-size: 13.5px; font-weight: 600; color: #1D3A63; line-height: 1.45; padding: 2px 2px 0; }
.aisp-mark {
  flex-shrink: 0; display: inline-flex; width: 20px; height: 20px; margin-top: 1px;
  border-radius: 6px; overflow: hidden;
  box-shadow: 0 1px 3px rgba(20,42,80,.22);
}
.aisp-mark svg { display: block; width: 100%; height: 100%; }



/* ── Job detail page (right pane) ── */
.aisp-detail { display: flex; flex-direction: column; gap: 22px; }
/* The sticky action bar pins against this, so the pane must not clip it. */
body.aisp-results-mode .aisp-panel-wrap { overflow-x: clip; }
/* A small round control, not a line of text. As "‹ Back to results" in
   650-weight it read as a heading competing with the job title directly below
   it; the label only appears on hover, and the chevron alone is unambiguous
   at the top-left of a detail view. */
.aisp-dback {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 0;
  font-family: inherit; font-size: 12px; font-weight: 600; color: #7C8899;
  background: #fff; border: 1px solid rgba(22,38,60,.13); border-radius: 999px;
  padding: 0; width: 30px; height: 30px; justify-content: center;
  margin-bottom: 14px; cursor: pointer; overflow: hidden;
  transition: width .18s ease, color .14s, border-color .14s, background .14s;
}
.aisp-dback svg { flex: 0 0 13px; }
.aisp-dback-label {
  max-width: 0; opacity: 0; white-space: nowrap;
  transition: max-width .18s ease, opacity .14s ease, margin-left .18s ease;
}
.aisp-dback:hover, .aisp-dback:focus-visible {
  width: 128px; color: #1B4E9B; border-color: rgba(46,107,208,.3); background: #F4F8FE;
}
.aisp-dback:hover .aisp-dback-label,
.aisp-dback:focus-visible .aisp-dback-label { max-width: 100px; opacity: 1; margin-left: 6px; }
@media (prefers-reduced-motion: reduce) {
  .aisp-dback, .aisp-dback-label { transition: none; }
}
.aisp-dback:focus-visible { outline: 2px solid #1F6CE1; outline-offset: 3px; border-radius: 5px; }

.aisp-dhead { display: grid; grid-template-columns: 52px 1fr; gap: 15px; align-items: start; }
/* Nudged so the mark optically centres on the title's cap height. */
.aisp-dlogo { margin-top: 1px; }
.aisp-dlogo {
  width: 52px; height: 52px; border-radius: 13px; overflow: hidden; flex-shrink: 0;
  background: #fff; font-weight: 800; font-size: 14px;
  display: flex; align-items: center; justify-content: center; border: 1px solid rgba(22,38,60,.09);
}
.aisp-dlogo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
.aisp-dcompany { display: flex; align-items: center; font-size: 13px; font-weight: 600; color: #6B7A8E; margin-top: 5px; }
.aisp-dtitle {
  font-size: 21px; font-weight: 700; color: #14243C; letter-spacing: -.022em;
  line-height: 1.22; margin-top: 0; overflow-wrap: anywhere;
}
/* Attributes, not buttons. Outlined pills at equal weight read as a row of
   controls; an icon plus a value reads as a fact about the job. */
.aisp-dfacts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin-top: 12px; }
.aisp-dfact {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600; color: #33455D;
  background: none; border: 0; border-radius: 0; padding: 0;
}
.aisp-dfact svg { width: 15px; height: 15px; flex-shrink: 0; color: #7C9BC4; }

/* Match panel — the engine's own numbers, not a re-scaled marketing score. */
/* ── Why this ranked ──
   Compact by design: a narrow card, the verdict once, and a short list of
   label -> value. Earlier versions encoded the same number three ways (a bar,
   a word and a percentage) across the full column width, which made a
   supporting panel the loudest object on the page. */
.aisp-dmatch {
  align-self: flex-start; width: min(380px, 100%);
  background: linear-gradient(160deg, #F2FAF6 0%, #F4F8FD 100%);
  border: 1px solid rgba(22,38,60,.09); border-radius: 16px;
  padding: 0; display: flex; flex-direction: column; gap: 0;
  box-shadow: 0 1px 2px rgba(16,38,74,.04);
}
.aisp-dmatch .aisp-dsec-h { display: none; }
.aisp-dmatch-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
  padding: 18px 20px 16px;
}
.aisp-dmatch-score {
  font-size: 30px; font-weight: 750; color: #10233E; letter-spacing: -.035em;
  line-height: 1; font-variant-numeric: tabular-nums;
}
.aisp-dmatch-score span { font-size: 15px; font-weight: 650; color: #8695A8; margin-left: 1px; }
.aisp-dmatch-band {
  font-size: 11.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
  color: #1F5FAF;
}
.aisp-dmatch-band.strong { color: #17764A; }
.aisp-dmatch-band.possible { color: #8A6512; }
.aisp-dmatch-band.weak { color: #6F6280; }

/* Inner sheet, so the rows read as the detail behind the headline figure. */
.aisp-sigrows {
  display: flex; flex-direction: column;
  background: #fff; border-radius: 13px; margin: 0 8px 8px;
  padding: 6px 14px; box-shadow: 0 1px 2px rgba(16,38,74,.05);
}
.aisp-sigrow {
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  padding: 9px 0;
}
.aisp-sigrow + .aisp-sigrow { border-top: 1px solid rgba(22,38,60,.05); }
.aisp-sigrow-k { font-size: 13px; font-weight: 500; color: #3B4B61; }
.aisp-sigrow-v {
  font-size: 15px; font-weight: 750; color: #10233E; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.aisp-sigrow-v span { font-size: 10.5px; font-weight: 650; color: #93A0B2; margin-left: 1px; }
/* A word, not a figure: the numeric treatment (tabular-nums, 15px/750) is
   tuned for percentages and reads as shouting on "Likely eligible". */
.aisp-sigrow-v.aisp-sigrow-word {
  font-size: 13px; font-weight: 600; letter-spacing: 0;
  font-variant-numeric: normal; text-align: right;
}
/* The step meter standing in for the headline score on a backend row. Sized
   to hold the left of the card the way the 30px figure does. */
.aisp-steps-lg { display: inline-flex; align-items: flex-end; gap: 3px; height: 29px; }
.aisp-steps-lg .aisp-step { width: 6px; border-radius: 2px; background: rgba(22,38,60,.14); }
.aisp-steps-lg.strong .aisp-step.on { background: #17764A; }
.aisp-steps-lg.good .aisp-step.on { background: #2E6BD0; }
.aisp-steps-lg.possible .aisp-step.on { background: #C08A1E; }
.aisp-steps-lg.weak .aisp-step.on { background: #8E82A0; }

.aisp-dmatch .aisp-analysis { border-top: 0; padding: 0 20px 14px; }

.aisp-dnote { font-size: 11.5px; color: #8695A8; line-height: 1.5; }

/* Early-applicant badge — a timing signal, not an applicant count. Same
   fact the card already shows one screen over as a quiet blue dot + text
   (.aisp-flags) with no fill or border. This used its own saturated green
   pill instead, so the identical signal read as two different, unrelated
   things depending which view you were in — and .aisp-dhead-main is a
   column flex container, whose default align-items:stretch expanded this
   inline-flex badge to the full width of the header regardless of its
   three words of content, which is what made it look wrong twice over. */
.aisp-dearly {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 7px;
  align-self: flex-start;
  font-size: 11px; font-weight: 650; letter-spacing: .005em; cursor: help;
  color: #2E6BD0;
}
.aisp-dearly svg { flex-shrink: 0; }

/* Full analysis — collapsed by default; the summary panel above is the
   short answer, this is the audit trail behind it. */
.aisp-analysis { border-top: 1px solid rgba(22,38,60,.08); padding-top: 12px; }
.aisp-analysis > summary {
  list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 600; color: #8695A8;
}
.aisp-analysis > summary:hover { color: #3D6A9E; }
.aisp-analysis > summary::-webkit-details-marker { display: none; }
.aisp-analysis > summary svg { transition: transform .15s; }
.aisp-analysis[open] > summary svg { transform: rotate(180deg); }
.aisp-analysis-body { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.aisp-anrow { display: flex; flex-direction: column; gap: 5px; }
.aisp-anrow-h {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  font-size: 12.5px; font-weight: 700; color: #24354C;
}
.aisp-anrow.unknown .aisp-anrow-h { color: #9AA6B6; font-weight: 600; }
.aisp-anrow-v { font-size: 12px; font-weight: 700; color: #46586F; font-variant-numeric: tabular-nums; }
.aisp-anrow.unknown .aisp-anrow-v { font-weight: 600; font-style: italic; color: #A6B0BF; }
.aisp-anrow-pts { font-size: 11px; font-weight: 600; color: #94A2B5; margin-left: 8px; }
.aisp-anrow-note { font-size: 11.5px; color: #8695A8; line-height: 1.5; }
.aisp-anev { display: flex; flex-wrap: wrap; gap: 5px; }
.aisp-anev-t {
  font-size: 10.5px; font-weight: 650; color: #2C5A94;
  background: #EDF4FC; border: 1px solid #D4E4F5; border-radius: 6px; padding: 2px 7px;
}
.aisp-anrow.penalty .aisp-anrow-h { color: #8A5A3B; }
.aisp-anpen {
  display: flex; justify-content: space-between; gap: 10px;
  font-size: 12px; font-weight: 600; color: #8A5A3B;
}

/* The verdict rides in the header — one line, at the end of the title row.
   It replaced a full-width panel of bars that used to sit between the header
   and the description; the bars still exist, in Fit detail near the bottom. */
/* ── Per-job utility actions ──
   Shape the ranking, share the posting, flag a problem. Quieter than the apply
   row above them. The svg sizing here is load-bearing: these icons carry no
   width/height attributes, so without it they render at their natural box and
   swamp the row. */
.aisp-dutil { display: flex; flex-wrap: wrap; gap: 4px; margin-top: -12px; }
.aisp-util {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: inherit; font-size: 12px; font-weight: 600; color: #6B7A8E;
  background: none; border: 1px solid transparent; border-radius: 9px;
  padding: 6px 10px; cursor: pointer; white-space: nowrap;
  transition: background .12s, color .12s, border-color .12s;
}
.aisp-util svg { width: 14px; height: 14px; flex: 0 0 14px; opacity: .85; }
.aisp-util:hover { background: #F2F6FC; color: #1B4E9B; border-color: rgba(46,107,208,.18); }
.aisp-util:focus-visible { outline: 2px solid #1F6CE1; outline-offset: 1px; }
.aisp-util[data-dislike]:hover { background: #FBF2F2; color: #96453F; border-color: rgba(150,69,63,.2); }

/* ── At a glance ──
   No card, no tinted strip, no divider. Three nested containers around four
   facts and three short lines was more structure than the content needed; the
   surrounding section rules already separate this from its neighbours. */
.aisp-glance { gap: 26px; }
.aisp-glance-facts {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 26px;
  padding: 0; background: none; border: 0;
}
.aisp-glance-facts .aisp-dfact { font-size: 13.5px; font-weight: 600; color: #33455D; }
.aisp-glance-facts .aisp-dfact svg { width: 16px; height: 16px; color: #5C8CC9; }
.aisp-why-wrap { padding: 0; display: flex; flex-direction: column; gap: 12px; }
.aisp-why-wrap .aisp-dsec-h {
  font-size: 10.5px; font-weight: 750; letter-spacing: .07em;
  text-transform: uppercase; color: #9AA7B9;
}

/* Reasons: normal-weight prose with a short rule marking each line. */
.aisp-why { display: flex; flex-direction: column; gap: 7px; margin: 0; padding: 0; list-style: none; }
.aisp-why li { font-size: 13.5px; font-weight: 450; color: #3B4B61; line-height: 1.5; }

/* ── Company section ──
   Boxed on purpose: it is about the employer, not this posting, so it should
   read as a distinct object rather than another run of the role's own copy. */
/* This block is about the EMPLOYER, not this posting, so it gets a real
   identity rather than a third faint grey card: a brand rail down the leading
   edge and a heading at section weight. */
.aisp-company {
  position: relative; gap: 26px; padding: 28px 30px; border-radius: 16px;
  border: 1px solid rgba(22,38,60,.12); background: #fff;
  box-shadow: 0 1px 2px rgba(16,38,74,.04); overflow: hidden;
}
.aisp-company .aisp-dsec-h { font-size: 15px; color: #14243C; }
.aisp-company .aisp-cname { font-size: 16px; }
/* The identity row gets room: a bigger mark, and the stats as separate blocks
   rather than a run-on line. Everything here was packed to card density in a
   section that is the width of the page. */
/* Identity on the left, company-level facts on the right — the two-column
   explainer shape. The right column carries only what the postings can prove;
   founded year, headcount, funding and leadership need a company-data
   provider and are absent rather than invented. */
.aisp-cgrid { display: grid; grid-template-columns: minmax(0,1fr) 250px; gap: 22px; align-items: start; }
.aisp-cmain { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.aisp-cside {
  display: flex; flex-direction: column; gap: 2px;
  background: #F7FAFD; border: 1px solid rgba(22,38,60,.08);
  border-radius: 13px; padding: 14px 16px;
}
.aisp-cside-row {
  display: flex; align-items: center; gap: 11px;
  font-size: 12.5px; font-weight: 550; color: #46586F;
  padding: 8px 0; text-decoration: none; min-width: 0;
}
.aisp-cside-row + .aisp-cside-row { border-top: 1px solid rgba(22,38,60,.06); }
.aisp-cside-row svg { width: 15px; height: 15px; flex-shrink: 0; color: #7C9BC4; }
.aisp-cside-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
a.aisp-cside-row:hover { color: #1B4E9B; }
a.aisp-cside-row:hover svg { color: #2E6BD0; }
@media (max-width: 820px) {
  .aisp-cgrid { grid-template-columns: 1fr; }
}

.aisp-cbar { display: flex; align-items: center; gap: 18px; }
.aisp-clogo {
  width: 60px; height: 60px; border-radius: 15px; overflow: hidden; flex-shrink: 0;
  background: #fff; font-weight: 800; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(22,38,60,.09); box-shadow: 0 2px 6px rgba(16,38,74,.09);
}
.aisp-clogo img { width: 100%; height: 100%; object-fit: contain; padding: 9px; }
.aisp-cbar-main { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.aisp-cname { font-size: 19px; font-weight: 700; color: #14243C; letter-spacing: -.02em; }
.aisp-cstats { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.aisp-cstat {
  font-size: 12.5px; font-weight: 550; color: #5B6B84; white-space: nowrap;
  background: #F5F8FC; border: 1px solid rgba(22,38,60,.07);
  border-radius: 9px; padding: 7px 12px;
}
.aisp-cstat strong { font-weight: 750; color: #2E6BD0; }

.aisp-cwhere { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.aisp-cwhere-l {
  font-size: 10.5px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase;
  color: #9AA7B9; margin-right: 6px; flex-shrink: 0;
}
.aisp-cchip {
  font-size: 12.5px; font-weight: 600; color: #4B5C73;
  background: #F4F7FB; border: 1px solid rgba(22,38,60,.08);
  border-radius: 9px; padding: 7px 13px;
}
.aisp-cchip.more { color: #93A0B2; }

/* ONE LIST, NOT A STACK OF PILLS. These rows were separate grey slabs with a
   floating heading above them, which read as several unrelated objects. They
   are one thing: the rest of what this employer has open. So they sit in a
   single outlined card, divided by hairlines, with the heading inside it.

   The title and the season/place stack, because they answer different
   questions and a student scanning for "Summer 2027" should find every one of
   them on the same column rather than at the end of a title of random length.
   The way in is a real control on the right, not a grey chevron. */
.aisp-coroles {
  display: flex; flex-direction: column;
  border: 1px solid #DFE5EE; border-radius: 14px; background: #fff; overflow: hidden;
}
.aisp-coroles-h {
  padding: 17px 22px; font-size: 15px; font-weight: 700;
  color: #16263C; letter-spacing: -.01em;
}
.aisp-corole {
  display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
  font-family: inherit; background: #fff; border: 0; border-top: 1px solid #E7ECF3;
  padding: 15px 22px; cursor: pointer; transition: background .12s;
}
.aisp-corole:hover { background: #FAFCFF; }
.aisp-corole:focus-visible { outline: 2px solid #1F6CE1; outline-offset: -2px; }
.aisp-corole-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.aisp-corole-title {
  font-size: 15.5px; font-weight: 700; color: #16263C; letter-spacing: -.01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.aisp-corole-meta {
  font-size: 13.5px; font-weight: 500; color: #8793A5;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.aisp-corole-go {
  flex: none; font-size: 13.5px; font-weight: 650; color: #16263C;
  background: #EAF0F9; border-radius: 10px; padding: 11px 19px;
  transition: background .12s;
}
.aisp-corole:hover .aisp-corole-go { background: #DEE7F5; }
.aisp-cmeta { font-size: 12.5px; color: #7D8CA0; }
.aisp-csite { color: #2E6BD0; font-weight: 600; text-decoration: none; }
.aisp-csite:hover { text-decoration: underline; }
.aisp-comore {
  display: block; width: 100%; font-family: inherit; text-align: center;
  background: #fff; border: 0; border-top: 1px solid #E7ECF3;
  padding: 15px 22px; font-size: 14px; font-weight: 700; color: #16263C;
  text-decoration: none; cursor: pointer; transition: background .12s;
}
.aisp-comore:hover { background: #FAFCFF; }
.aisp-comore:focus-visible { outline: 2px solid #1F6CE1; outline-offset: -2px; }
@media (max-width: 560px) {
  .aisp-corole { flex-wrap: wrap; }
  .aisp-corole-go { width: 100%; text-align: center; }
}
.aisp-cnote { font-size: 11.5px; line-height: 1.5; color: #97A3B4; margin: 14px 0 0; }
/* No panel round it: the heading and the rows are the whole section, and the
   rows already carry their own shape. */
.aisp-company {
  display: flex; flex-direction: column; gap: 12px;
  padding: 0; border: 0; background: none; box-shadow: none; border-radius: 0;
}
.aisp-company .aisp-jd-h, .aisp-company .aisp-jd-h2 { margin: 0; }

/* Application tools — inert placeholders, styled to look it. */
/* Locked-explanation notice — states the limit rather than hiding the section. */
.aisp-explock {
  display: flex; align-items: flex-start; gap: 9px;
  font-size: 12px; line-height: 1.55; color: #5A5175;
  background: #F7F5FE; border: 1px solid #E3DCFB; border-radius: 11px; padding: 11px 13px;
}
.aisp-explock svg { flex-shrink: 0; margin-top: 2px; color: #7A5AF8; }
.aisp-explock-cta {
  margin-left: auto; flex-shrink: 0; align-self: center;
  font-family: inherit; font-size: 11.5px; font-weight: 700; color: #fff;
  background: #7A5AF8; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer;
  transition: background .12s;
}
.aisp-explock-cta:hover { background: #6845E8; }

/* Beside the match card, filling the width it leaves. */
/* A panel of its own, keyed violet so it never reads as part of the match card
   beside it. */
/* ── Tools for this role: a grid of squares ──
   Two tiles side by side on a desktop, stacked on a phone. Each one is the
   whole square, so the target is the tile and not a small link inside it. */
.aisp-toolgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.aisp-tool {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  min-height: 168px; padding: 18px 18px 16px; text-align: left; cursor: pointer;
  border: 1px solid rgba(30,58,95,.12); border-radius: 14px; background: #fff;
  font: inherit; color: #16263C; text-decoration: none;
  transition: border-color .12s, box-shadow .12s, transform .12s;
}
.aisp-tool:hover { border-color: rgba(46,107,208,.45); box-shadow: 0 6px 18px -10px rgba(15,47,92,.3); }
.aisp-tool:focus-visible { outline: 2px solid #1F6CE1; outline-offset: 2px; }
.aisp-tool-ic {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 10px; margin-bottom: 4px;
  background: rgba(46,107,208,.1); color: #2E6BD0;
}
.aisp-tool-ic svg { width: 19px; height: 19px; }
.aisp-tool-title { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.aisp-tool-body { font-size: 12.5px; line-height: 1.5; color: #6B7688; }
.aisp-tool-cta {
  display: inline-flex; align-items: center; gap: 4px; margin-top: auto; padding-top: 10px;
  font-size: 13px; font-weight: 700; color: #2E6BD0;
}
.aisp-tool-cta svg { width: 13px; height: 13px; }
.aisp-tools { display: flex; flex-direction: column; gap: 12px; }
.aisp-tools .aisp-jd-h { margin: 0; }

/* ── The Easy Apply drawer: the employer's form over the results ── */
.aisp-applydrawer {
  position: fixed; inset: 0; z-index: 1000; display: flex; justify-content: flex-end;
  background: rgba(22,38,60,.32); animation: aisp-lock-in .18s ease-out;
}
body.aisp-drawer-open { overflow: hidden; }
.aisp-ad-panel {
  width: min(1040px, 100%); height: 100%; background: #fff;
  display: flex; flex-direction: column; box-shadow: -18px 0 50px -24px rgba(11,42,92,.5);
  animation: aisp-ea-in .22s ease-out;
}
.aisp-ad-bar {
  display: flex; align-items: center; gap: 14px; flex: none;
  padding: 12px 18px; border-bottom: 1px solid rgba(30,58,95,.1);
}
.aisp-ad-x {
  flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%;
  background: rgba(30,58,95,.06); color: #5D6E88; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.aisp-ad-x:hover { background: rgba(30,58,95,.12); color: #16263C; }
.aisp-ad-x svg { width: 14px; height: 14px; }
.aisp-ad-role { flex: 1 1 auto; min-width: 0; }
.aisp-ad-title { font-size: 14.5px; font-weight: 750; color: #16263C; overflow-wrap: anywhere; }
.aisp-ad-co { font-size: 12.5px; color: #7D8CA0; }
.aisp-ad-out { flex: none; font-size: 12.5px; font-weight: 650; color: #5D6E88; text-decoration: none; }
.aisp-ad-out:hover { color: #16263C; text-decoration: underline; }
/* With the frame drawing its own header, the panel is just a window onto it:
   no bar, no rounded gap above the content. */
.aisp-ad-panel.is-native .aisp-ad-frame { border-radius: 18px; }
.aisp-ad-frame { flex: 1 1 auto; width: 100%; border: 0; min-height: 0; }

/* ── Easy Apply setup: a panel down the right of the screen ──
   A drawer rather than a dialog in the middle: the student is mid-decision on
   a role, and the role should stay visible behind the instructions. Laid out
   from the project owner's own mockup, 2026-09-23: a navy card at the top,
   then one open step and the rest as quiet lines. */
.aisp-eadrawer {
  position: fixed; inset: 0; z-index: 1000; display: flex; justify-content: flex-end;
  padding: 14px; background: rgba(22,38,60,.28); animation: aisp-lock-in .18s ease-out;
}
/* 430px was narrow enough that "Add Useno Autofill to Chrome" wrapped onto two
   lines and every step's sentence broke mid-phrase, which made three short
   instructions read as a wall. Wider, with more room inside it. */
.aisp-ea-panel {
  position: relative; width: min(520px, 100%); max-height: 100%; overflow-y: auto;
  padding: 18px 18px 24px; background: #fff; border-radius: 20px;
  box-shadow: -18px 0 50px -24px rgba(11,42,92,.5);
  display: flex; flex-direction: column; gap: 14px;
  animation: aisp-ea-in .22s ease-out;
}
@keyframes aisp-ea-in { from { transform: translateX(28px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .aisp-eadrawer, .aisp-ea-panel { animation: none; } }

/* The navy card: mark, close, promise. */
.aisp-ea-hero {
  position: relative; overflow: hidden; padding: 22px 22px 24px; border-radius: 14px;
  background: #1E3A5F; color: #fff;
}
.aisp-ea-mark {
  display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px;
  border-radius: 12px; background: #fff; margin-bottom: 26px;
}
.aisp-ea-mark img { width: 22px; height: 22px; }
.aisp-ea-x {
  position: absolute; top: 20px; right: 20px; width: 34px; height: 34px; border: 0; border-radius: 50%;
  background: rgba(255,255,255,.14); color: #fff; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.aisp-ea-x:hover { background: rgba(255,255,255,.26); }
.aisp-ea-x svg { width: 14px; height: 14px; }
.aisp-ea-title { margin: 0; font-size: 25px; font-weight: 500; letter-spacing: -.02em; line-height: 1.2; color: #fff; }
.aisp-ea-title strong { font-weight: 800; }
.aisp-ea-body { margin: 8px 0 0; font-size: 14px; line-height: 1.55; color: rgba(255,255,255,.8); }

.aisp-ea-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }

/* The one step it is the student's turn to do. */
.aisp-ea-step {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px;
  border: 1px solid rgba(30,58,95,.14); border-radius: 14px; background: #fff;
}
.aisp-ea-step.is-open { align-items: flex-start; padding: 18px 18px 20px; border-color: rgba(30,58,95,.5); }
.aisp-ea-step.is-done { background: #F1F4F8; border-color: transparent; }
.aisp-ea-step.is-later { border-color: rgba(30,58,95,.1); }

.aisp-ea-num {
  flex: 0 0 34px; width: 34px; height: 34px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: #1E3A5F; color: #fff; font-size: 14px; font-weight: 800;
}
.aisp-ea-num svg { width: 15px; height: 15px; }
.aisp-ea-step.is-done .aisp-ea-num { background: #DCE6F2; color: #35507A; }
.aisp-ea-step.is-later .aisp-ea-num { background: #EEF1F5; color: #8A97A8; }

.aisp-ea-txt { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.aisp-ea-st { font-size: 15px; font-weight: 700; color: #16263C; }
.aisp-ea-step.is-done .aisp-ea-st, .aisp-ea-step.is-later .aisp-ea-st { font-weight: 600; color: #4A5A70; }
.aisp-ea-step.is-later .aisp-ea-st { color: #7D8CA0; }
.aisp-ea-sb { font-size: 13.5px; line-height: 1.5; color: #6B7688; }
.aisp-ea-cta {
  align-self: flex-start; margin-top: 12px; display: inline-flex; align-items: center;
  height: 42px; padding: 0 22px; border-radius: 999px;
  background: #1E3A5F; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none;
}
.aisp-ea-cta:hover { background: #16263C; }
.aisp-ea-view { margin-left: auto; flex: none; font-size: 13.5px; font-weight: 650; color: #2E6BD0; text-decoration: none; }
.aisp-ea-view:hover { text-decoration: underline; }

.aisp-ea-foot { margin-top: auto; padding-top: 14px; text-align: center; }
.aisp-ea-plain { font-size: 13.5px; font-weight: 600; color: #6B7688; text-decoration: none; }
.aisp-ea-plain:hover { color: #16263C; text-decoration: underline; }

/* Sections are separated by a rule, so the page reads as distinct blocks
   rather than one continuous column of text. */
.aisp-dsec {
  display: flex; flex-direction: column; gap: 10px;
  padding-top: 22px; border-top: 1px solid rgba(22,38,60,.09);
}
.aisp-dsec:first-of-type { border-top: 0; padding-top: 0; }
/* Declared after .aisp-dsec on purpose: this element carries both classes, and
   .aisp-dsec's `flex-direction: column` was overriding the row here on source
   order, stacking the tools under the match card instead of beside it. */
.aisp-dfooter {
  display: flex; flex-direction: row; flex-wrap: wrap;
  align-items: flex-start; gap: 24px;
}
/* Real headings. At 11px uppercase grey these were labels you skimmed past —
   "About this role" is the substance of the page and was quieter than the
   body text underneath it. */
.aisp-dsec-h {
  font-size: 15px; font-weight: 700; letter-spacing: -.014em; color: #14243C;
  text-transform: none;
}
/* No inner scrollbox. A scrolling region inside an already-scrolling pane
   traps the wheel and starts you mid-sentence with no sign there is text
   above; the description simply flows and the pane scrolls once. */
.aisp-ddesc {
  font-size: 14px; line-height: 1.75; color: #33445C; white-space: pre-wrap;
  overflow-wrap: anywhere;
}
/* "About this role" is the substance of the page — it gets its own surface so
   it stops reading as a run-on of the sections above it. */
.aisp-about {
  padding: 20px 22px; border-radius: 14px;
  border: 1px solid rgba(22,38,60,.1); background: #fff;
  box-shadow: 0 1px 2px rgba(16,38,74,.04);
}
.aisp-about .aisp-dsec-h { font-size: 16px; }
.aisp-dchips { display: flex; flex-wrap: wrap; gap: 6px; }
.aisp-dchips:empty { display: none; }
.aisp-dchip {
  font-size: 11px; font-weight: 600; color: #46586F;
  background: rgba(255,255,255,.9); border: 1px solid rgba(22,38,60,.1);
  border-radius: 999px; padding: 4px 10px;
}
/* ── Action bar ──
   Directly under the header AND sticky: job descriptions run thousands of
   words, and having to scroll back to the top (or to the bottom, where these
   used to live) to apply is the one interaction this page must never make you
   hunt for. It pins to the top of the scrolling pane so Apply is reachable
   from anywhere in the posting. */
.aisp-dactions {
  position: sticky; top: 0; z-index: 6;
  display: flex; flex-wrap: wrap; align-items: center; gap: 9px;
  padding: 12px 0 14px; margin-top: -4px;
  background: linear-gradient(180deg, #fff 72%, rgba(255,255,255,0) 100%);
}
.aisp-dactions .aisp-act { flex: 0 1 auto; }
/* Apply is the page's one primary action and is weighted like it. */
.aisp-dactions .aisp-act.primary {
  font-size: 13.5px; padding: 11px 20px; border-radius: 11px;
  background: #1B4E9B; border-color: #1B4E9B;
  box-shadow: 0 2px 6px rgba(20,52,105,.2), 0 8px 22px rgba(20,52,105,.16);
}
.aisp-dactions .aisp-act.primary:hover {
  background: #2E6BD0; border-color: #2E6BD0;
  box-shadow: 0 3px 8px rgba(20,52,105,.24), 0 12px 28px rgba(20,52,105,.2);
  transform: translateY(-1px);
}
.aisp-dactions .aisp-act.primary:active { transform: translateY(0); }
/* Secondary actions read as a matched pair beside it, not as more buttons. */
.aisp-dactions .aisp-act:not(.primary) {
  font-size: 13px; padding: 10px 16px; border-radius: 11px;
  color: #34506F; border-color: rgba(22,38,60,.16); background: #fff;
}
.aisp-dactions .aisp-act:not(.primary):hover {
  border-color: rgba(46,107,208,.42); background: #F4F8FE; color: #1B4E9B;
}
/* Buttons that carry an icon get it sized and spaced consistently. */
.aisp-dactions .aisp-act.icon-act { display: inline-flex; align-items: center; gap: 8px; }
.aisp-dactions .aisp-act.icon-act svg { width: 15px; height: 15px; flex-shrink: 0; }
/* Saved is a filled heart in Useno red-adjacent rose, not a green tick. */
.aisp-dactions .aisp-act.saved {
  color: #C2415F; border-color: rgba(194,65,95,.3); background: #FDF2F5;
}
.aisp-dactions .aisp-act.saved:hover {
  color: #A8324D; border-color: rgba(194,65,95,.45); background: #FCEAEF;
}
/* The outbound arrow on Apply nudges on hover. */
.aisp-dactions .aisp-act.primary { display: inline-flex; align-items: center; gap: 9px; }
.aisp-act-go { width: 14px; height: 14px; flex-shrink: 0; transition: transform .16s ease; }
.aisp-dactions .aisp-act.primary:hover .aisp-act-go { transform: translate(2px, -2px); }
@media (prefers-reduced-motion: reduce) {
  .aisp-dactions .aisp-act.primary:hover .aisp-act-go { transform: none; }
}
.aisp-dactions .aisp-act-icon {
  width: 38px; height: 38px; flex: 0 0 38px; border-radius: 11px;
  border-color: rgba(22,38,60,.16); margin-left: auto;
}
@media (prefers-reduced-motion: reduce) {
  .aisp-dactions .aisp-act.primary:hover { transform: none; }
}

/* ── Result list ──
   Rows, the same as the internship board: full width, no card edge, no
   rounding, no shadow. A hairline divides them, a faint tint marks hover,
   and a 2px left rule in brand blue marks the open row. */
#aisp-list { display: flex; flex-direction: column; gap: 0; }
.aisp-rcard {
  position: relative; overflow: hidden;
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: start;
  padding: 20px 20px 20px 34px; margin: 0; border-radius: 0;
  border: 0; border-left: 2px solid transparent; border-bottom: 1px solid rgba(30,58,95,.07);
  background: transparent; box-shadow: none;
  transition: background .1s, border-color .12s;
}
.aisp-rcard:hover { background: rgba(30,58,95,.025); }
.aisp-rcard.expanded { border-left-color: #2C5AA0; background: rgba(44,90,160,.045); }

/* The whole row opens the detail. */
/* Apply and Save sit under the card's text, in its own row of the grid, so
   they line up with the title rather than floating beside the age. They stay
   quiet until the row is hovered or something on it has focus. */
.aisp-rcard-acts {
  grid-column: 2 / -1; display: flex; align-items: center; gap: 8px; margin-top: 10px;
  transition: opacity .12s;
}
.aisp-rcard:hover .aisp-rcard-acts,
.aisp-rcard:focus-within .aisp-rcard-acts { opacity: 1; }
@media (hover: none) { .aisp-rcard-acts { opacity: 1; } }
.aisp-rcard-act {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 14px;
  border: 1px solid rgba(30,58,95,.16); border-radius: 999px; background: #fff; color: #16263C;
  font: inherit; font-size: 12.5px; font-weight: 650; text-decoration: none; cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.aisp-rcard-act:hover { background: #F1F6FD; border-color: rgba(31,95,184,.4); color: #1F5FAF; }
.aisp-rcard-act:focus-visible { outline: 2px solid #1F6CE1; outline-offset: 2px; }
.aisp-rcard-act svg { width: 12px; height: 12px; opacity: .8; }
/* Apply is the one thing on the row that is a decision, so it carries the
   colour; Save sits beside it as an outline. */
.aisp-rcard-act.is-apply { background: #2E6BD0; border-color: #2E6BD0; color: #fff; font-weight: 700; padding: 0 18px; }
.aisp-rcard-act.is-apply:hover { background: #1F5FAF; border-color: #1F5FAF; color: #fff; }
.aisp-rcard-act.saved { color: #1F5FAF; border-color: rgba(31,95,184,.4); }

.aisp-rcard-toggle {
  grid-column: 2 / -1;
  display: flex; align-items: stretch; gap: 14px; width: 100%; text-align: left;
  background: none; border: none; padding: 0; margin: 0; cursor: pointer; font: inherit; color: inherit;
}
.aisp-rcard-toggle:focus-visible { outline: 2px solid #2C5AA0; outline-offset: 4px; border-radius: 0; }
.aisp-rcard-head { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0; justify-content: center; }
/* "Company · City", the line a student reads after the title. */
.aisp-rcard-line {
  display: block; font-size: 13px; font-weight: 500; color: #4A5B70;
  letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* One quiet line of facts: pay or type first, then work mode and term. */
.aisp-rcard-facts {
  display: flex; flex-wrap: nowrap; margin-top: 4px; min-width: 0;
  white-space: nowrap; overflow: hidden;
}
.aisp-rcard-fact { font-size: 12px; font-weight: 500; color: #8A97A8; flex-shrink: 0; }
.aisp-rcard-fact:first-child:not(:last-child) { color: #4A5B70; font-weight: 600; }
.aisp-rcard-fact + .aisp-rcard-fact::before { content: '\00B7'; margin: 0 6px; color: #8A97A8; font-weight: 500; }
.aisp-rcard-fact:last-child { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
/* The age is a corner stamp, top right. */
.aisp-rcard-age {
  position: absolute; top: 22px; right: 22px; margin: 0;
  font-size: 10.5px; font-weight: 500; color: #A3AEBC; line-height: 1;
}

/* Entitlement-locked results (Free's results 4-10): no job data was ever
   sent for these, so this renders purely from a count — a generic card
   shape with placeholder bars, never real text, blurred to read as
   "something is here" rather than "loading". */
/* A plain heading line over the count, not a tinted box. */
.aisp-lock-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 20px 0 36px; margin: 0 0 3px; border-radius: 0;
  background: none; border: 0;
}
.aisp-lock-banner-title { font-size: 15px; font-weight: 650; color: #16263C; letter-spacing: -.01em; }
.aisp-lock-banner-cta {
  flex: 0 0 auto; padding: 8px 16px; border-radius: 10px; border: none; cursor: pointer;
  background: #16263C; color: #fff;
  /* font-family, NOT the `font` shorthand. `font: inherit` sat at the end of
     this rule and silently reset the two declarations before it — a shorthand
     resets every longhand it covers, including the size and weight set on the
     line above. The button therefore rendered at the inherited size in the
     inherited face rather than at 12.5px/650, which is why it looked like a
     different typeface from everything around it. Only the family is meant to
     be inherited here. */
  font-family: inherit; font-weight: 650; font-size: 12.5px;
}
.aisp-lock-banner-cta:hover { background: #223a5c; }
/* The locked SUMMARY — one row stating a count, never a stand-in for a card.
   There is deliberately no blur/skeleton style here: nothing is obscured,
   because nothing about those roles was sent to this browser. */
.aisp-lock-summary {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 22px 20px; margin-top: 0; border-radius: 0;
  border: 0; border-bottom: 1px solid rgba(30,58,95,.07); background: transparent;
}
.aisp-lock-summary-count { font-size: 14px; font-weight: 700; color: #16263C; }
.aisp-dot {
  width: 2.5px; height: 2.5px; border-radius: 50%; background: currentColor;
  margin: 0 7px; opacity: .55; flex-shrink: 0;
}
.aisp-rcard-chevron {
  flex-shrink: 0; display: inline-flex; color: #B3BECD; transition: transform .15s, color .15s;
}
.aisp-rcard:hover .aisp-rcard-chevron { color: #6E819B; }
.aisp-rcard.expanded .aisp-rcard-chevron { transform: rotate(180deg); color: #3D6A9E; }
.aisp-rcard-logo {
  width: 40px; height: 40px; border-radius: 10px; margin-top: 0;
  box-shadow: none; overflow: hidden; flex-shrink: 0;
  background: #fff; font-weight: 700; font-size: 12.5px;
  display: flex; align-items: center; justify-content: center; border: 1px solid #E4E6EA;
}
.aisp-rcard-logo img { width: 100%; height: 100%; object-fit: contain; padding: 5px; }
/* Deterministic initials avatar — used both as the only mark (no logo URL)
   and as the hidden fallback swapped in when a real logo 404s, so a company
   always renders the same way whichever path it took. */
.aisp-avatar { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: inherit; font-size: inherit; }
.aisp-rcard-body { min-width: 0; }
/* The title is the only thing most students read, so it gets real size and a
   proper optical setting: tighter tracking at this weight, and two lines
   allowed before it truncates rather than clipping mid-phrase on card one. */
.aisp-rcard-title {
  font-size: 14.5px; font-weight: 650; color: #16263C; letter-spacing: -.01em; line-height: 1.3;
  margin: 0 0 3px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; white-space: normal;
}
.aisp-rcard.expanded .aisp-rcard-title { white-space: normal; overflow-wrap: anywhere; }
.aisp-rcard-sub { font-size: 12.5px; color: #7A8698; margin-top: 2px; overflow-wrap: anywhere; }
.aisp-rcard-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 9px; }


/* Fit meter — deliberately quiet.
   A saturated green bar with a bold number beside it made the score look like
   a verdict on the role, when it is one ranking signal computed from a partial
   profile. The band name now leads on the card (as a tag), and this shrinks to
   a small neutral readout: thin track, muted tint, grey number. It is still
   exact and still sorted on — it just stops shouting. */
.aisp-fitbar { display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0; cursor: default; }
.aisp-fitbar-track {
  width: 34px; height: 3px; border-radius: 999px; overflow: hidden;
  background: rgba(22,38,60,.08); flex-shrink: 0;
}
.aisp-fitbar-fill { display: block; height: 100%; border-radius: 999px; background: currentColor; opacity: .45; }
.aisp-fitbar-num {
  font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
  min-width: 18px; text-align: right; color: #93A0B2;
}
.aisp-fitbar.strong   { color: #3E8FD6; }
.aisp-fitbar.good     { color: #6BA3DC; }
.aisp-fitbar.possible { color: #9FB6CE; }
.aisp-fitbar.weak     { color: #B6BECB; }
.aisp-rtag {
  font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 2.5px 8px; border-radius: 5px; border: 1px solid rgba(22,38,60,.13); color: rgba(22,38,60,.5);
}
.aisp-rtag.pay { color: #2F6B4C; border-color: #C6E2D2; }
.aisp-rcard-reasons { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.aisp-rcard-reasons li { font-size: 12.5px; color: #46586F; line-height: 1.4; padding-left: 16px; position: relative; overflow-wrap: anywhere; }
.aisp-rcard-reasons li::before { content: ''; position: absolute; left: 3px; top: 7px; width: 5px; height: 5px; border-radius: 50%; background: #7FB0E8; }
.aisp-rcard-cautions { margin: 7px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
.aisp-rcard-cautions li { font-size: 12px; color: #8B7947; line-height: 1.4; padding-left: 16px; position: relative; overflow-wrap: anywhere; }
.aisp-rcard-cautions li::before { content: '!'; position: absolute; left: 5px; top: -1px; font-weight: 800; color: #C9A24B; }

/* Score details — collapsible, for trust and for debugging */
.aisp-scored { margin-top: 9px; }
.aisp-scored > summary {
  list-style: none; cursor: pointer; font-size: 11.5px; font-weight: 700; color: #7A8698;
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 0;
}
.aisp-scored > summary::-webkit-details-marker { display: none; }
.aisp-scored > summary:hover { color: #3D6A9E; }
.aisp-scored > summary:focus-visible { outline: 2px solid #1F6CE1; outline-offset: 2px; border-radius: 4px; }
.aisp-scoretbl { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 11.5px; }
.aisp-scoretbl th, .aisp-scoretbl td { text-align: left; padding: 4px 8px 4px 0; color: #55637A; font-weight: 600; }
.aisp-scoretbl th { color: #94A2B5; font-weight: 750; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; }
.aisp-scoretbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
.aisp-scoretbl tr.unknown td { color: #A6B0BF; font-style: italic; }
.aisp-scorewrap { overflow-x: auto; }

.aisp-rcard-details { margin-top: 8px; }
.aisp-rcard-actions { display: flex; flex-direction: row; flex-wrap: wrap; align-items: stretch; gap: 7px; margin-top: 12px; }
.aisp-rcard-actions .aisp-act { flex: 1 1 auto; min-width: 96px; }
.aisp-rcard-actions .aisp-act-row { flex: 1 1 100%; }
.aisp-act {
  font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; text-align: center;
  padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(61,106,158,.28); color: #3D6A9E;
  background: #fff; text-decoration: none; white-space: nowrap; transition: background .12s, border-color .12s, color .12s;
}
.aisp-act:hover { background: #E8F1FA; border-color: #3D6A9E; }
.aisp-act.primary { background: #071A35; border-color: #071A35; color: #fff; }
.aisp-act.primary:hover { background: #125ECF; border-color: #125ECF; }
.aisp-act.saved { background: #E7F5EC; border-color: #BEE3CB; color: #146C43; }
.aisp-act[aria-disabled="true"] { opacity: .5; cursor: default; }
.aisp-act-row { display: flex; gap: 7px; }
.aisp-act-row .aisp-act { flex: 1; padding-left: 6px; padding-right: 6px; }
.aisp-act-icon {
  width: 32px; height: 32px; flex: 0 0 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 9px; border: 1px solid rgba(61,106,158,.28); color: #55637A; background: #fff; cursor: pointer; transition: background .12s, color .12s;
}
.aisp-act-icon:hover { background: #F0F5FC; color: #1F5FAF; }
.aisp-act:focus-visible, .aisp-act-icon:focus-visible, .aisp-newsearch:focus-visible,
.aisp-refine-chip:focus-visible, .aisp-chip:focus-visible,
.aisp-more:focus-visible {
  outline: 2px solid #1F6CE1; outline-offset: 2px;
}

/* Progressive loading */
/* A plain full-width row under the list, not a rounded button. */
.aisp-more {
  display: block; width: 100%; margin: 0; padding: 14px 16px;
  font-family: inherit; font-size: 13px; font-weight: 600; color: #2C5AA0;
  background: transparent; border: 0; border-bottom: 1px solid rgba(30,58,95,.07); border-radius: 0; cursor: pointer;
  transition: background .1s;
}
.aisp-more:hover { background: rgba(30,58,95,.025); }

/* ── Refinement input + quick actions ── */
/* Sits right below the chips, above the results — refining shouldn't require
   scrolling past a page of cards first. */
.aisp-refine { margin: 0 0 14px; border: 1px solid rgba(22,38,60,.1); border-radius: 12px; background: #FAFCFE; }
.aisp-refine > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 7px;
  font-size: 12.5px; font-weight: 700; color: #46586F; padding: 10px 14px;
}
.aisp-refine > summary::-webkit-details-marker { display: none; }
.aisp-refine > summary:focus-visible { outline: 2px solid #1F6CE1; outline-offset: -2px; border-radius: 12px; }
.aisp-refine > summary svg { transition: transform .15s; }
.aisp-refine[open] > summary { border-bottom: 1px solid rgba(22,38,60,.08); }
.aisp-refine[open] > summary svg { transform: rotate(180deg); }
.aisp-refine-body { padding: 4px 14px 14px; }
.aisp-refine-bar {
  display: flex; align-items: center; gap: 10px;
  background: #F6F9FD; border: 1px solid rgba(6,31,71,.12); border-radius: 14px; padding: 10px 12px;
  transition: border-color .15s, box-shadow .15s;
}
.aisp-refine-bar:focus-within { border-color: rgba(25,102,224,.5); box-shadow: 0 0 0 3px rgba(42,118,235,.12); }
.aisp-refine-ic { color: #1F6CE1; flex-shrink: 0; }
.aisp-refine-input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; color: #10233E; }
.aisp-refine-input::placeholder { color: #8795A9; }
.aisp-refine-send {
  width: 32px; height: 32px; flex-shrink: 0; border: 0; border-radius: 9px; background: #071A35; color: #fff;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: background .12s;
}
.aisp-refine-send:hover { background: #125ECF; }
.aisp-refine-send:disabled { background: #CED6E1; cursor: default; }
.aisp-refine-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
.aisp-refine-chip {
  font-family: inherit; font-size: 12px; font-weight: 600; color: #46586F;
  background: #fff; border: 1px solid #DDE7F3; border-radius: 999px; padding: 6px 13px; cursor: pointer; transition: background .12s, border-color .12s;
}

<script>

const STAGE_W = 680, STAGE_H = 510, CW = 632, CH = 462;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const card = document.getElementById('card');
function fit() { const s = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H); document.getElementById('stage').style.transform = 'translate(-50%,-50%) scale(' + s + ')'; }
addEventListener('resize', fit); fit();

async function makeWorld(id, w, h) {
  const f = document.createElement('iframe');
  f.style.width = w + 'px'; f.style.height = h + 'px';
  f.srcdoc = document.getElementById(id).textContent;
  card.appendChild(f);
  await new Promise(r => f.onload = r);
  const d = f.contentDocument;
  await Promise.race([d.fonts.ready, sleep(2500)]);
  await Promise.all([...d.images].map(i => i.decode().catch(() => {})));
  f.cam = {x: 0, y: 0, s: 1};
  return f;
}
function rectOf(f, el) { if (typeof el === 'string') el = f.contentDocument.querySelector(el); const r = el.getBoundingClientRect(); return {x: r.left, y: r.top, w: r.width, h: r.height}; }
function union(...rs) { const x = Math.min(...rs.map(r => r.x)), y = Math.min(...rs.map(r => r.y)); return {x, y, w: Math.max(...rs.map(r => r.x + r.w)) - x, h: Math.max(...rs.map(r => r.y + r.h)) - y}; }
/* Frames a rectangle of the page in the card: centred, with padding, never above maxScale. */
function frame(f, r, o = {}) {
  const pad = o.pad ?? 28, max = o.max ?? 1.6;
  const s = Math.min((CW - pad * 2) / r.w, (CH - pad * 2) / r.h, max);
  let x = CW / 2 - (r.x + r.w / 2) * s, y = o.top ? pad - r.y * s : CH / 2 - (r.y + r.h / 2) * s;
  f.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
  f.cam = {x, y, s};
}
/* A list, cropped just inside the gap beside it so no sliver of the next column shows. */
const inset = r => ({x: r.x + 2, y: r.y - 14, w: r.w - 4, h: r.h + 14});
function instant(f, fn) { f.style.transition = 'none'; fn(); void f.offsetWidth; f.style.transition = ''; }

/* A pointer drawn inside the page, so it moves with the camera. */
function cursor(f) {
  const d = f.contentDocument, c = d.createElement('div');
  c.innerHTML = '<svg width="20" height="22" viewBox="0 0 20 22" fill="none"><path d="M3 2l13.5 9.2-6.2 1.3 3.4 6.7-2.6 1.3-3.4-6.8L3 18.4z" fill="#16263C" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  c.style.cssText = 'position:fixed;left:0;top:0;z-index:99999;pointer-events:none;transition:left .75s cubic-bezier(.65,0,.35,1),top .75s cubic-bezier(.65,0,.35,1),transform .15s ease,opacity .3s;opacity:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))';
  d.body.appendChild(c);
  return {
    async to(el, dx = 0.5, dy = 0.5) { const r = rectOf(f, el); c.style.opacity = 1; c.style.left = (r.x + r.w * dx) + 'px'; c.style.top = (r.y + r.h * dy) + 'px'; await sleep(800); },
    async click() { c.style.transform = 'scale(.82)'; await sleep(140); c.style.transform = ''; await sleep(160); },
    hide() { c.style.opacity = 0; },
    place(el, dx = 0.5, dy = 0.5) { const r = rectOf(f, el); c.style.transition = 'none'; c.style.left = (r.x + r.w * dx) + 'px'; c.style.top = (r.y + r.h * dy) + 'px'; void c.offsetWidth; c.style.transition = ''; }
  };
}
/* Hover states come from the page's own :hover rules, copied onto a class. */
function hoverable(f) {
  const d = f.contentDocument, extra = [];
  for (const sh of d.styleSheets) { let rules; try { rules = sh.cssRules; } catch (e) { continue; } for (const r of rules) if (r.selectorText && r.selectorText.includes(':hover')) extra.push(r.cssText.replace(/:hover/g, '.is-hover')); }
  const st = d.createElement('style'); st.textContent = extra.join('\n'); d.head.appendChild(st);
}
async function loop(play) { for (;;) { card.classList.remove('fade'); await play(); card.classList.add('fade'); await sleep(600); card.innerHTML = ''; } }


const QUERY = 'Software internships in New York for the class of 2027';
loop(async () => {
  const a = await makeWorld('w-landing', 1100, 760);
  const d = a.contentDocument, bar = d.querySelector('.aisp-bar'), input = d.getElementById('aisp-input'), submit = d.getElementById('aisp-submit');
  instant(a, () => frame(a, union(rectOf(a, '.aisp-headline'), rectOf(a, bar)), {pad: 40, max: 1.05}));
  await sleep(700);
  input.focus({ preventScroll: true });
  for (let i = 1; i <= QUERY.length; i++) { input.value = QUERY.slice(0, i); if (i === 1) submit.removeAttribute('disabled'); await sleep(36 + (QUERY[i - 1] === ' ' ? 40 : 0)); }
  await sleep(450);
  const cur = cursor(a); cur.place(submit, .5, 3.2); await cur.to(submit); await cur.click();
  const b = await makeWorld('w-results', 1440, 900);
  b.style.opacity = 0; const list = b.contentDocument.getElementById('aisp-list');
  [...list.children].forEach(c => { c.style.cssText = 'opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .7s cubic-bezier(.16,1,.3,1)'; });
  instant(b, () => frame(b, inset(rectOf(b, '#aisp-list')), {pad: 12, max: 1, top: true}));
  a.style.opacity = 0; b.style.opacity = 1; await sleep(450);
  for (const c of list.children) { c.style.opacity = 1; c.style.transform = 'none'; await sleep(160); }
  await sleep(3200);
});

</script>
