.hs-detail-header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 24px; padding-right: 110px; }
.hs-detail-logo { width: 56px; height: 56px; border-radius: 14px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.hs-detail-hd { min-width: 0; }
.hs-detail-co-meta { font-size: 13px; color: #8C877A; margin-bottom: 5px; }
.hs-detail-title { font-size: clamp(22px, 2.6vw, 34px); font-weight: 800; color: #16263C; letter-spacing: -.025em; line-height: 1.1; margin: 0; }
.hs-detail-dates {
  display: flex; flex-wrap: wrap; gap: 8px 18px;
  margin-top: 10px;
}
.hs-detail-date {
  display: inline-flex; align-items: baseline; gap: 6px;
  font-size: 12.5px;
}
.hs-detail-date-lbl {
  font-size: 10px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: #A19C8C;
}
.hs-detail-date-val { color: #5A5248; font-weight: 500; }
.hs-detail-date.deadline-soon .hs-detail-date-val { color: #3D6A9E; font-weight: 600; }
.hs-detail-date.deadline-closed .hs-detail-date-val { color: #9A958A; }

.hs-fit-badge {
  position: absolute; top: 26px; right: 28px;
  text-align: center; border: 1.5px solid #3D6A9E; border-radius: 10px; padding: 10px 14px;
}
.hs-fit-pct { font-size: 20px; font-weight: 800; color: #3D6A9E; letter-spacing: -0.02em; line-height: 1; }
.hs-fit-tag { font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #3D6A9E; margin-top: 2px; }

.hs-detail-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
.hs-btn {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 14px; font-weight: 600; padding: 9px 18px;
  border-radius: 9px; cursor: pointer; transition: background .12s, border-color .12s;
  border: 1.5px solid rgba(28,43,58,.18); background: transparent; color: #1C2B3A;
  font-family: inherit; text-decoration: none; white-space: nowrap;
}
.hs-btn:hover { background: rgba(28,43,58,.05); }
.hs-btn svg { opacity: .75; flex-shrink: 0; }
.hs-btn-apply { background: #16263C; color: #fff; border-color: #16263C; padding: 9px 24px; }
.hs-btn-apply:hover { background: #25364C; }
.hs-share-wrap { position: relative; }
.hs-share-dropdown {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 50;
  background: #fff; border: 1px solid rgba(28,43,58,0.12); border-radius: 10px;
  box-shadow: 0 8px 24px rgba(28,43,58,.16); padding: 6px; min-width: 190px;
}
.hs-share-dropdown.open { display: block; }
.hs-share-opt {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 7px 10px;
  font-size: 13px; font-weight: 500; color: #4A637A; border-radius: 7px;
  cursor: pointer; border: none; background: none; font-family: inherit;
  transition: background .1s;
}
.hs-share-opt:hover { background: rgba(28,43,58,0.06); }
.hs-share-opt svg { flex-shrink: 0; color: #8A9BB0; opacity: 1; }

/* 3-col at a glance */
.hs-glance-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; margin-bottom: 24px; }
.hs-glance-box { background: #FFFFFF; border: 1px solid rgba(28,43,58,.14); border-radius: 10px; padding: 11px 13px; }
.hs-glance-lbl { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #9A958A; margin-bottom: 5px; }
.hs-glance-val { font-size: 14px; font-weight: 700; color: #16263C; overflow-wrap: anywhere; }

/* Why you match */
.hs-why-lbl { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #3D6A9E; margin-bottom: 11px; }
.hs-why-item { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: #3D4A54; margin-bottom: 9px; line-height: 1.35; }
.hs-why-check { flex-shrink: 0; color: #3D6A9E; }
.hs-why-circle { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #E4E6EA; flex-shrink: 0; }

.hs-match-section {
  background: #FFFFFF; border: 1px solid #E4E6EA; border-radius: 14px;
  padding: 16px 18px; margin: 18px 0 20px;
}
.hs-match-title {
  font-family: 'Plus Jakarta Sans', var(--sidebar-f), system-ui, sans-serif;
  font-size: 15px; font-weight: 800; color: #16263C; margin-bottom: 10px;
}
.hs-match-list { display: flex; flex-wrap: wrap; gap: 8px; }
.hs-match-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600;
  color: #3A4751; background: #FFFFFF;
  border: 1px solid #E4E6EA; border-radius: 999px;
  padding: 5px 10px;
}
.hs-match-pill::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: #B0533A; flex-shrink: 0;
}

/* Student-fit chips (card) */
.hs-fitchips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.hs-fitchip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 650; line-height: 1;
  border-radius: 6px; padding: 4px 7px; white-space: nowrap;
  border: 1px solid transparent;
}
.hs-fitchip.confirmed { color: #256B4A; background: #EAF3ED; border-color: #CBE3D5; }
.hs-fitchip.likely    { color: #8A5E1B; background: #FFFFFF; border-color: #E7D8BA; }
.hs-fitchip.term      { color: #2C3E50; background: #EEF1F5; border-color: #D5DEE7; }
.hs-fitchip.plus      { color: #3D4A54; background: rgba(28,43,58,.055); border-color: rgba(28,43,58,.1); }
.hs-fitchip.warn      { color: #9A4128; background: #FFFFFF; border-color: #E4E6EA; }
.hs-fitchip svg { flex-shrink: 0; }

/* Eligibility at a glance (detail) */
.hs-elig-section { margin: 22px 0; padding-top: 20px; border-top: 1px solid rgba(28,43,58,.08); }
.hs-elig-title { font-size: 17px; font-weight: 800; color: #16263C; letter-spacing: -.02em; margin-bottom: 3px; }
.hs-elig-sub { font-size: 13px; color: #9A958A; margin-bottom: 16px; }
.hs-elig-row { display: flex; align-items: flex-start; gap: 11px; margin-bottom: 13px; }
.hs-elig-ic {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
}
.hs-elig-ic.confirmed { color: #256B4A; background: #E4F1E9; }
.hs-elig-ic.likely    { color: #6E6858; background: #F5F6F8; border: 1px solid #E4E6EA; }
.hs-elig-ic.warn      { color: #9A4128; background: #FFFFFF; border: 1px solid #E4E6EA; }
.hs-elig-empty { font-size: 13.5px; color: #6E6858; line-height: 1.5; margin-top: 8px; }
.hs-elig-body { flex: 1; min-width: 0; }
.hs-elig-main { font-size: 14px; font-weight: 650; color: #223140; line-height: 1.3; }
.hs-elig-main .lk { font-weight: 650; color: #8A5E1B; }
.hs-elig-note { font-size: 12.5px; color: #857F71; line-height: 1.4; margin-top: 2px; }

/* Job details section */
.hs-jd-section { margin: 12px 0 0; padding-top: 14px; border-top: 1px solid rgba(28,43,58,.08); }
.hs-jd-title { font-size: 17px; font-weight: 800; color: #16263C; letter-spacing: -.02em; margin-bottom: 14px; }
.hs-jd-sub { font-size: 13px; color: #9A958A; margin-bottom: 18px; }
.hs-jd-group { margin-bottom: 16px; }
.hs-jd-group:last-child { margin-bottom: 0; }
.hs-jd-icon { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #6E6858; }
.hs-jd-group-body { flex: 1; min-width: 0; }
.hs-jd-group-label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #16263C; margin-bottom: 8px; letter-spacing: -.01em; }
.hs-jd-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hs-jd-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; color: #3D4A54; background: rgba(28,43,58,.06); border: 1px solid rgba(28,43,58,.1); border-radius: 8px; padding: 6px 12px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
/* The class selector outranks the browser's own [hidden] rule, so a hidden
   chip needs saying twice or it stays on screen. */
.hs-jd-chip[hidden] { display: none; }
.hs-jd-more { cursor: pointer; font-weight: 700; color: #16263C; font-family: inherit; }
.hs-jd-more:hover { background: rgba(28,43,58,.11); }

/* About the employer */
.hs-employer-section { margin: 22px 0; padding-top: 20px; border-top: 1px solid rgba(28,43,58,.08); }
.hs-employer-title { font-size: 17px; font-weight: 800; color: #16263C; letter-spacing: -.02em; margin-bottom: 14px; }
.hs-employer-row { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.hs-employer-logo { width: 52px; height: 52px; border-radius: 12px; overflow: hidden; flex-shrink: 0; }
.hs-employer-info { flex: 1; min-width: 0; }
.hs-employer-name { font-size: 15px; font-weight: 700; color: #16263C; letter-spacing: -.01em; }
.hs-employer-industry { font-size: 13px; color: #8C877A; margin-top: 2px; }
.hs-employer-follow { flex-shrink: 0; font-size: 13px; font-weight: 600; color: #16263C; background: transparent; border: 1.5px solid rgba(28,43,58,.2); border-radius: 8px; padding: 6px 16px; cursor: pointer; font-family: inherit; transition: background .12s, border-color .12s; }
.hs-employer-follow:hover { background: rgba(28,43,58,.05); border-color: rgba(28,43,58,.35); }
.hs-employer-desc { font-size: 13.5px; color: #59636C; line-height: 1.65; margin-bottom: 10px; }
.hs-employer-link { font-size: 13px; font-weight: 600; color: #3D6A9E; text-decoration: none; }
.hs-employer-link:hover { text-decoration: underline; }


/* Description */
.hs-desc-lbl { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #9A958A; margin: 22px 0 10px; }
.hs-desc { font-size: 14px; color: #59636C; line-height: 1.7; }
.hs-desc.collapsed { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.hs-desc-h { font-size: 14px; font-weight: 700; color: #16263C; margin: 16px 0 6px; }
.hs-desc-h:first-child { margin-top: 0; }
.hs-desc-p { margin: 0 0 12px; }
.hs-desc-p:last-child { margin-bottom: 0; }
.hs-desc-list { margin: 0 0 12px; padding-left: 20px; }
.hs-desc-list li { margin-bottom: 6px; }
.hs-desc-list li:last-child { margin-bottom: 0; }
.hs-more-btn { font-size: 13.5px; font-weight: 600; color: #16263C; margin-top: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; background: none; border: none; font-family: inherit; padding: 0; }
.hs-more-btn:hover { text-decoration: underline; }

/* Filter sidebar */
.filter-backdrop { display:none; position:fixed; inset:0; background:rgba(28,43,58,0.18); z-index:290; }
.filter-backdrop.open { display:block; }
.filter-sidebar { position:fixed; top:0; right:0; bottom:0; width:min(560px, calc(100vw - 40px)); background:#FFFFFF; box-shadow:-8px 0 36px rgba(28,43,58,0.14); z-index:300; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .22s cubic-bezier(.4,0,.2,1); }
.filter-sidebar.open { transform:translateX(0); }
/* Closed, the panel sits just off the right edge; its shadow must not. */
.filter-sidebar:not(.open) { box-shadow: none; visibility: hidden; transition: transform .22s cubic-bezier(.4,0,.2,1), visibility 0s .22s; }
.filter-sidebar-head { display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid #ECEDF0; flex-shrink:0; }
.filter-sidebar-title { font-size:17px; font-weight:800; color:#16263C; letter-spacing:-.01em; }
.filter-close-btn { width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer; color:#8C877A; transition:background .1s; border:1px solid #E4E6EA; background:transparent; padding:0; font:inherit; }
.filter-close-btn:focus-visible { outline: 2px solid rgba(22,38,60,.35); outline-offset: 2px; }
.filter-close-btn:hover { background:#F5F6F8; }
.filter-body { flex:1; overflow-y:auto; }
.filter-section { border-bottom:1px solid #ECEDF0; }
.filter-section-head { display:flex; align-items:center; justify-content:space-between; padding:14px 22px; cursor:pointer; user-select:none; }
.filter-section-head:hover { background:#F5F6F8; }
.filter-section-label { font-size:13.5px; font-weight:700; color:#16263C; letter-spacing:-.005em; }
.filter-chevron { color:#8C877A; transition:transform .15s; }
.filter-section.collapsed .filter-chevron { transform:rotate(-90deg); }
.filter-section-body { padding:0 22px 16px; display:flex; flex-direction:column; gap:2px; }
.filter-section.collapsed .filter-section-body { display:none; }
.filter-check-row { display:flex; align-items:flex-start; gap:10px; padding:7px 8px; border-radius:7px; cursor:pointer; transition:background .08s; }
.filter-check-row:hover { background:#F5F6F8; }
/* ── Pro-gated filters ──
   Marked by colour alone: a tinted field and an accent edge, no padlock and
   no "Pro" pill. The badge that used to sit here named the price of every
   row it touched, which turned a filter list into a sales list — five
   little tags in one section, each interrupting the label you were trying
   to read. The tint says "these are a set apart" without asserting why;
   clicking one still opens the real upgrade prompt, which is where the
   explanation belongs. Applied to the section head too, so a whole gated
   section (Salary) reads as one block rather than a lone tinted row. */
.filter-check-row.useno-pro-locked {
  background:#F3F7FD;
  box-shadow:inset 2px 0 0 #9DBFEA;
}
.filter-check-row.useno-pro-locked:hover { background:#E8F0FB; }
.filter-check-row.useno-pro-locked .filter-check-label { color:#2F5270; }
.filter-section-head.is-pro-gated .filter-section-label {
  color:#2F5270;
}
.filter-section-head.is-pro-gated .filter-section-label::after {
  content:''; display:inline-block; vertical-align:middle;
  width:6px; height:6px; margin-left:7px; border-radius:50%;
  background:#9DBFEA;
}
.filter-checkbox { width:17px; height:17px; border:1.5px solid #E4E6EA; border-radius:5px; flex-shrink:0; display:flex; align-items:center; justify-content:center; margin-top:1px; transition:background .1s,border-color .1s; }
.filter-checkbox.checked { background:#16263C; border-color:#16263C; }
.filter-checkbox.checked::after { content:''; display:block; width:6px; height:3.5px; border-left:1.6px solid #fff; border-bottom:1.6px solid #fff; transform:rotate(-45deg) translateY(-1px); }
.filter-check-label { font-size:13.5px; font-weight:500; color:#16263C; line-height:1.35; }
.filter-check-sub { font-size:11.5px; color:#8C877A; margin-top:2px; line-height:1.35; }

/* Radio rows (Location) */
.filter-radio-row { display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:7px; cursor:pointer; transition:background .08s; }
.filter-radio-row:hover { background:#F5F6F8; }
.filter-radio { width:17px; height:17px; border:1.5px solid #E4E6EA; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:border-color .1s; }
.filter-radio.checked { border-color:#16263C; }
.filter-radio.checked::after { content:''; width:8px; height:8px; border-radius:50%; background:#16263C; }

/* Location search */
.filter-loc-search-wrap { position:relative; display:flex; align-items:center; margin:2px 0 10px; }
.filter-loc-search-wrap svg { position:absolute; left:13px; color:#8C877A; pointer-events:none; }
.filter-loc-search { width:100%; height:38px; padding:0 14px 0 38px; box-sizing:border-box; font-size:13.5px; font-family:inherit; color:#16263C; background:#fff; border:1px solid #E4E6EA; border-radius:9px; outline:none; }
.filter-loc-search::placeholder { color:#A8A290; }
.filter-loc-search:focus { border-color:#16263C; }
.filter-more-locations { display:flex; align-items:center; gap:6px; margin-top:4px; padding:6px; font-size:12.5px; font-weight:700; color:#1155BB; background:none; border:none; cursor:pointer; font-family:inherit; }
.filter-more-locations:hover { text-decoration:underline; }

/* Salary range slider */
.filter-salary-slider-wrap { position:relative; height:20px; margin:16px 6px 6px; }
.filter-salary-track { position:absolute; top:50%; left:0; right:0; height:4px; background:#E4E6EA; border-radius:2px; transform:translateY(-50%); }
.filter-salary-range-fill { position:absolute; top:0; height:100%; background:#16263C; border-radius:2px; }
.filter-range-input { position:absolute; top:0; left:0; width:100%; height:20px; margin:0; -webkit-appearance:none; appearance:none; background:transparent; pointer-events:none; }
.filter-range-input::-webkit-slider-runnable-track { -webkit-appearance:none; background:transparent; height:20px; }
.filter-range-input::-webkit-slider-thumb { -webkit-appearance:none; pointer-events:all; width:20px; height:20px; border-radius:50%; background:#fff; border:2.5px solid #16263C; cursor:pointer; box-shadow:0 1px 3px rgba(28,43,58,0.25); margin-top:0; }
.filter-range-input::-moz-range-track { background:transparent; height:20px; border:none; }
.filter-range-input::-moz-range-thumb { pointer-events:all; width:16px; height:16px; border-radius:50%; background:#fff; border:2.5px solid #16263C; cursor:pointer; }
.filter-salary-labels { display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:700; color:#16263C; margin-top:4px; }

.filter-footer { display:flex; align-items:center; justify-content:space-between; padding:14px 22px; border-top:1px solid #ECEDF0; background:#FFFFFF; flex-shrink:0; }
.filter-count { font-size:13px; color:#8C877A; font-weight:600; }
.filter-footer-btns { display:flex; gap:10px; }
.filter-footer .btn { min-height:38px; padding:0 18px; font-size:13.5px; font-weight:700; border-radius:8px; }

@media(max-width:980px) {
  .hs-discover .main { height: auto; overflow: visible; }
  .hs-shell { overflow: visible; }
  .hs-split { grid-template-columns: 1fr; min-height: 0; }
  .hs-list-col { border-right: none; height: auto; }
  .hs-list-body { overflow-y: visible; }
  .hs-detail-col { height: auto; overflow-y: visible; }
  .hs-list-pagination { position: static; background: #FFFFFF; opacity: 1; visibility: visible; pointer-events: auto; transform: none; }
}
.hs-allf-short { display: none; }
@media(max-width:768px) { .hs-allf-long { display: none; } .hs-allf-short { display: inline; } }
/* ── What is filtered, once the pills are gone ────────────────────────────
   A phone hides the pill row by design, and the pills were the only place a
   choice was read back, so after closing the panel nothing on screen said
   the board was narrowed to Canada or to Winter 2027. Two read-backs, both
   only where the pills are not: a count on the Filters button, and one line
   under the search naming the choices, which opens the panel on tap. */
.hs-active-filters { display: none; }
.hs-allf-count {
  display: none; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
  background: #16263C; color: #fff; font-size: 11px; font-weight: 700; line-height: 1;
}
.hs-filter-icon-pill.active .hs-allf-count { background: #fff; color: #16263C; }
.hs-active-filters-text {
  flex: 1 1 auto; min-width: 0; text-align: left; background: none; border: 0; padding: 0;
  font: inherit; font-size: 13px; font-weight: 600; color: #16263C; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hs-active-filters-clear {
  flex-shrink: 0; background: none; border: 0; padding: 0; font: inherit;
  font-size: 13px; font-weight: 600; color: #2C5AA0; cursor: pointer;
}
.hs-active-filters-text:focus-visible, .hs-active-filters-clear:focus-visible { outline: 2px solid rgba(22,38,60,.35); outline-offset: 2px; }
@container hsbar (max-width: 660px) { .hs-allf-count:not([hidden]) { display: inline-flex; } }
@media(max-width:768px) {
  .hs-allf-count:not([hidden]) { display: inline-flex; }
  .hs-active-filters:not([hidden]) { display: flex; align-items: center; gap: 12px; margin-top: 8px; min-width: 0; }
}
@media(max-width:640px) {
  .filter-sidebar { width:100vw; }
  .filter-sidebar-head { padding:16px 20px; }
  .filter-section-head { padding:14px 20px; }
  .filter-section-body { padding:0 20px 16px; }
  .filter-footer { padding:14px 20px; }
}
@media(max-width:768px) {
  .hs-toolbar { padding: 10px 16px 12px; }
  .hs-toolbar-row { flex-wrap: nowrap; }
  .hs-search-wrap { flex: 1 1 100%; order: 1; }
  .hs-filter-pills {
    order: 2; flex-basis: 100%; flex-shrink: 1;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    padding-bottom: 2px; scrollbar-width: none;
  }
  .hs-filter-pills::-webkit-scrollbar { display: none; }
  .hs-filter-pill, .hs-filter-icon-pill, .hs-pill-wrap { flex-shrink: 0; }
  /* A phone gets the search and one Filters button, not a scrolling row of
     pills: every pill's choice is also in the Filters panel. */
  .hs-toolbar-row { gap: 8px; }
  .hs-search-wrap { flex: 1 1 auto; min-width: 0; }
  .hs-filter-pills { flex: 0 0 auto; flex-basis: auto; overflow: visible; padding-bottom: 0; }
  .hs-pill-wrap { display: none !important; }
  .hs-search-input, .filter-loc-search { font-size: 16px; }
  .hs-list-col { padding: 14px 0 0; }
  .hs-list-header { padding: 4px 18px 12px 18px; }
  .hs-list-footer { padding: 12px 18px 12px 18px; }
  .hs-detail-inner { padding: 20px 14px 48px; }
  .hs-detail-header { padding-right: 0; flex-wrap: wrap; }
  .hs-fit-badge { position: static; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; margin-bottom: 10px; }
  /* One tidy stack on a phone: label left, value right, no orphan box. */
  .hs-glance-grid { grid-template-columns: 1fr; gap: 6px; }
  body.hs-discover .hs-glance-box { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 12px; }
  body.hs-discover .hs-glance-lbl { margin: 0; flex-shrink: 0; }
  body.hs-discover .hs-glance-val { text-align: right; }
  .hs-job-row { grid-template-columns: 44px 1fr auto; padding: 12px 18px 12px 15px; gap: 12px; }
  .hs-job-title { font-size: 14.5px; }
  .hs-feed-hero-row, .hs-feed-hero-text, .hs-feed-subtitle-row, .hs-fb-toast, .hs-prefs { min-width: 0; max-width: none; }
}


/* ── Sidebar skeleton ──
   The rail is painted before auth resolves, but it was painted EMPTY: a
   coloured column with nothing in it until sidebar.js (~119KB) parsed and
   built the nav. That gap is what reads as the sidebar loading slowly.
   These rows live in the markup, so they are on screen with the first byte
   and need no JavaScript. sidebar.js assigns innerHTML when it renders, which
   removes them outright, so there is nothing to tear down and no way for a
   skeleton to survive next to the real nav. */
.sk-side { padding: 18px 14px; display: flex; flex-direction: column; gap: 7px; }
.sk-side-mark { width: 30px; height: 30px; border-radius: 9px; margin-bottom: 16px; }
.sk-side-lbl { width: 62px; height: 8px; border-radius: 4px; margin: 14px 0 6px 8px; }
.sk-side-row { height: 34px; border-radius: 9px; }
.sk-side-row.w1 { width: 84%; } .sk-side-row.w2 { width: 72%; } .sk-side-row.w3 { width: 90%; }
.sk-side-mark, .sk-side-lbl, .sk-side-row {
  background: linear-gradient(90deg, rgba(22,38,60,.055) 25%, rgba(22,38,60,.10) 37%, rgba(22,38,60,.055) 63%);
  background-size: 400% 100%;
  animation: sk-shimmer 1.4s ease-in-out infinite;
}
@keyframes sk-shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
@media (prefers-reduced-motion: reduce) {
  .sk-side-mark, .sk-side-lbl, .sk-side-row { animation: none; background: rgba(22,38,60,.07); }
}

<script>

const STAGE_W = 680, STAGE_H = 510, CW = 632, CH = 462;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const card = document.getElementById('card');
function fit() { const s = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H); document.getElementById('stage').style.transform = 'translate(-50%,-50%) scale(' + s + ')'; }
addEventListener('resize', fit); fit();

async function makeWorld(id, w, h) {
  const f = document.createElement('iframe');
  f.style.width = w + 'px'; f.style.height = h + 'px';
  f.srcdoc = document.getElementById(id).textContent;
  card.appendChild(f);
  await new Promise(r => f.onload = r);
  const d = f.contentDocument;
  await Promise.race([d.fonts.ready, sleep(2500)]);
  await Promise.all([...d.images].map(i => i.decode().catch(() => {})));
  f.cam = {x: 0, y: 0, s: 1};
  return f;
}
function rectOf(f, el) { if (typeof el === 'string') el = f.contentDocument.querySelector(el); const r = el.getBoundingClientRect(); return {x: r.left, y: r.top, w: r.width, h: r.height}; }
function union(...rs) { const x = Math.min(...rs.map(r => r.x)), y = Math.min(...rs.map(r => r.y)); return {x, y, w: Math.max(...rs.map(r => r.x + r.w)) - x, h: Math.max(...rs.map(r => r.y + r.h)) - y}; }
/* Frames a rectangle of the page in the card: centred, with padding, never above maxScale. */
function frame(f, r, o = {}) {
  const pad = o.pad ?? 28, max = o.max ?? 1.6;
  const s = Math.min((CW - pad * 2) / r.w, (CH - pad * 2) / r.h, max);
  let x = CW / 2 - (r.x + r.w / 2) * s, y = o.top ? pad - r.y * s : CH / 2 - (r.y + r.h / 2) * s;
  f.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
  f.cam = {x, y, s};
}
/* A list, cropped just inside the gap beside it so no sliver of the next column shows. */
const inset = r => ({x: r.x + 2, y: r.y - 14, w: r.w - 4, h: r.h + 14});
function instant(f, fn) { f.style.transition = 'none'; fn(); void f.offsetWidth; f.style.transition = ''; }

/* A pointer drawn inside the page, so it moves with the camera. */
function cursor(f) {
  const d = f.contentDocument, c = d.createElement('div');
  c.innerHTML = '<svg width="20" height="22" viewBox="0 0 20 22" fill="none"><path d="M3 2l13.5 9.2-6.2 1.3 3.4 6.7-2.6 1.3-3.4-6.8L3 18.4z" fill="#16263C" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  c.style.cssText = 'position:fixed;left:0;top:0;z-index:99999;pointer-events:none;transition:left .75s cubic-bezier(.65,0,.35,1),top .75s cubic-bezier(.65,0,.35,1),transform .15s ease,opacity .3s;opacity:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))';
  d.body.appendChild(c);
  return {
    async to(el, dx = 0.5, dy = 0.5) { const r = rectOf(f, el); c.style.opacity = 1; c.style.left = (r.x + r.w * dx) + 'px'; c.style.top = (r.y + r.h * dy) + 'px'; await sleep(800); },
    async click() { c.style.transform = 'scale(.82)'; await sleep(140); c.style.transform = ''; await sleep(160); },
    hide() { c.style.opacity = 0; },
    place(el, dx = 0.5, dy = 0.5) { const r = rectOf(f, el); c.style.transition = 'none'; c.style.left = (r.x + r.w * dx) + 'px'; c.style.top = (r.y + r.h * dy) + 'px'; void c.offsetWidth; c.style.transition = ''; }
  };
}
/* Hover states come from the page's own :hover rules, copied onto a class. */
function hoverable(f) {
  const d = f.contentDocument, extra = [];
  for (const sh of d.styleSheets) { let rules; try { rules = sh.cssRules; } catch (e) { continue; } for (const r of rules) if (r.selectorText && r.selectorText.includes(':hover')) extra.push(r.cssText.replace(/:hover/g, '.is-hover')); }
  const st = d.createElement('style'); st.textContent = extra.join('\n'); d.head.appendChild(st);
}
async function loop(play) { for (;;) { card.classList.remove('fade'); await play(); card.classList.add('fade'); await sleep(600); card.innerHTML = ''; } }


loop(async () => {
  const f = await makeWorld('w-board', 440, 1100);
  hoverable(f);
  const rows = [...f.contentDocument.querySelectorAll('.hs-job-row')];
  const view = r => frame(f, r, {pad: 0, max: 10, top: true});
  /* Same reading size as the other three: the 440px list at 1:1, centred. */
  const W = 632, H = 462, X = 220 - W / 2;
  instant(f, () => view({x: X, y: 0, w: W, h: H}));
  const cur = cursor(f); cur.place(rows[0], .62, 1.6);
  await sleep(500);
  for (let i = 0; i < 5; i++) {
    const top = Math.max(0, rows[i].offsetTop - 120);
    view({x: X, y: top, w: W, h: H});
    await cur.to(rows[i], .62, .5);
    rows.forEach(r => r.classList.remove('is-hover')); rows[i].classList.add('is-hover');
    await sleep(650);
  }
  rows.forEach(r => r.classList.remove('is-hover')); cur.hide();
  await sleep(900);
});
