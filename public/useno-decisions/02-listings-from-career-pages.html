/* ── Email alert opt-in prompt (email-alerts-prompt.js) ──────────────────────
   A card in the page flow, never an overlay: it must not sit on top of the
   feed, must not trap focus, and must be scrollable past. Both buttons are
   real buttons with visible focus rings, and the decline is not styled to
   disappear — a "Not now" you have to hunt for is the dark pattern this
   feature is supposed to avoid. */
.eap {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  margin: 0 0 14px; padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--navy-border);
  border-radius: 12px;
}
.eap.is-busy { opacity: .75; }
/* The STANDING control — a setting, not an interruption.

   Quieter than the one-time ask on purpose: it is always on screen, so it
   has to be legible for months rather than arresting for one impression.
   Tinted rather than plain so it reads as a distinct band above the toolbar,
   and it never gets the ask's heavier border. */
/* The inline control — a toolbar item, not a banner.

   It began as a full-width tinted band above the toolbar. That band sat on
   the sticky header's border, scrolled underneath it, and added a third
   stacked horizontal bar to a page that already had two. Slimming it did not
   help, because the band was the problem: this is the same control with the
   card taken away.

   Bordered like the pills beside it so it reads as a control rather than
   loose text, but not pill-rounded, because it is a setting for the board and
   not another filter. */
.eap-inline {
  position: relative;
  display: inline-flex; align-items: center; gap: 9px;
  height: 40px; padding: 0 8px 0 14px;
  border: 1.5px solid var(--navy-border); border-radius: 12px;
  background: #fff;
  font-size: 13px; white-space: nowrap;
}
.eap-inline-label { font-weight: 500; color: var(--navy); cursor: pointer; user-select: none; }
/* Absolutely positioned so a failure message cannot widen the control and
   shove the toolbar — the same reflow the label and the Manage link used to
   cause on every toggle. */
.eap-inline .eap-status {
  position: absolute; top: calc(100% + 4px); right: 0;
  margin: 0; font-size: 12px; white-space: nowrap; z-index: 5;
  background: #fff; padding: 2px 6px; border-radius: 6px;
}
.eap-inline .eap-status[hidden] { display: none; }
.eap-prefs {
  font-size: 12.5px; font-weight: 600; color: var(--navy); text-decoration: none;
  border-bottom: 1px solid rgba(22, 38, 60, .28); padding-bottom: 1px;
}
.eap-prefs:hover { border-bottom-color: var(--navy); }
.eap-prefs:focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; border-radius: 2px; }
.eap-prefs[hidden] { display: none; }
/* A switch, sized to the 44px touch target its hit area needs while the
   painted track stays small. */
.eap-switch {
  position: relative; flex-shrink: 0; cursor: pointer;
  width: 44px; height: 26px; padding: 0;
  border: 1px solid var(--navy-border); border-radius: 999px;
  background: #FFFFFF; transition: background .15s, border-color .15s;
}
.eap-switch[aria-checked="true"] { background: var(--navy); border-color: var(--navy); }
.eap-switch:disabled { cursor: default; opacity: .6; }
.eap-switch:focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; }
.eap-switch-knob {
  position: absolute; top: 50%; left: 3px; transform: translateY(-50%);
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--navy-border);
  transition: transform .15s ease, background .15s;
}
.eap-switch[aria-checked="true"] .eap-switch-knob {
  background: #FFFFFF; transform: translateY(-50%) translateX(18px);
}
@media (prefers-reduced-motion: reduce) {
  .eap-switch, .eap-switch-knob { transition: none; }
}
.eap-text { min-width: 0; flex: 1 1 260px; }
.eap-title { margin: 0; font-size: 14px; font-weight: 700; color: var(--navy); letter-spacing: -0.01em; }
.eap-body { margin: 3px 0 0; font-size: 13px; line-height: 1.45; color: var(--navy-muted); }
.eap-status { margin: 6px 0 0; font-size: 12px; font-weight: 600; color: var(--navy-muted); }
.eap-status.is-error { color: #B4342B; }
.eap-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.eap-btn {
  font: inherit; font-size: 13px; font-weight: 600;
  padding: 8px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid transparent; transition: background .15s, color .15s, border-color .15s;
}
.eap-btn:disabled { cursor: default; opacity: .6; }
.eap-btn:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
.eap-btn-primary { background: var(--navy); color: #fff; }
.eap-btn-primary:hover:not(:disabled) { background: var(--navy-hover); }
.eap-btn-quiet { background: transparent; color: var(--navy-muted); border-color: var(--navy-border); }
.eap-btn-quiet:hover:not(:disabled) { color: var(--navy); border-color: var(--navy-border-strong); }

@media (max-width: 640px) {
  /* Stacked rather than squeezed: side by side at this width the decline
     shrinks to a sliver, which is exactly the shape being avoided. */
  .eap { flex-direction: column; align-items: stretch; }
  /* flex-basis is the MAIN axis, which is now the vertical one — the 260px
     that keeps the text from collapsing in a row became 260px of empty height
     between the copy and the buttons. */
  .eap-text { flex: 0 1 auto; }
  .eap-actions { width: 100%; }
  .eap-btn { flex: 1 1 0; }
}

/* ── Page-name tab, one size on every page ───────────────────────────────
   Search, Resources, Applications, Employers and Settings each styled their
   own header tab, at four different sizes. One rule for all of them: any
   tab container sitting directly in the top header. */
body header.top-header > [class$="-tabs"] > a,
body header.top-header > [class$="-tabs"] > button,
body header.top-header > [class$="-tabs"] > span {
  font-family: 'Plus Jakarta Sans', var(--sidebar-f), system-ui, sans-serif;
  font-size: 14px; font-weight: 600; letter-spacing: -0.005em; line-height: 1.3;
  padding: 5px 11px; border-radius: 7px; border: 0;
  color: rgba(47, 82, 112, 0.5); background: transparent; text-decoration: none;
}
body header.top-header > [class$="-tabs"] > .active,
body header.top-header > [class$="-tabs"] > [aria-current="page"],
body header.top-header > [class$="-tabs"] > :only-child {
  color: #2F5270; background: rgba(47, 82, 112, 0.07);
}

/* ── One hairline between the rail and the page ──────────────────────────
   The rail wore a #D7E0EA border AND a 22px soft shadow, which drew a blurry
   double edge down the whole page. One thin line, no shadow. On Explore the
   white fade painted over the blue field's left edge is gone too. */
body .sidebar.sidebar-student {
  border-right: 1px solid rgba(30, 58, 95, .11) !important;
  box-shadow: none !important;
}
body.aisp-page .main::after { display: none !important; }
body.aisp-page .main { box-shadow: none !important; }

/* ── A white rail ─────────────────────────────────────────────────────────
   The grey-blue rail next to white pages read as a tinted panel bolted on,
   and pure white lost the edge entirely. A barely-off-white rail, a firmer
   hairline, and a clearer tint on the current page. */
body .sidebar.sidebar-student { background: #FAFBFD !important; }
body .sidebar.sidebar-student #sidebar-nav .nav-item.active { background: rgba(44, 90, 160, .10) !important; }
body .sidebar.sidebar-student #sidebar-nav .nav-item:hover { background: rgba(30, 58, 95, .035) !important; }

/* No hover label on the resize edge: dragging still works, the tooltip was
   clutter. */
.sidebar-resize-tip { display: none !important; }

/* Every student page's header carries the same hairline under it. Some page
   stylesheets had dropped it. */
body header.top-header { border-bottom: 1px solid rgba(30, 58, 95, .10) !important; }


/* ── Discover ───────────────────────────────────────────────────────────────── */
body.hs-discover { background: #FFFFFF; }
.hs-discover .main { background: #FFFFFF; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

.hs-shell { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }

/* ══ The club board's design, on the main board ═══════════════════════════
   Filters, search, the job details panel and the palette, carried over from
   the club board. Its layout is NOT carried: the club board centres the
   details in a narrow column, and the main board keeps its own left-aligned
   panel. Scoped to body.hs-discover so each rule outranks the base rule it
   replaces wherever that base rule sits in this sheet. */
/* Search on the left, filters hard right, as on the reference. */
body.hs-discover .hs-filter-pills { margin-left: auto; }
body.hs-discover .hs-search-wrap { flex: 0 1 300px; }
/* The bar is one row at every width. As the space for it shrinks (a narrow
   window, or the sidebar open), pills leave from the right, least used
   first; every one of them is also in the Filters panel, which stays. Sized
   on the toolbar itself, so the sidebar's width counts. */
body.hs-discover .hs-toolbar { container-type: inline-size; container-name: hsbar; }
body.hs-discover .hs-toolbar-row { flex-wrap: nowrap; }
body.hs-discover .hs-search-wrap { min-width: 180px; }
@container hsbar (max-width: 1120px) { .hs-pill-wrap[data-pill="posted"] { display: none; } }
@container hsbar (max-width: 960px)  { .hs-pill-wrap[data-pill="timing"] { display: none; } }
@container hsbar (max-width: 800px)  { .hs-pill-wrap[data-pill="format"] { display: none; } }
@container hsbar (max-width: 660px)  {
  .hs-pill-wrap[data-pill="location"] { display: none; }
  body.hs-discover .hs-allf-long { display: none; } body.hs-discover .hs-allf-short { display: inline; }
  .hs-search-wrap { flex: 1 1 auto !important; }
}
/* ── Job rows, minimal ────────────────────────────────────────────────────
   No boxed caps tags: pay, type and age are one quiet line of text. Save and
   remove stay out of the way until the row is hovered or open, and the open
   row is a tint with a hairline rather than a slab. */
body.hs-discover .hs-job-row {
  padding: 20px 20px 20px 34px; gap: 14px;
  border-left-width: 2px; border-bottom-color: rgba(30,58,95,.07);
}
body.hs-discover .hs-job-row:hover { background: rgba(30,58,95,.025); }
body.hs-discover .hs-job-row.selected { background: rgba(44,90,160,.085); border-left-color: #2C5AA0; }
body.hs-discover .hs-job-title { font-size: 14.5px; font-weight: 650; margin-bottom: 3px; }
body.hs-discover .hs-job-company { font-size: 13px; color: #4A5B70; }
body.hs-discover .hs-job-meta { font-size: 12px; color: #8A97A8; margin-top: 3px; }
body.hs-discover .hs-job-tags { gap: 0; margin-top: 4px; flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
body.hs-discover .hs-job-tag {
  font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none;
  padding: 0; border: 0; border-radius: 0; color: #8A97A8;
}
body.hs-discover .hs-job-tag:first-child:not(:last-child) { color: #4A5B70; font-weight: 600; }
body.hs-discover .hs-job-tag + .hs-job-tag::before { content: '·'; margin: 0 6px; }
body.hs-discover .hs-job-tag:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
body.hs-discover .hs-job-tag:first-child:not(:last-child) { flex-shrink: 0; }
/* The age is a corner stamp, top right. Save and remove take that corner
   on hover. */
body.hs-discover .hs-job-age {
  position: absolute; top: 22px; right: 22px; margin: 0;
  font-size: 10.5px; font-weight: 500; color: #A3AEBC; transition: opacity .12s;
}
body.hs-discover .hs-job-row:hover .hs-job-age { opacity: 0; }
body.hs-discover .hs-job-main { min-width: 0; }
body.hs-discover .hs-job-tags + .hs-job-age { margin: 0; }
body.hs-discover .hs-job-actions { opacity: 0; transition: opacity .12s; }
body.hs-discover .hs-job-row:hover .hs-job-actions,
body.hs-discover .hs-job-actions:focus-within { opacity: 1; }
body.hs-discover .hs-job-dismiss, body.hs-discover .hs-job-save { color: #8A97A8; }
/* The sort control is a menu, so it carries a caret like every other one. */
.hs-sort-caret { color: #7D8CA0; flex-shrink: 0; }
.hs-sort-btn[aria-expanded="true"] .hs-sort-caret, .hs-sort-btn.open .hs-sort-caret { transform: rotate(180deg); }
/* ── The title on one line ────────────────────────────────────────────────
   Two things were breaking it. The header reserves 110px on its right for
   the fit badge, and that badge has no markup left on this page: it is a
   stylesheet with nothing to style, quietly costing every title a fifth of
   its width. Reclaiming it, and dropping the ceiling from 34px to 26,
   fits the roles on one line. Long ones still wrap - a job title has no
   length limit - so they wrap into even halves instead of leaving one word
   stranded underneath. */
body.hs-discover .hs-detail-header { padding-right: 0; }
/* And the text column has to actually claim what the padding gave back: it
   is flex: 0 1 auto, so it was shrink-wrapping to a measure narrower than
   the room beside the logo and wrapping titles that had space to spare. */
body.hs-discover .hs-detail-hd { flex: 1 1 auto; min-width: 0; }
body.hs-discover .hs-detail-title {
  font-size: clamp(19px, 1.9vw, 25px);
  text-wrap: balance;
}

/* ── Comp, Location and Type, quieter than the buttons ────────────────────
   Apply is what this panel is for. These three are the facts you check
   after deciding to look, so they read at the size of facts: a smaller box
   with less air in it, and a value that no longer competes with the title
   for weight. */
body.hs-discover .hs-glance-grid { gap: 8px; margin-bottom: 22px; }
body.hs-discover .hs-glance-box { padding: 8px 11px; border-radius: 8px; }
body.hs-discover .hs-glance-lbl { font-size: 8.5px; margin-bottom: 3px; }
body.hs-discover .hs-glance-val { font-size: 12.5px; font-weight: 600; }
/* ── Eligibility, plain ───────────────────────────────────────────────────
   No green check discs, no grey chip, no brown-grey notes and no caption
   under the heading. A small navy dot per line (a ring when it is inferred
   rather than stated), regular-weight text, one navy family. */
body.hs-discover .hs-elig-sub { display: none; }
body.hs-discover .hs-elig-row { gap: 12px; margin-bottom: 9px; align-items: baseline; }
body.hs-discover .hs-elig-ic,
body.hs-discover .hs-elig-ic.confirmed,
body.hs-discover .hs-elig-ic.likely,
body.hs-discover .hs-elig-ic.warn {
  width: 5px; height: 5px; min-width: 5px; border-radius: 50%; margin-top: 0;
  background: #2C5AA0; border: 0; color: transparent; font-size: 0; overflow: hidden;
  transform: translateY(-2px);
}
body.hs-discover .hs-elig-ic svg { display: none; }
body.hs-discover .hs-elig-ic.likely { background: transparent; box-shadow: inset 0 0 0 1.25px #2C5AA0; }
body.hs-discover .hs-elig-main { font-size: 13.5px; font-weight: 500; color: #2A3B51; line-height: 1.45; }
body.hs-discover .hs-elig-main .lk { font-weight: 500; color: #2A3B51; }
body.hs-discover .hs-elig-note { font-size: 12.5px; color: #8A97A8; }
/* Calmer and plainly a list of requirements: no explanation line under
   each item, a square marker rather than a bullet so it reads as a checklist,
   and two columns so five short lines are not a tall stack. */
body.hs-discover .hs-elig-note { display: none; }
body.hs-discover .hs-elig-section .hs-elig-rows { display: grid; grid-template-columns: 1fr; gap: 10px; }
body.hs-discover .hs-elig-row { margin-bottom: 0; align-items: center; gap: 10px; }
body.hs-discover .hs-elig-ic,
body.hs-discover .hs-elig-ic.confirmed,
body.hs-discover .hs-elig-ic.likely,
body.hs-discover .hs-elig-ic.warn {
  width: 7px; height: 7px; min-width: 7px; border-radius: 2px; transform: none; background: #2C5AA0;
}
body.hs-discover .hs-elig-ic.likely { background: transparent; box-shadow: inset 0 0 0 1.25px #2C5AA0; }
body.hs-discover .hs-elig-main { font-size: 14px; }
@media (max-width: 1100px) { body.hs-discover .hs-elig-section .hs-elig-rows { grid-template-columns: 1fr; } }


/* ── Share is the third thing you might do, and now looks like it ─────────
   Apply is solid, Save is outlined, and Share was a second outlined pill
   beside it: two controls of identical weight for two jobs of very
   different importance. It becomes three dots in a circle, the shape every
   overflow control already has, so the row reads primary, secondary, then
   the quiet one. */
body.hs-discover .hs-share-wrap > .hs-btn {
  width: 38px; height: 38px; padding: 0; border-radius: 50%;
  border-color: transparent; background: transparent; color: #7D8CA0;
  justify-content: center;
  transition: background .13s, color .13s;
}
body.hs-discover .hs-share-wrap > .hs-btn:hover,
body.hs-discover .hs-share-wrap > .hs-btn[aria-expanded="true"] {
  background: rgba(44,90,160,.09); color: #2C5AA0;
}
/* The dots are 38px from the left edge of a 38px button, so the menu hangs
   off it rather than lining up with a label that is no longer there. */
body.hs-discover .hs-share-wrap .hs-share-dropdown { left: -6px; }

/* ── The description reads as text, not as a control ──────────────────────
   Eighteen lines before it folds, matching the length the template folds
   at, and the label above it in the same navy as every other small-caps
   label on the board rather than the warm grey it inherited. */
body.hs-discover .hs-desc.collapsed { -webkit-line-clamp: 18; }
body.hs-discover .hs-desc-lbl { color: #7D8CA0; }
body.hs-discover .hs-desc { color: #4A5765; }
body.hs-discover .hs-more-btn { color: #2C5AA0; }

/* ── Why you match, as its own section ────────────────────────────────────
   It was three loose lines sitting between the glance boxes and the job
   details with nothing to say where it started, so it read as an
   afterthought attached to whichever block you looked at first.

   A rule ABOVE it only. Every section below this one already draws its own
   border-top (.hs-elig-section, .hs-jd-section), so a border-bottom here
   put a second hairline a few pixels under the first and made three lines
   out of two sections. One rule per boundary. */
body.hs-discover .hs-why-block {
  border-top: 1px solid rgba(30,58,95,.08);
  margin: 22px 0 0; padding: 22px 0 0;
}
body.hs-discover .hs-why-block .hs-why-item:last-child { margin-bottom: 0; }


/* ── The filters ──────────────────────────────────────────────────────────
   Separate controls, as they were. What changes is the shape and the family:
   8px instead of 12 so they read as buttons rather than lozenges, a 1px edge
   instead of 1.5, and the navy the rest of the board uses in place of the
   grey hairline. Joining them into one segmented group was a step too far -
   they are six independent choices and they should look like it. */
body.hs-discover .hs-filter-pill {
  height: 38px; border-radius: 8px; border-width: 1px;
  border-color: rgba(30,58,95,.16);
  background: #FFFFFF; color: #2A3B51; font-weight: 550; font-size: 13.5px;
}
body.hs-discover .hs-filter-pill:hover { border-color: rgba(30,58,95,.32); background: #FBFCFD; }
body.hs-discover .hs-filter-pill.active {
  background: #F4F7FB; border-color: rgba(30,58,95,.34); color: #16263C; font-weight: 650;
}

/* ── One family of colour ─────────────────────────────────────────────────
   The detail pane carried three warm greys (#8C877A, #9A958A, #6E6858) left
   over from an older palette, plus grey-filled chips and boxes. Against the
   navy the page is actually built from, warm grey reads as washed out rather
   than quiet. Every one of them becomes the navy the rest of the product
   uses, at the weight it was already carrying, and the fills come off so the
   chips are text with an edge instead of grey tablets.
   First made on the club board, then carried to the main one. */
body.hs-discover .hs-detail-co-meta,
body.hs-discover .hs-jd-sub,
body.hs-discover .hs-glance-lbl { color: #7D8CA0; }
body.hs-discover .hs-jd-icon { color: #98A6B8; }
body.hs-discover .hs-jd-chip {
  background: transparent;
  border-color: rgba(30,58,95,.16);
  color: #3D4A54;
}
body.hs-discover .hs-jd-more:hover { background: rgba(30,58,95,.07); }
body.hs-discover .hs-glance-box { border-color: rgba(30,58,95,.14); }
body.hs-discover .hs-detail-empty { color: #98A6B8; }

/* ── A little more blue ───────────────────────────────────────────────────
   The same #2C5AA0 the rail uses, on the four places that are already
   accents rather than surfaces: the search glass, the rail beside the open
   role, the selected filter, and the checks beside Why you match. */
body.hs-discover .hs-search-icon-wrap { color: #2C5AA0; }
body.hs-discover .hs-job-row.selected { border-left-color: #2C5AA0; background: rgba(44,90,160,.055); }
body.hs-discover .hs-filter-pill.active {
  background: rgba(44,90,160,.08); border-color: rgba(44,90,160,.42); color: #2C5AA0;
}
body.hs-discover .hs-why-lbl, body.hs-discover .hs-why-check { color: #2C5AA0; }

/* ── The last of the warm greys ───────────────────────────────────────────
   Four greys with a brown cast (#A19C8C, #9A958A, #8C877A, #6E6858) run
   through the board's secondary text, left from an older palette. Beside
   navy they read as dirty rather than quiet, which is the 'poop-coloured'
   thing in the filter panel. Each is replaced by the navy of the same
   lightness, rule for rule, so nothing changes but the hue. Generated
   from the stylesheet above rather than hand-listed, so none is missed.
   */
body.hs-discover .filter-check-sub { color: #7D8CA0; }
body.hs-discover .filter-chevron { color: #7D8CA0; }
body.hs-discover .filter-close-btn { color: #7D8CA0; }
body.hs-discover .filter-count { color: #7D8CA0; }
body.hs-discover .filter-loc-search-wrap svg { color: #7D8CA0; }
body.hs-discover .hs-count { color: #7D8CA0; }
body.hs-discover .hs-count-fresh { color: #7D8CA0; }
body.hs-discover .hs-detail-co-meta { color: #7D8CA0; }
body.hs-discover .hs-detail-col::-webkit-scrollbar-thumb:hover { background: #8FA0B5; }
body.hs-discover .hs-detail-date-lbl { color: #98A6B8; }
body.hs-discover .hs-detail-date.deadline-closed .hs-detail-date-val { color: #8FA0B5; }
body.hs-discover .hs-elig-empty { color: #5A6B80; }
body.hs-discover .hs-elig-ic.likely { color: #5A6B80; }
body.hs-discover .hs-elig-sub { color: #8FA0B5; }
body.hs-discover .hs-employer-industry { color: #7D8CA0; }
body.hs-discover .hs-explore-chip { color: #5A6B80; }
body.hs-discover .hs-fb-item svg { color: #7D8CA0; }
body.hs-discover .hs-for-you-empty { color: #7D8CA0; }
body.hs-discover .hs-glance-lbl { color: #8FA0B5; }
body.hs-discover .hs-jd-icon { color: #5A6B80; }
body.hs-discover .hs-jd-sub { color: #8FA0B5; }
body.hs-discover .hs-list-body::-webkit-scrollbar-thumb:hover { background: #8FA0B5; }
body.hs-discover .hs-list-footer { color: #5A6B80; }
body.hs-discover .hs-lock-loading { color: #98A6B8; }
body.hs-discover .hs-lock-more-sub { color: #7D8CA0; }
body.hs-discover .hs-page-ellipsis { color: #8FA0B5; }
body.hs-discover .hs-search-input::placeholder { color: #98A6B8; }
body.hs-discover .hs-status-muted { color: #7D8CA0; }

/* ── The club board's details panel, centred ─────────────────────────────
   By request (12 Sep 2026): the details read exactly like the club board, in
   a 660px column in the middle of the panel with air above the title. The
   description still folds under its label. */
body.hs-discover .hs-detail-inner { max-width: 660px; padding-top: 52px; margin-left: auto; margin-right: auto; }
body.hs-discover .hs-desc-fold {
  display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0;
  font-family: inherit; cursor: pointer; text-align: left;
}
body.hs-discover .hs-desc-fold:hover { color: #2C5AA0; }
body.hs-discover .hs-desc-chev { color: #7D8CA0; transition: transform .15s ease; }
body.hs-discover .hs-desc-section.is-folded .hs-desc-chev { transform: rotate(-90deg); }
body.hs-discover .hs-desc-section.is-folded #job-desc-body { display: none; }

/* ── The search field ─────────────────────────────────────────────────────
   The blue disc behind the magnifier was the loudest thing on a screen whose
   job is to be quiet, and a 12px pill with a grey hairline is the field every
   product ships. This one has no disc, a navy glass at the same
   weight as the type beside it, a squarer corner, and a rule along the
   bottom that thickens on focus rather than a coloured halo. The placeholder
   drops its warm grey with the rest of them. */
body.hs-discover .hs-search-icon-wrap {
  background: transparent; color: #16263C; width: 20px; height: 20px; left: 14px;
}
body.hs-discover .hs-search-wrap:focus-within .hs-search-icon-wrap { background: transparent; }
body.hs-discover .hs-search-input {
  height: 42px; padding-left: 42px; border-radius: 10px;
  border: 1px solid rgba(30,58,95,.14);
  background: #FDFDFE;
}
body.hs-discover .hs-search-input:focus {
  /* No black rule. A bar that appears under the field on focus is a state
     change loud enough to read as an error; the edge simply firms up. */
  border-color: rgba(30,58,95,.34);
  border-bottom-color: rgba(30,58,95,.34);
  background: #FFFFFF;
  box-shadow: none;
}

body.hs-discover .top-header { display: flex; align-items: center; }
body.hs-discover .top-header-inner { flex: 1; }
body.hs-discover .top-header-student .header-actions { gap: 8px; }

/* ── Page tabs in top header ── */
.hs-tabs { display: flex; align-items: center; gap: 4px; padding-left: 24px; flex-shrink: 0; }
.hs-tab {
  font-family: 'Plus Jakarta Sans', var(--sidebar-f), system-ui, sans-serif;
  font-size: 13px; font-weight: 600; letter-spacing: 0;
  color: rgba(47, 82, 112, 0.42); text-decoration: none;
  padding: 4px 10px; border-radius: 6px; border: none; background: none; cursor: pointer;
  transition: color .12s, background .12s;
}
.hs-tab:hover { color: #2F5270; background: rgba(47, 82, 112, 0.06); }
.hs-tab.active { color: #2F5270; background: rgba(47, 82, 112, 0.07); }

/* ── Toolbar ── */
.hs-feed-hero {
  display: none;
  padding: 12px 36px 0;
  flex-shrink: 0;
}
.hs-feed-hero.is-visible { display: block; }
.hs-feed-title {
  font-family: 'Plus Jakarta Sans', var(--sidebar-f), system-ui, sans-serif;
  font-size: 28px; line-height: 1.05; font-weight: 800;
  letter-spacing: -0.03em; color: #16263C; margin: 0 0 4px;
}
.hs-feed-subtitle-row { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 460px; }
.hs-feed-dynamic { font-size: 13px; font-weight: 600; color: #3D6A9E; }

.hs-feed-hero-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.hs-feed-hero-text { min-width: 0; flex: 1 1 auto; }

/* Quiet preference action (links to onboarding edit mode). */
.hs-prefs {
  flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
  min-height: 32px; padding: 0 10px; border: 1px solid #D7E3F3; border-radius: 8px;
  background: #EEF5FF; color: #2F5270; font-size: 11.5px; font-weight: 700;
  text-decoration: none; transition: background .12s, border-color .12s, box-shadow .12s;
}
.hs-prefs:hover { background: #E3EFFB; border-color: #BFD1E8; box-shadow: 0 2px 6px rgba(47, 82, 112, 0.1); }
.hs-prefs:focus-visible { outline: 3px solid rgba(47, 82, 112, 0.2); outline-offset: 2px; }

/* ── Feedback toast with Undo (For You only) ── */
.hs-fb-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #16263C; color: #fff; padding: 10px 12px 10px 16px; border-radius: 10px;
  font-size: 13px; font-weight: 500; opacity: 0; transition: opacity .2s, transform .2s;
  z-index: 500; display: flex; align-items: center; gap: 14px; max-width: calc(100vw - 32px);
  pointer-events: none; box-shadow: 0 10px 30px rgba(22,38,60,.28); }
.hs-fb-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.hs-fb-toast-msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hs-fb-toast-undo { flex-shrink: 0; background: transparent; border: none; color: #9EC5E8;
  font-size: 13px; font-weight: 700; cursor: pointer; padding: 2px 4px; font-family: inherit; }
.hs-fb-toast-undo:hover { color: #fff; text-decoration: underline; }
.hs-apply-notice a.hs-fb-toast-undo { text-decoration: none; }
.hs-apply-notice a.hs-fb-toast-undo:hover { text-decoration: underline; }
.hs-apply-notice-close { flex-shrink: 0; width: 24px; height: 24px; margin-left: -6px; border: 0; border-radius: 6px;
  background: transparent; color: rgba(255,255,255,.62); cursor: pointer; display: inline-flex;
  align-items: center; justify-content: center; padding: 0; }
.hs-apply-notice-close:hover { color: #fff; background: rgba(255,255,255,.1); }

@media (max-width: 640px) {
  .hs-feed-hero-row { flex-direction: column; align-items: stretch; gap: 10px; }
  .hs-fb-toast { left: 16px; right: 16px; transform: translateY(20px); max-width: none; }
  .hs-fb-toast.show { transform: translateY(0); }
}
.hs-toolbar { padding: 10px 36px 12px; flex-shrink: 0; }
/* The first-save card still uses the old slot above the toolbar, and still
   needs the toolbar's inset — it is a card, not a toolbar item, so it cannot
   move inline. The standing alerts control no longer lives here at all; it is
   .hs-toolbar-alerts, inside the toolbar row. */
#email-alerts-prompt-slot:not(:empty) { padding: 0 36px; margin-top: 10px; }

/* First control after the search box, not the last one on the row.

   It was margin-left:auto (the far corner), then after the pills (still the
   end of the row, six controls deep). A toolbar is read left to right; the
   only genuinely central place in it is next to the search box. */
.hs-toolbar-alerts { display: flex; align-items: center; margin-right: 2px; }
.hs-toolbar-alerts.hs-list-alerts { display: none; }
/* In the sidebar: a quiet row, not a bordered pill. */
/* Right end of the rail's bottom icon strip: small muted words and a small
   switch, on the same line as the feedback icons. One word, "Alerts": at three
   icons the two-word form left the switch pressed against the edge of the rail
   (the full name is still the group's accessible label and the tooltip). */
.sidebar .hs-list-alerts.in-rail { display: flex; align-items: center; margin-left: auto; padding: 0; flex-shrink: 0; }
.sidebar .hs-list-alerts.in-rail:empty { display: none; }
.sidebar .hs-list-alerts .eap-inline {
  display: flex; align-items: center; gap: 7px; height: auto; width: auto;
  padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; position: relative;
}
.sidebar .hs-list-alerts .eap-inline-label { font-size: 12px; font-weight: 500; color: #8A97A8; }
.sidebar .hs-list-alerts .eap-switch { width: 24px; height: 14px; }
.sidebar .hs-list-alerts .eap-switch-knob { width: 10px; height: 10px; left: 1px; }
.sidebar .hs-list-alerts .eap-switch[aria-checked="true"] .eap-switch-knob { transform: translateY(-50%) translateX(10px); }
.sidebar .hs-list-alerts .eap-switch[aria-checked="true"] { background: #2C5AA0; border-color: #2C5AA0; }
.sidebar .hs-list-alerts .eap-inline .eap-status { top: auto; bottom: calc(100% + 6px); left: auto; right: 0; }
body.sidebar-compact .sidebar .hs-list-alerts.in-rail { display: none; }
.hs-toolbar-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.hs-search-wrap { position: relative; flex: 0 1 420px; }
.hs-search-icon-wrap {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border-radius: 50%; border: none; padding: 0;
  background: rgba(17,85,187,.1);
  display: flex; align-items: center; justify-content: center;
  color: #1155BB; cursor: pointer; flex-shrink: 0;
  transition: background .15s, color .15s;
}
.hs-search-icon-wrap:hover { background: rgba(17,85,187,.17); }
.hs-search-input {
  width: 100%; height: 40px; padding: 0 16px 0 48px; box-sizing: border-box;
  font-size: 14px; color: #1C2B3A; background: #FFFFFF;
  border: 1.5px solid #E4E6EA; border-radius: 12px; outline: none;
  font-family: inherit; transition: border-color .15s, background .15s, box-shadow .15s;
}
.hs-search-input::placeholder { color: #A19C8C; }
.hs-search-input:focus {
  border-color: #1155BB;
  box-shadow: 0 0 0 4px rgba(17,85,187,.12);
}
.hs-search-wrap:focus-within .hs-search-icon-wrap {
  background: rgba(17,85,187,.17);
}

.hs-filter-pills { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.hs-filter-pill {
  display: inline-flex; align-items: center; gap: 7px;
  height: 40px; padding: 0 14px 0 18px;
  font-size: 14px; font-weight: 500; color: #16263C;
  background: #fff; border: 1.5px solid #E4E6EA; border-radius: 12px;
  cursor: pointer; white-space: nowrap; font-family: inherit;
  transition: border-color .1s, background .1s;
}
/* A caret, after all.

   This used to read "No caret — the pill is plainly a button, and a row of
   six arrows read as noise", and as a matter of visual density that was
   right. It was wrong about what the pill communicates: a bare rounded
   rectangle in a row of rounded rectangles reads as a toggle or a segmented
   control, so people did not know these opened anything. An affordance that
   has to be discovered by clicking is not an affordance.

   Small and low-contrast so the row still reads as a row, and it turns over
   when the menu is open so the pill also says whether it is currently the
   one showing. "All filters" deliberately has none — it opens a modal, not a
   menu, and should not claim otherwise. */
/* A solid wedge, not a chevron.

   A hairline chevron is what every dropdown on the internet uses, so it reads
   as chrome rather than as part of this control. A filled triangle with
   rounded corners has actual weight, echoes the pill's own 12px rounding, and
   is legible at 12px where a 1.5px stroke starts to disappear. */
/* A pill can never grow enough to shove the row.

   pillLabel reads back what is chosen, so picking two start terms turned
   "Start term" into "Summer 2027, Fall 2026" — the pill roughly doubled and
   every control after it jumped sideways. The label truncates instead; the
   full selection is visible in the open menu, which is where someone
   checking it is already looking. */
.hs-pill-label {
  display: block; min-width: 0; max-width: 168px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hs-pill-caret {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; margin-left: -1px;
  border-radius: 6px;
  color: #8C93A1;
  transition: transform .18s cubic-bezier(.34, 1.4, .64, 1), background .12s, color .12s;
}
/* A tinted well behind the chevron, so the pill ends in a deliberate little
   control rather than a stray tick mark. It is the pill's own colour at low
   alpha, which means it reads as part of the pill on white and on navy
   without needing a second rule for each state. */
.hs-filter-pill:hover .hs-pill-caret { background: rgba(22, 38, 60, .06); color: #16263C; }
.hs-filter-pill.is-open .hs-pill-caret {
  transform: rotate(180deg);
  background: rgba(22, 38, 60, .08); color: #16263C;
}
.hs-filter-pill.has-value .hs-pill-caret { color: rgba(255, 255, 255, .72); }
.hs-filter-pill.has-value:hover .hs-pill-caret,
.hs-filter-pill.has-value.is-open .hs-pill-caret {
  background: rgba(255, 255, 255, .16); color: #fff;
}
/* The overshoot in the easing is what makes the flip feel like a control
   answering rather than a transform running. Removed for anyone who asked
   for less motion — they still get the state, just not the flourish. */
@media (prefers-reduced-motion: reduce) {
  .hs-pill-caret { transition: background .12s, color .12s; }
}
.hs-filter-pill:hover { border-color: #E4E6EA; background: #F5F6F8; }
/* A pill that holds a value fills navy, the same state the old country
   chips used when active: the fill says "something is narrowing the list"
   and the label says what. No caret - the pill is plainly a button, and a
   row of six arrows read as noise. */
.hs-filter-pill.has-value { background: #16263C; color: #fff; border-color: #16263C; }
.hs-filter-pill.has-value:hover { background: #1F3350; border-color: #1F3350; }
.hs-filter-pill.is-open { border-color: #C9CED6; background: #F5F6F8; }
.hs-filter-pill.has-value.is-open { background: #1F3350; border-color: #1F3350; }
.hs-pill-wrap { position: relative; flex-shrink: 0; }
.hs-pill-menu {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 60;
  min-width: 210px; background: #fff; border: 1px solid rgba(28,43,58,0.12); border-radius: 12px;
  box-shadow: 0 8px 24px rgba(28,43,58,.16); padding: 6px;
}
.hs-pill-menu.open { display: block; }
.hs-pill-opt {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; text-align: left; padding: 10px 12px;
  font-size: 14px; font-weight: 500; color: #1C2B3A; border-radius: 8px;
  cursor: pointer; border: none; background: none; font-family: inherit;
  transition: background .1s;
}
.hs-pill-opt:hover { background: rgba(28,43,58,0.06); }
.hs-pill-opt.active { color: #16263C; font-weight: 600; }
.hs-pill-opt .hs-pill-tick { opacity: 0; font-size: 12px; color: #2F5270; }
.hs-pill-opt.active .hs-pill-tick { opacity: 1; }
.hs-pill-menu-clear {
  display: block; width: 100%; margin-top: 4px; padding: 8px 12px; border: 0; border-top: 1px solid #EEF0F3;
  background: none; font: inherit; font-size: 13px; color: #6B7785; text-align: left; cursor: pointer; border-radius: 0 0 8px 8px;
}
.hs-pill-menu-clear:hover { color: #1C2B3A; background: #F5F6F8; }
.hs-filter-sep { width: 1px; height: 20px; background: #E4E6EA; margin: 0 3px; flex-shrink: 0; }
.hs-filter-pill.active { background: #16263C; color: #fff; border-color: #16263C; }
.hs-filter-pill:focus-visible { outline: 2px solid rgba(22,38,60,.35); outline-offset: 2px; }
.hs-filter-icon-pill.active { background: #16263C; color: #fff; border-color: #16263C; }
.hs-filter-icon-pill {
  height: 40px; padding: 0 14px; border-radius: 12px;
  background: #fff; border: 1.5px solid #E4E6EA;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  cursor: pointer; color: #16263C; font-size: 14px; font-weight: 500;
  font-family: inherit; transition: border-color .1s, background .1s;
  flex-shrink: 0; white-space: nowrap;
}
.hs-filter-icon-pill:hover { border-color: #E4E6EA; background: #F5F6F8; }
.hs-filter-icon-pill:focus-visible { outline: 2px solid rgba(22,38,60,.35); outline-offset: 2px; }

/* ── Split: two full-height scroll columns ── */
.hs-split {
  display: grid; grid-template-columns: minmax(360px, 440px) 1fr;
  flex: 1; min-height: 0;
  border-top: 1px solid #E4E6EA;
}
.hs-list-col {
  min-width: 0; min-height: 0; height: 100%;
  display: flex; flex-direction: column;
  padding: 16px 0 0;
  overflow-x: hidden;
  border-right: 1px solid #E4E6EA;
}
/* A pill in the sticky header, beside the page tab. Quiet while there are
   reveals left, amber once there are none — that is the one state worth
   noticing BEFORE clicking rather than after. */
.hs-reveal-meter {
  display: inline-flex; align-items: center; gap: 6px;
  margin-left: 10px; padding: 5px 11px; border-radius: 999px;
  background: rgba(31,95,184,.08); color: #1F5FB8;
  font-size: 11.5px; font-weight: 650; letter-spacing: -.005em; white-space: nowrap;
}
.hs-reveal-meter::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; opacity: .55;
}
.hs-reveal-meter.is-empty { background: rgba(180,83,9,.10); color: #B45309; }
.hs-reveal-meter[hidden] { display: none; }

.hs-list-header {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 24px 14px 40px;
  background: #FFFFFF;
}
.hs-list-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 8px;
  margin-right: 2px;
}
.hs-list-footer {
  flex-shrink: 0;
  padding: 12px 24px 14px 40px;
  font-size: 13px; color: #6E6858;
  border-top: 1px solid #E4E6EA;
  background: #FFFFFF;
}
.hs-list-footer a { color: #3D6A9E; font-weight: 500; text-decoration: none; }
.hs-list-footer a:hover { text-decoration: underline; }
.hs-list-body::-webkit-scrollbar { width: 10px; }
.hs-list-body::-webkit-scrollbar-track { background: rgba(228, 230, 234,.35); border-radius: 5px; }
.hs-list-body::-webkit-scrollbar-thumb { background: #E4E6EA; border-radius: 5px; border: 2px solid #FFFFFF; }
.hs-list-body::-webkit-scrollbar-thumb:hover { background: #9A958A; }
.hs-detail-col::-webkit-scrollbar { width: 10px; }
.hs-detail-col::-webkit-scrollbar-track { background: rgba(228, 230, 234,.25); border-radius: 5px; }
.hs-detail-col::-webkit-scrollbar-thumb { background: #E4E6EA; border-radius: 5px; border: 2px solid #FFFFFF; }
.hs-detail-col::-webkit-scrollbar-thumb:hover { background: #9A958A; }
.hs-list-pagination {
  position: sticky; bottom: 0; z-index: 3;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 4px;
  padding: 14px 8px 18px;
  margin-top: 4px;
  background: linear-gradient(to top, #FFFFFF 72%, rgba(255, 255, 255,0));
  opacity: 0; visibility: hidden; pointer-events: none;
  transform: translateY(10px);
  transition: opacity .22s ease, visibility .22s ease, transform .22s ease;
}
.hs-list-pagination.is-revealed {
  opacity: 1; visibility: visible; pointer-events: auto;
  transform: translateY(0);
}
.hs-page-btn {
  min-width: 34px; height: 34px; padding: 0 8px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; font-family: inherit;
  color: #4A5560; background: #FFFFFF;
  border: 1px solid #E4E6EA; border-radius: 8px;
  cursor: pointer; transition: background .12s, color .12s, border-color .12s;
}
.hs-page-btn:hover:not(:disabled):not(.active) { background: #fff; border-color: #E4E6EA; color: #16263C; }
.hs-page-btn.active { background: #16263C; border-color: #16263C; color: #fff; cursor: default; }
.hs-page-btn:disabled { opacity: .35; cursor: default; }
.hs-page-nav { min-width: 34px; padding: 0; }
.hs-page-ellipsis { padding: 0 4px; font-size: 13px; color: #9A958A; user-select: none; }
.hs-count { font-size: 12px; font-weight: 400; color: #8C877A; display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1 1 auto; }
/* Truncates instead of wrapping to a second line. .hs-list-header centers
   its two children vertically, so a count that wraps (the "· updated every
   few hours" suffix is the usual culprit on a narrow list column) pushes
   the sort control to sit centered against the whole two-line block —
   level with neither line and visually crowding the wrapped text. A single
   truncated line keeps the sort control level with it at any width. */
.hs-count-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
/* Deliberately quiet. This was a bold near-black "6,500 active internships"
   with a pulsing dot, which made the loudest thing on the list column a
   number nobody came for — and next to it the sort control had to shout to
   stay visible. One muted line, regular weight, and the rows are the thing
   the eye lands on again. */
/* The completeness strip: shown only when results are incomplete, a page
   failed, or the limiter is holding. Never decorative. */
.hs-browse-status {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; margin: 8px 0 0; border-radius: 10px;
  background: #FFF8EC; border: 1px solid #F0E2C6; font-size: 12.5px; line-height: 1.45;
}
.hs-browse-status[hidden] { display: none; }
.hs-status-warn { color: #7A5A12; flex: 1 1 200px; }
.hs-status-muted { color: #8C877A; flex: 1 1 200px; }
.hs-status-retry {
  flex: 0 0 auto; cursor: pointer; border: 1px solid #D8C79E; background: #FFFFFF;
  color: #16263C; font: inherit; font-weight: 600; padding: 5px 12px; border-radius: 8px;
}
.hs-status-retry:hover { background: #FDF6E8; }
.hs-status-retry:focus-visible { outline: 2px solid #16263C; outline-offset: 2px; }
/* Never the one that shrinks — it has nowhere useful to truncate to. */
.hs-sort-wrap { flex-shrink: 0; }
/* A live indicator, not an alarm. The corpus is republished every few hours
   and roles close without warning, so "active" is the operative word and the
   dot is what makes it read as a live number rather than a static total.
   Slow and low-contrast on purpose — a fast red blink on a job board is a
   dark pattern, and this has to survive being looked at all day. */
.hs-live-dot {
  position: relative; flex-shrink: 0;
  width: 7px; height: 7px; border-radius: 50%; background: #2F9E63;
}
.hs-live-dot::after {
  content: ''; position: absolute; inset: -3px; border-radius: 50%;
  border: 1.5px solid rgba(47,158,99,.5);
  animation: hs-live-pulse 2.4s ease-out infinite;
}
@keyframes hs-live-pulse {
  0%   { transform: scale(.6); opacity: .9; }
  70%  { transform: scale(1.35); opacity: 0; }
  100% { transform: scale(1.35); opacity: 0; }
}
.hs-count-n { font-weight: 800; }
.hs-count-fresh { color: #8C877A; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .hs-live-dot::after { animation: none; opacity: .55; } }
/* Sized against the count beside it, which is 12px. This was 14px/600 in a
   1.5px box 34px tall — half again the type size of everything else in the
   row, so "Recommended" read as the headline and the count read as its
   caption. A sort control is a control, not a title. */
.hs-sort-btn {
  display: flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px;
  font-size: 12px; font-weight: 500; color: #4A5768;
  cursor: pointer; background: #fff; border: 1px solid #E4E6EA; border-radius: 8px; font-family: inherit;
  position: relative; user-select: none;
}
.hs-sort-btn:hover { background: #F5F6F8; }
.hs-sort-btn:focus { outline: none; }
.hs-sort-btn:focus-visible { outline: 2px solid rgba(22,38,60,.35); outline-offset: 2px; }
.hs-sort-dropdown {
  display: none; position: absolute; top: calc(100% + 6px); right: 0; z-index: 50;
  background: #fff; border: 1px solid rgba(28,43,58,0.12); border-radius: 10px;
  box-shadow: 0 8px 24px rgba(28,43,58,.16); padding: 6px; min-width: 160px;
}
.hs-sort-dropdown.open { display: block; }
.hs-sort-opt {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; text-align: left; padding: 10px 12px;
  font-size: 14px; font-weight: 500; color: #1C2B3A; border-radius: 8px;
  cursor: pointer; border: none; background: none; font-family: inherit;
  transition: background .1s;
}
.hs-sort-opt:hover { background: rgba(28,43,58,0.06); }
.hs-sort-opt.active { font-weight: 600; color: #16263C; }
.hs-sort-opt.active::after { content: '\2713'; color: #2F5270; font-size: 12px; }

/* ── Job cards ── */
.hs-list-scroll { display: flex; flex-direction: column; gap: 0; }
.hs-job-row {
  display: grid; grid-template-columns: 40px 1fr auto;
  gap: 16px; align-items: start;
  padding: 21px 20px 21px 37px;
  background: transparent; border: none; border-left: 3px solid transparent;
  border-bottom: 1px solid #E4E6EA; border-radius: 0;
  cursor: pointer; transition: background .1s, border-color .12s; position: relative;
}
.hs-job-row:last-child { border-bottom: none; }
.hs-job-row:hover { background: rgba(22,38,60,.035); }
.hs-job-row.selected { border-left-color: #16263C; background: rgba(22,38,60,.055); }
/* Rows are reachable by Tab and open on Enter or Space, signed in and signed
   out alike, so the one that has focus has to be visible. Inset, so the ring
   is not clipped by the scrolling list it sits in. */
.hs-job-row:focus { outline: none; }
.hs-job-row:focus-visible { outline: 2px solid #2C5AA0; outline-offset: -2px; }
.hs-job-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.hs-job-dismiss, .hs-job-save {
  width: 22px; height: 22px; border-radius: 6px; border: none;
  background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: #3A4453; transition: background .1s, color .1s; flex-shrink: 0; padding: 0;
}
.hs-job-fb { width: 22px; height: 22px; border-radius: 6px; border: none;
  background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: #3A4453; transition: background .1s, color .1s; flex-shrink: 0; padding: 0; }
.hs-job-fb:hover { background: rgba(28,43,58,.08); color: #16263C; }
.hs-job-dismiss:hover { background: rgba(0,0,0,.08); color: #5A5248; }
.hs-job-save:hover { background: rgba(28,43,58,.08); color: #16263C; }
.hs-explore-chip { display: inline-flex; align-items: center; margin-left: 8px;
  font-size: 10px; font-weight: 700; letter-spacing: .03em; color: #6E6858;
  background: #FFFFFF; border: 1px solid #E4E6EA; border-radius: 5px; padding: 1px 6px; }
.hs-fb-menu { position: fixed; z-index: 1000; min-width: 208px; background: #fff;
  border: 1px solid rgba(28,43,58,0.12); border-radius: 10px; box-shadow: 0 8px 24px rgba(28,43,58,.16);
  padding: 6px; display: none; }
.hs-fb-menu.open { display: block; }
.hs-fb-item { display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 7px 10px; border: none; background: transparent; border-radius: 7px;
  font-size: 13px; color: #4A637A; cursor: pointer; text-align: left; font-family: inherit; }
.hs-fb-item:hover { background: rgba(28,43,58,0.06); }
.hs-fb-item svg { color: #8C877A; flex-shrink: 0; }
.hs-fb-item.danger { color: #B0533A; }
.hs-fb-item.danger svg { color: #B0533A; }
.hs-fb-sep { height: 1px; background: #ECEDF0; margin: 4px 6px; }
.hs-job-save.saved { color: #3D6A9E; }
.hs-job-save.saved:hover { background: rgba(61,106,158,.1); color: #3D6A9E; }
.hs-job-logo {
  width: 40px; height: 40px; border-radius: 10px; overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.hs-job-main { min-width: 0; }
.hs-job-title { font-size: 15px; font-weight: 700; color: #16263C; line-height: 1.3; margin-bottom: 5px; letter-spacing: -0.01em; }
.hs-job-company { font-size: 13px; color: #16263C; }
/* ── Locked rows ──
   The employer is absent, not hidden with CSS: browseCardView never sent it.
   These styles only make that legible, which is why there is nothing here a
   devtools inspector could switch off to see a company name. */
.hs-job-company-locked { display: flex; align-items: center; gap: 5px; color: #7A879A; }
.hs-job-co-bar {
  display: inline-block; width: 78px; height: 10px; border-radius: 4px;
  background: linear-gradient(90deg,#DFE2E7 0%,#EDEEF1 55%,#DFE2E7 100%);
  filter: blur(2.5px);
}
/* The locked logo tile is frosted to match the row's company bar, so the two
   read as one obscured record rather than an icon beside a blurred field. */
.hs-job-row.is-locked .hs-job-logo-locked { filter: blur(.4px); }
.hs-job-sep { opacity: .5; }
/* Revealed by hover on the row, not by hovering this line itself — the whole
   row is the click target, so the hint has to follow the row's state. */
.hs-job-logo-locked {
  width: 40px; height: 40px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  background: #EEF2F8; color: #8C99AC; border: 1px solid #E2E8F1;
}
.hs-job-meta { font-size: 12.5px; color: #16263C; margin-top: 4px; }
.hs-job-match { font-size: 12px; color: #16263C; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hs-new-badge {
  display: inline-flex; align-items: center;
  margin-left: 7px; transform: translateY(-1px);
  font-size: 9px; font-weight: 800; letter-spacing: .08em;
  color: #fff; background: #B0533A; border-radius: 4px; padding: 2px 5px;
}
.hs-job-tags { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
.hs-job-tag {
  font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 5px; border: 1px solid rgba(22,38,60,.4);
  color: rgba(22,38,60,.82);
}

/* ── Detail pane (right column) ── */
.hs-detail-col {
  min-width: 0; height: 100%;
  overflow-y: auto;
  background: #FFFFFF;
  position: relative;
}
.hs-detail-inner {
  padding: 28px 36px 64px;
  max-width: 760px;
  position: relative;
}
.hs-detail-empty { display: flex; align-items: center; justify-content: center; min-height: 50vh; color: #A19C8C; font-size: 14px; }
/* The empty state is a flex ROW built for one centred line. A multi-paragraph
   panel dropped into it becomes one column per child — four stacked headings
   and sentences rendered side by side, each squeezed to a few characters
   wide. This modifier is for panels that are prose: normal block flow, left
   aligned, top of the pane rather than vertically centred. */
.hs-detail-empty.is-panel {
  display: block;
  align-items: initial;
  justify-content: initial;
  min-height: 0;
  text-align: left;
  max-width: 460px;
  padding-top: 8vh;
}

/* ── Locked (Free) Discover ───────────────────────────────────────────────
   The list column keeps its real shape so the page reads as a repository
   behind a paywall rather than an empty blocked screen, and the detail
   column — already the right-hand pane — carries the upgrade panel.

   WHAT IS IN THESE ROWS: nothing. They are grey bars, not blurred job data.
   A locked Free browser never fetches the corpus (discoverAllowed() stops
   the request, and the server 403s anyway), so there is no listing here to
   obscure. The blur is therefore decoration on placeholders — it is NOT the
   thing keeping job details private, and it must never become that. Blur is
   a CSS property; anyone can remove it in devtools. If real rows are ever
   rendered here, this stops being a visual treatment and starts being a
   fake control. */
/* A locked row: the ROLE is readable and the EMPLOYER is not. The blur sits
   on the company chip only — and it is decoration, because the company name
   is never sent to a locked browser in the first place (lockedPreviewRoute
   omits it). Blurring a field that is genuinely absent is honest; blurring
   one that is present in the DOM would not be. */
.hs-lock-row { cursor: default; }
.hs-lock-row:hover { background: transparent; }
.hs-lock-logo { width: 40px; height: 40px; border-radius: 10px; background: #E4E6EA; }
.hs-lock-role { color: #16263C; }
.hs-lock-meta { display: flex; align-items: center; gap: 7px; margin-top: 5px; flex-wrap: wrap; }
/* The blurred employer bar and its "Company hidden" note are gone with the
   thing they described. A guest sees the employer now; what they do not get
   is the apply link, and that is enforced by the response not carrying one
   rather than by CSS covering it up. */
.hs-lock-sub { font-size: 13px; color: #16263C; }
.hs-lock-row { cursor: pointer; transition: background .1s; }
.hs-lock-row:hover { background: rgba(22,38,60,.035); }
.hs-lock-row.selected { background: rgba(22,38,60,.055); box-shadow: inset 3px 0 0 #16263C; }
.hs-guest-facts { display: flex; flex-direction: column; gap: 10px; margin: 22px 0 24px; }
.hs-guest-facts > div { display: flex; align-items: baseline; gap: 16px; }
.hs-guest-facts span:first-child { flex: 0 0 88px; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #7A8FA6; }
.hs-guest-facts span:last-child { font-size: 14px; color: #16263C; }
/* The full posting, for a signed-out reader. Same shape as the one
   internship.html paints, and rendered by the same module. */
.hs-guest-desc { border-top: 1px solid rgba(30,58,95,.12); margin-top: 24px; padding-top: 20px; }
.hs-guest-desc-loading { margin-top: 24px; font-size: 13.5px; color: rgba(30,58,95,.55); }
.hs-guest-body { font-size: 14.5px; line-height: 1.68; color: #2C3E52; }
.hs-guest-body p { margin: 0 0 14px; }
.hs-guest-body h3 { margin: 22px 0 8px; font-size: 14px; font-weight: 700; letter-spacing: -.01em; color: #16263C; }
.hs-guest-body ul { margin: 0 0 14px; padding-left: 20px; }
.hs-guest-body li { margin: 0 0 6px; }
.hs-guest-abridged { margin: 18px 0 0; font-size: 12.5px; color: rgba(30,58,95,.55); }
.hs-guest-apply { display: inline-flex; align-items: center; justify-content: center; background: #16263C; color: #fff; font-size: 14px; font-weight: 700; padding: 12px 22px; border-radius: 999px; }
.hs-guest-apply:hover { background: #243b5c; }
.hs-guest-note { margin-top: 12px; font-size: 12.5px; color: #7A8FA6; line-height: 1.55; max-width: 420px; }
.hs-lock-cta--quiet { background: #16263C; }
.hs-lock-dot { color: #C9C4B8; }
.hs-lock-fresh { font-size: 12.5px; font-weight: 600; color: #5C6B7E; }
.hs-lock-loading { padding: 40px 22px; text-align: center; color: #A19C8C; font-size: 13.5px; }

/* End of the teaser. Sits inline at the bottom of the scrollable list, so
   reaching it is the result of scrolling through real roles rather than a
   banner shown before anything has been seen. */
.hs-lock-more {
  margin: 6px 14px 22px; padding: 20px 18px; text-align: center;
  background: #FFFFFF; border: 1px solid #ECEDF0; border-radius: 14px;
}
.hs-lock-more-title { font-size: 15px; font-weight: 800; color: #16263C; margin-bottom: 6px; letter-spacing: -0.01em; }
.hs-lock-more-sub { font-size: 12.5px; color: #8C877A; line-height: 1.5; margin-bottom: 14px; }

.hs-lock-panel { padding: 30px 0 8px; max-width: 380px; }
/* Placed at the upper third of the pane, not pinned to its top and not dead
   centre. Top-aligned it read as a page that had failed to finish loading —
   ~200px of content over several hundred pixels of white. Dead centre put it
   level with nothing: the list beside it starts at the top, so the eye had to
   travel down and back up. A third of the way down is where a reader's
   attention already is.
   Done with two flex spacers at a 1:2 ratio rather than a percentage or a
   fixed offset, so it stays a third at any pane height. Both shrink to zero
   before the panel does, so a short viewport clips white space rather than
   pushing the heading off the top. Scoped to the panel's own presence: the
   normal detail pane really does scroll and is untouched. */
.hs-detail-col:has(.hs-lock-panel) { display: flex; flex-direction: column; }
.hs-detail-col:has(.hs-lock-panel) > .hs-detail-inner {
  flex: 1; display: flex; flex-direction: column; padding-bottom: 28px;
}
.hs-detail-col:has(.hs-lock-panel) > .hs-detail-inner::before,
.hs-detail-col:has(.hs-lock-panel) > .hs-detail-inner::after {
  content: ''; flex-basis: 0; flex-shrink: 1;
}
.hs-detail-col:has(.hs-lock-panel) > .hs-detail-inner::before { flex-grow: 1; }
.hs-detail-col:has(.hs-lock-panel) > .hs-detail-inner::after { flex-grow: 2; }
.hs-detail-col:has(.hs-lock-panel) > .hs-detail-inner > .hs-lock-panel { flex: 0 0 auto; }
@media (max-width: 980px) {
  /* Stacked above the list, the pane is content-height, so a proportional
     position means nothing and the spacers are just a gap. */
  .hs-detail-col:has(.hs-lock-panel) > .hs-detail-inner { display: block; }
  .hs-detail-col:has(.hs-lock-panel) > .hs-detail-inner::before,
  .hs-detail-col:has(.hs-lock-panel) > .hs-detail-inner::after { display: none; }
}
/* Kept for the ONE panel that still earns it: "No reveals left", which is a
   real limit a student has reached. The signed-out panel no longer wears it -
   see renderLocked. */
.hs-lock-eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
  color: #6E6A5E; background: #F3F1EC; border-radius: 999px; padding: 5px 10px; margin-bottom: 14px;
}
.hs-lock-title { font-size: 20px; font-weight: 800; color: #16263C; letter-spacing: -0.02em; line-height: 1.25; margin-bottom: 10px; }
.hs-lock-body { font-size: 13.5px; line-height: 1.55; color: #6E6A5E; margin-bottom: 18px; }
.hs-lock-list { list-style: none; padding: 0; margin: 0 0 22px; }
.hs-lock-list li { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; color: #16263C; margin-bottom: 9px; }
.hs-lock-list svg { flex-shrink: 0; margin-top: 2px; color: #16263C; }
/* Softened off the near-black #16263C it used to be. At 22px of padding that
   value read as a slab rather than a button, and against this page's warm
   greys it was the highest-contrast thing on screen by a wide margin. */
.hs-lock-cta {
  display: inline-block; padding: 11px 22px; border-radius: 10px;
  background: #2C4260; color: #FFFFFF; font-weight: 650; font-size: 13.5px;
  text-decoration: none; transition: background .12s, transform .12s;
}
.hs-lock-cta:hover { background: #3A5478; transform: translateY(-1px); }
.hs-lock-cta:focus-visible { outline: 2px solid #1F6CE1; outline-offset: 3px; }
/* The free tier, under the Pro button. A sentence, not a panel: it is the
   fallback for someone who has decided against the button above it, and
   anything with a border or a fill competes with the offer instead of
   following it. */
.hs-lock-free {
  margin-top: 14px; font-size: 13px; line-height: 1.55; color: #6E6A5E;
}
.hs-lock-signin { color: #16263C; font-weight: 650; text-decoration: underline; text-underline-offset: 2px; }
.hs-lock-signin:hover { color: #2C4260; }
.hs-lock-free a {
  color: #2C4260; font-weight: 650; text-decoration: underline;
  text-underline-offset: 2px; text-decoration-color: rgba(44,66,96,.35);
}
.hs-lock-free a:hover { text-decoration-color: currentColor; }

/* ── Locked job: the frosted state ──
   .hs-lk-blur holds PLACEHOLDER bars and the (real) role title. Removing the
   filter in devtools shows grey rectangles — the employer, posting, comp and
   apply link are not in this DOM at all, because browseCardView never sent
   them. The blur communicates "there is something here"; browseCardView is
   what makes that true. */
/* min-height 100%, not a fixed 420px. The veil is inset:0 of THIS element, so
   the card centres on whatever this box is — and at 420px that box was the
   height of the blurred content, not of the pane. The card therefore sat high
   and slightly left of the panel's real centre, which looked arbitrary because
   it was: it was centred on something invisible. Filling the pane makes
   "centre" mean the centre of what you can see. */
.hs-lk-wrap { position: relative; min-height: 100%; box-sizing: border-box; }
.hs-lk-blur {
  filter: blur(5px); opacity: .55; user-select: none; pointer-events: none;
  /* Keeps the blur from bleeding past the panel edge into the list column. */
  overflow: hidden;
}
.hs-lk-logo {
  width: 56px; height: 56px; border-radius: 12px;
  background: linear-gradient(90deg,#DFE2E7 0%,#EDEEF1 55%,#DFE2E7 100%);
}
.hs-lk-bar {
  height: 11px; border-radius: 4px; margin: 7px 0;
  background: linear-gradient(90deg,#DFE2E7 0%,#EDEEF1 55%,#DFE2E7 100%);
}
.hs-lk-meta-row { display: flex; gap: 10px; align-items: center; }
.hs-lk-meta-row .hs-lk-bar { margin: 5px 0; }
.hs-lk-body { margin-top: 22px; }

/* The unlock control. Always readable — the blur is behind it, never on it —
   and it lifts on hover so the panel reads as one clickable surface. */
.hs-lk-veil {
  position: absolute; inset: 0; display: flex;
  align-items: center; justify-content: center; padding: 24px;
}
/* Gives .hs-lk-wrap's min-height:100% something to resolve against. Scoped to
   the locked state so the normal pane's scrolling is untouched. */
.hs-detail-col:has(.hs-lk-wrap) { display: flex; flex-direction: column; }
.hs-detail-col:has(.hs-lk-wrap) .hs-lk-wrap { flex: 1; }
.hs-lk-cta-wrap {
  max-width: 340px; text-align: center;
  background: rgba(255,255,255,.93);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  border: 1px solid #E2E8F1; border-radius: 16px; padding: 22px 22px 20px;
  box-shadow: 0 8px 30px rgba(22,38,60,.12);
  transition: transform .14s ease, box-shadow .14s ease;
}
.hs-lk-wrap:hover .hs-lk-cta-wrap {
  transform: translateY(-2px); box-shadow: 0 12px 38px rgba(22,38,60,.16);
}
.hs-lk-lock {
  width: 34px; height: 34px; margin: 0 auto 10px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: #EEF2F8; color: #5B7290;
}
.hs-lk-title { font-size: 15px; font-weight: 750; color: #16263C; letter-spacing: -.01em; }
.hs-lk-sub { font-size: 12.5px; line-height: 1.5; color: #6E819B; margin: 6px 0 14px; }
.hs-lk-btn {
  display: inline-block; padding: 10px 18px; border: none; border-radius: 10px;
  background: #1F5FB8; color: #fff; font-family: inherit;
  font-size: 13px; font-weight: 650; cursor: pointer; text-decoration: none;
}
.hs-lk-btn:hover:not(:disabled) { background: #1A4F9B; }
.hs-lk-btn:disabled { opacity: .65; cursor: default; }
@media (prefers-reduced-motion: reduce) {
  .hs-lk-wrap:hover .hs-lk-cta-wrap { transform: none; }
}

.hs-btn-reveal { background: #1F5FB8; border-color: #1F5FB8; color: #fff; }
.hs-btn-reveal:hover:not(:disabled) { background: #1A4F9B; }
.hs-btn-reveal:disabled { opacity: .65; cursor: default; }

/* Below 980px .hs-split collapses to one column, and without help that means
   list-then-detail: the selected role sits below the ENTIRE job list, which
   for any real result count is off-screen by a scroll of several thousand
   pixels. Reported plainly: "you can only see the list, you have to expand
   the window to even see the listing." A role IS auto-selected on load, so
   this was not a rare edge case — it was the default mobile experience.
   Unconditional now: it used to be scoped to body.discover-locked, whose
   author had already solved this exact problem for the signed-out lock
   panel and simply never carried the fix to the normal signed-in case. */
.hs-mobile-back { display: none; }
@media (max-width: 980px) {
  .hs-detail-col { order: -1; }
  .hs-mobile-back {
    display: inline-flex; align-items: center; gap: 6px;
    order: -2; margin: 14px 20px 0;
    font-size: 12.5px; font-weight: 700; color: #3D6A9E; text-decoration: none;
  }
  .hs-mobile-back:hover { color: #16263C; text-decoration: underline; }
  /* A phone shows one thing at a time: the list, or the role that was tapped
     (body.hs-m-detail), never a role stacked on top of the whole list. */
  body.hs-discover:not(.hs-m-detail):not(.discover-locked) .hs-detail-col,
  body.hs-discover:not(.hs-m-detail) .hs-mobile-back { display: none !important; }
  body.hs-discover.hs-m-detail .hs-list-col,
  body.hs-discover.hs-m-detail .hs-toolbar { display: none !important; }
  /* Too narrow for pay and type on one line: the pay stays, the type (almost
     always "Internship") goes rather than being cut off mid-word. */
  body.hs-discover .hs-job-tag:last-child:not(:first-child) { display: none; }
  body.hs-discover .hs-detail-inner { padding-top: 18px !important; }
  body.hs-discover:not(.hs-m-detail) .hs-job-row.selected { background: transparent; box-shadow: none; border-left-color: transparent; }
  .hs-lock-panel { padding: 18px 0 8px; max-width: none; }
  /* The list stays scrollable on narrow screens; the panel simply sits
     above it so the reason for the locked rows is read first. */
}
.hs-for-you-empty { padding: 52px 22px; text-align: center; color: #8C877A; }
.hs-for-you-empty-title {
  font-family: 'Plus Jakarta Sans', var(--sidebar-f), system-ui, sans-serif;
  font-size: 16px; font-weight: 800; color: #16263C; margin-bottom: 6px;
}
.hs-for-you-empty-copy { font-size: 13px; line-height: 1.45; margin-bottom: 16px; }
.hs-empty-actions { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.hs-empty-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 34px; padding: 0 13px; border-radius: 8px;
  border: 1px solid #E4E6EA; background: #fff;
  color: #16263C; font-size: 13px; font-weight: 600;
  text-decoration: none; cursor: pointer; font-family: inherit;
}
